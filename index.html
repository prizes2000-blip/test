function downloadBlob(blob, filename) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
async function ensureJSZip() {
  if (typeof JSZip !== 'undefined') return true;
  return new Promise((resolve) => {
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    script.onload = () => resolve(typeof JSZip !== 'undefined');
    script.onerror = () => resolve(false);
    document.head.appendChild(script);
  });
}
window.exportBackup = async function () {
  try {
    const ok = await ensureJSZip(); if (!ok) { toast('تعذر تجهيز JSZip', 'error'); return; }
    showLoading('جاري التجهيز...');
    const stamp = new Date();
    const dateStr = stamp.toISOString().replace(/[:.]/g, '-').slice(0, 19);
    const zip = new JSZip();
    const dataFolder = zip.folder('data');
    dataFolder.file('orders.json', JSON.stringify(cache.orders || [], null, 2));
    dataFolder.file('ready.json', JSON.stringify(cache.ready || [], null, 2));
    dataFolder.file('transferred.json', JSON.stringify(cache.transferred || [], null, 2));
    dataFolder.file('log.json', JSON.stringify(cache.log || [], null, 2));
    dataFolder.file('customers.json', JSON.stringify(cache.customers || [], null, 2));
    dataFolder.file('notifications.json', JSON.stringify(cache.notifications || [], null, 2));
    dataFolder.file('groups.json', JSON.stringify(cache.groups || [], null, 2));
    dataFolder.file('tasks.json', JSON.stringify(cache.tasks || [], null, 2));
    dataFolder.file('settings.json', JSON.stringify({ users: cache.users || [], drivers: cache.drivers || [], branches: cache.branches || [], customFields: cache.customFields || [], templates: templates || {}, whatsappTemplates: whatsappTemplates || {}, invoiceSettings: invoiceSettings || {} }, null, 2));
    dataFolder.file('meta.json', JSON.stringify({ lastUpdate: new Date().toISOString(), version: 10, appVersion: APP_VERSION, featureFlags, invoiceSettings, analyticsSettings: localMeta?.analyticsSettings }, null, 2));
    const activityFolder = dataFolder.folder('activity');
    const byMonth = {};
    (cache.activity || []).forEach(a => { const m = a.month || getMonthKey(a.ts ? new Date(a.ts) : new Date()); if (!byMonth[m]) byMonth[m] = []; byMonth[m].push(a); });
    Object.keys(byMonth).forEach(m => { activityFolder.file(`${m}.json`, JSON.stringify(byMonth[m], null, 2)); });
    const info = { name: 'نظام إدارة الطلبات v4.0', createdAt: stamp.toISOString(), createdBy: currentUser?.username || 'unknown', structure: 'v10' };
    zip.file('backup-info.json', JSON.stringify(info, null, 2));
    const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 9 } });
    downloadBlob(blob, `backup_${dateStr}.zip`);
    hideLoading();
    logActivity('backup', `تصدير ZIP`, `${(blob.size / 1024).toFixed(1)} KB`, 'success');
    toast(`تم التصدير (${(blob.size / 1024).toFixed(1)} KB)`, 'success');
  } catch (e) { hideLoading(); toast('تعذر التصدير', 'error'); }
};

window.go = function (page) {
  const pagePerm = { dashboard:'accessDashboard', entry:'accessEntry', groups:'accessGroups', ready:'accessReady', transferred:'accessTransferred', log:'accessLog', customers:'accessCustomers', tasks:'accessTasks', settings:'accessSettings' };
  if (pagePerm[page] && !hasPerm(pagePerm[page])) { toast(MSG.unauthorized, 'error'); return; }
  if (page === 'groups' && !isFeatureEnabled('featureWorkGroups')) { toast('الميزة معطّلة', 'error'); return; }
  if (page === 'tasks' && !isFeatureEnabled('featureTasks')) { toast('الميزة معطّلة', 'error'); return; }
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + page)?.classList.add('active');
  document.querySelector(`nav button[data-page="${page}"]`)?.classList.add('active');
  try {
    if (page === 'dashboard') renderDashboard();
    if (page === 'entry') { populateAllSelects(); loadDriversIntoSelects(); renderEntry(); }
    if (page === 'groups') { populateAllSelects(); renderGroups(); }
    if (page === 'ready') { populateAllSelects(); renderReady(); }
    if (page === 'transferred') { populateAllSelects(); renderTransferred(); }
    if (page === 'log') {
      populateAllSelects(); renderLog();
      if (_logNormalizationPending) {
        _logNormalizationPending = false;
        scheduleLogNormalizationSave();
      }
    }
    if (page === 'customers') renderCustomers();
    if (page === 'tasks') { populateAllSelects(); renderTasks(); }
    if (page === 'settings') { rebuildSettingsTabs(); renderSettings(); updateCurrentKeyInfo(); renderWhatsAppTemplates(); }
  } catch (e) { console.warn('go:', e); }
};
window.switchTab = function (evt, tab) {
  const tabPerm = { token:'tabToken', activity:'tabActivity', analytics:'tabAnalytics', invoice:'tabInvoice', branches:'tabBranches', drivers:'tabDrivers', users:'tabUsers', templates:'tabTemplates', whatsapp:'tabWhatsApp', customfields:'tabCustomFields', backup:'tabBackup' };
  if (tabPerm[tab] && !hasPerm(tabPerm[tab])) { toast(MSG.unauthorized, 'error'); return; }
  if (tab === 'customfields' && !isFeatureEnabled('featureCustomFields')) { toast('الميزة معطّلة', 'error'); return; }
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.style.display = 'none');
  const btn = evt.target.closest('.tab-btn'); if (btn) btn.classList.add('active');
  const panel = document.getElementById('tab-' + tab);
  if (panel) panel.style.display = 'block';
  if (tab === 'templates') renderTemplates();
  if (tab === 'whatsapp') renderWhatsAppTemplates();
  if (tab === 'token') updateCurrentKeyInfo();
  if (tab === 'invoice') loadInvoiceSettingsToForm();
  if (tab === 'activity') { activityCurrentPage = 1; renderActivity(); }
  if (tab === 'analytics') loadAnalyticsSettingsToForm();
  if (tab === 'users') renderUsers();
  if (tab === 'customfields') renderCustomFieldsList();
};

window.doLogin = async function () {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginError');
  const loadEl = document.getElementById('loginLoading');
  const btn = document.getElementById('loginBtn');
  errEl.classList.remove('show'); errEl.textContent = ''; loadEl.textContent = '';
  const keyFieldEl = document.getElementById('keyField');
  if (keyFieldEl.style.display !== 'none') { const t = document.getElementById('loginKey').value.trim(); if (t) { saveKey(t); updateKeyStatus(); } }
  if (!getStoredKey()) { errEl.textContent = MSG.keyMissing; errEl.classList.add('show'); return; }
  if (!u || !p) { errEl.textContent = 'يرجى إدخال اسم المستخدم وكلمة المرور'; errEl.classList.add('show'); return; }
  if (location.protocol === 'file:') { errEl.textContent = 'يرجى فتح النظام عبر الرابط الرسمي'; errEl.classList.add('show'); return; }
  btn.disabled = true;
  loadEl.textContent = 'جاري التحقق...';
  showLoading('جاري التحقق من البيانات...', 20);
  try {
    setLoadingProgress(50, 'جاري تحميل البيانات...');
    await readAll(); await loadActivity();
    const meta = await readMeta();
    localMeta = meta; loadFeatureFlags();
    setLoadingProgress(80, 'جاري تسجيل الدخول...');
    if (!cache.users.length) { errEl.textContent = MSG.storageIssues; errEl.classList.add('show'); btn.disabled = false; loadEl.textContent = ''; hideLoading(); return; }
    let found = null;
    for (const candidate of cache.users) { if (candidate.username !== u) continue; const ok = await Crypto.verifyPassword(p, candidate); if (ok) { found = candidate; break; } }
    if (!found) { errEl.textContent = MSG.authFail; errEl.classList.add('show'); btn.disabled = false; loadEl.textContent = ''; hideLoading(); return; }
    if (Crypto.needsMigration(found)) {
      try {
        const { passwordHash, passwordSalt, passwordAlgo } = await Crypto.hashPassword(p);
        found.passwordHash = passwordHash; found.passwordSalt = passwordSalt; found.passwordAlgo = passwordAlgo;
        delete found.password;
        const idx = cache.users.findIndex(x => x.id === found.id);
        if (idx > -1) cache.users[idx] = found;
        persistKeys(['users']).catch(() => {});
      } catch (e) {}
    }
    hideKeyForever();
    if (hasLegacyFiles && found.role === ROLE_OWNER) {
      hideLoading();
      const ok = await dialog.confirm('سيتم تحديث طريقة حفظ البيانات، هل تريد المتابعة؟', { title: 'تحديث', okText: 'الآن', cancelText: 'لاحقاً' });
      if (ok) { try { showLoading('جاري التحديث...'); await saveAllDataNow(); hideLoading(); hasLegacyFiles = false; } catch (e2) { hideLoading(); } }
    }
    setLoadingProgress(100, 'تم الدخول');
    localStorage.setItem('oms_lastUser', u);
    currentUser = normalizeUser(found);
    logActivity('login', `تسجيل دخول: ${u}`, `الدور: ${currentUser.role}`, 'success');
    loadEl.textContent = 'تم الدخول';
    hideLoading();
    startApp();
    if (_logNormalizationPending) {
      _logNormalizationPending = false;
      scheduleLogNormalizationSave();
    }
  } catch (e) { errEl.textContent = e.message || MSG.connFail; errEl.classList.add('show'); hideLoading(); }
  finally { btn.disabled = false; }
};
window.logout = async function (silent = false) {
  if (!silent) { const ok = await dialog.confirm('هل تريد تسجيل الخروج؟', { title: 'تسجيل الخروج' }); if (!ok) return; }
  if (currentUser) logActivity('logout', `خروج: ${currentUser.username}`, '', 'info');
  try { await flushNotificationsSave(); } catch {}
  try { await flushActivitySave(); } catch {}
  try { await SaveQueue.drain(); } catch (_) {}
  stopPolling();
  currentUser = null; selectedOrderId = null; selectedReadyIds.clear();
  Storage.resetCache(); localMeta = null;
  currentSyncInterval = SYNC_INTERVAL; lastSyncTime = 0;
  _logNormalizationPending = false;
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginPass').value = ''; document.getElementById('loginLoading').textContent = '';
  const adminSection = document.getElementById('adminTokenSection'); if (adminSection) adminSection.classList.remove('show');
  updateKeyStatus(); loadLastUser();
  if (!silent) toast('تم تسجيل الخروج بنجاح', 'success');
};
function loadLastUser() {
  const last = localStorage.getItem('oms_lastUser');
  if (last) { document.getElementById('loginUser').value = last; setTimeout(() => document.getElementById('loginPass').focus(), 150); }
}

function startApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  const rl = roleLabel(currentUser.role);
  document.getElementById('currentUserName').innerHTML = `${esc(currentUser.username)} <span style="opacity:.75;font-size:11px;margin-right:4px;">${rl.label}</span>`;

  try { buildUI(); } catch (e) { console.error('buildUI:', e); }
  try { applyPermissionsUI(); } catch (e) { console.error('perms:', e); }
  try { populateAllSelects(); } catch (e) { console.error('selects:', e); }
  try { loadDriversIntoSelects(); } catch (e) { console.error('drivers:', e); }
  try { renderRateLimitWidget(); } catch (e) { console.error('rate:', e); }

  const firstAvailable = ['dashboard','entry','groups','ready','transferred','log','tasks','customers','settings'].find(p => {
    const pp = { dashboard:'accessDashboard', entry:'accessEntry', groups:'accessGroups', ready:'accessReady', transferred:'accessTransferred', log:'accessLog', customers:'accessCustomers', tasks:'accessTasks', settings:'accessSettings' };
    if (!hasPerm(pp[p])) return false;
    if (p === 'groups' && !isFeatureEnabled('featureWorkGroups')) return false;
    if (p === 'tasks' && !isFeatureEnabled('featureTasks')) return false;
    return true;
  }) || 'dashboard';

  try { go(firstAvailable); } catch (e) { console.error('go:', e); }

  setTimeout(() => { try { renderActive(); } catch (_) {} }, 500);

  startPolling();
  renderNotifications();
  attachVisibilityHandler(); attachOnlineHandlers();
  initBroadcast();
  try { applyFeatureUI(); } catch (_) {}
  toast(`أهلاً ${currentUser.username}`, 'success');
}

let _visHandlerAttached = false;
function attachVisibilityHandler() {
  if (_visHandlerAttached) return;
  _visHandlerAttached = true;
  document.addEventListener('visibilitychange', () => {
    if (!currentUser) return;
    startPolling();
    if (!document.hidden) {
      lastSyncTime = 0;
      syncPull(true).catch(() => {});
    }
  });
}

let _onlineHandlerAttached = false;
function attachOnlineHandlers() {
  if (_onlineHandlerAttached) return;
  _onlineHandlerAttached = true;
  window.addEventListener('online', () => {
    if (!currentUser) return;
    lastSyncTime = 0;
    localMeta = null;
    setOnline(true);
    syncPull(true).catch(() => {});
  });
  window.addEventListener('offline', () => { setOnline(false); });
}

function renderTemplates() {
  const container = document.getElementById('templatesContainer'); if (!container) return;
  if (!hasPerm('editTemplates')) { container.innerHTML = `<div class="perm-note">غير مصرح لك بتعديل القوالب</div>`; return; }
  const logoHTML = templates.logo
    ? `<div class="logo-preview"><img src="${templates.logo}" alt=""></div><div style="margin-top:10px;"><button class="btn btn-danger btn-sm" onclick="removeLogo()">${ico('trash', 13)}<span>حذف الشعار</span></button></div>`
    : `<div class="logo-preview"><span class="empty-logo">لا توجد صورة</span></div>`;
  const paperOptions = Object.entries(PAPER_SIZES).map(([k, v]) => `<option value="${k}" ${(templates.paperSize || 'A4') === k ? 'selected' : ''}>${v.label}</option>`).join('');
  const logoSection = `<div class="template-card"><h4>${ico('image', 17)}<span>شعار الطباعة</span></h4>
    <input type="file" accept="image/*" onchange="handleLogoUpload(event)" style="padding:8px;font-size:13px;">
    ${logoHTML}
    <div class="logo-size-row"><div><label style="font-size:12px;font-weight:600;display:block;margin-bottom:6px;">العرض (مم)</label><input type="number" min="10" max="500" value="${templates.logoWidth || 180}" onchange="updateLogoSize('logoWidth', this.value)"></div>
      <div><label style="font-size:12px;font-weight:600;display:block;margin-bottom:6px;">الارتفاع (مم)</label><input type="number" min="10" max="500" value="${templates.logoHeight || 40}" onchange="updateLogoSize('logoHeight', this.value)"></div></div>
    <div style="margin-top:11px;"><label style="font-size:12px;font-weight:600;display:block;margin-bottom:6px;">حجم الورقة</label><select onchange="updatePaperSize(this.value)">${paperOptions}</select></div>
  </div>`;
  const bodyHTML = ['ready','transferred','log','group'].map(key => {
    const t = { ...DEFAULT_TEMPLATES[key], ...(templates[key] || {}) };
    const label = key === 'ready' ? 'الجاهزة' : key === 'transferred' ? 'التي تم نقلها' : key === 'log' ? 'السجل' : 'المجموعات';
    const cols = PRINT_COLUMNS[key] || PRINT_COLUMNS.ready;
    const chipsHTML = cols.map(c => { const isVisible = t[c.key] !== false; return `<button type="button" class="col-chip ${isVisible ? 'active' : ''}" onclick="toggleCol('${c.key}', '${key}')">${ico(isVisible ? 'eye' : 'eyeOff', 12)}<span>${c.label}</span><span class="col-chip-status">${isVisible ? 'ظاهر' : 'مخفي'}</span></button>`; }).join('');
    return `<div class="template-card"><h4>${ico(key === 'ready' ? 'box' : key === 'transferred' ? 'transfer' : key === 'log' ? 'archive' : 'layers', 17)}<span>${label}</span></h4>
      <div class="template-row"><label>العنوان</label><input value="${esc(t.title)}" onchange="updateTemplate('${key}', 'title', this.value)"></div>
      <div class="template-row"><label>السطر الفرعي</label><input value="${esc(t.subtitle)}" onchange="updateTemplate('${key}', 'subtitle', this.value)"></div>
      <div class="template-row"><label>التذييل</label><input value="${esc(t.footer || '')}" onchange="updateTemplate('${key}', 'footer', this.value)"></div>
      <div class="template-row"><label>حجم الخط (pt)</label><input type="number" value="${t.fontSize || 10}" min="6" max="18" step="0.5" onchange="updateTemplate('${key}', 'fontSize', +this.value)"></div>
      <div class="template-columns-section"><div class="tcs-title">${ico('grid', 14)}<span>الأعمدة الظاهرة في الطباعة</span></div>
        <div class="col-toggles-actions"><button type="button" onclick="setAllCols('${key}', true)">${ico('eye', 11)}<span>إظهار الكل</span></button><button type="button" onclick="setAllCols('${key}', false)">${ico('eyeOff', 11)}<span>إخفاء الكل</span></button></div>
        <div class="col-toggles">${chipsHTML}</div></div>
    </div>`;
  }).join('');
  container.innerHTML = logoSection + bodyHTML;
}
window.updateTemplate = function (key, field, value) { if (!templates[key]) templates[key] = { ...DEFAULT_TEMPLATES[key] }; templates[key][field] = value; };
window.toggleCol = function(key, tplKey) { if (!hasPerm('editTemplates')) return; if (!templates[tplKey]) templates[tplKey] = { ...DEFAULT_TEMPLATES[tplKey] }; const cur = templates[tplKey][key] !== false; templates[tplKey][key] = !cur; renderTemplates(); };
window.setAllCols = function(tplKey, visible) { if (!hasPerm('editTemplates')) return; if (!templates[tplKey]) templates[tplKey] = { ...DEFAULT_TEMPLATES[tplKey] }; (PRINT_COLUMNS[tplKey] || []).forEach(c => { templates[tplKey][c.key] = visible; }); renderTemplates(); };
window.updateLogoSize = function(field, value) { if (!hasPerm('editTemplates')) return; templates[field] = Math.max(10, Math.min(500, parseFloat(value) || 0)); };
window.updatePaperSize = function(value) { if (!hasPerm('editTemplates')) return; templates.paperSize = value; };
window.handleLogoUpload = async function (evt) {
  const file = evt.target.files[0]; if (!file) return;
  if (!hasPerm('editTemplates')) { toast(MSG.unauthorized, 'error'); return; }
  if (!file.type.startsWith('image/')) { toast('يرجى اختيار صورة', 'error'); return; }
  if (file.size > 5 * 1024 * 1024) { toast('حجم الصورة كبير جداً', 'error'); return; }
  try { toast('جاري المعالجة...', 'info'); templates.logo = await resizeImage(file, 1400); renderTemplates(); toast('تم بنجاح', 'success'); }
  catch { toast('تعذر معالجة الصورة', 'error'); }
  evt.target.value = '';
};
window.removeLogo = function () { if (!hasPerm('editTemplates')) return; templates.logo = ''; renderTemplates(); toast('تم الحذف', 'info'); };
async function resizeImage(file, maxWidth = 1400) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const ratio = Math.min(1, maxWidth / img.width);
        canvas.width = Math.round(img.width * ratio); canvas.height = Math.round(img.height * ratio);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = reject; img.src = e.target.result;
    };
    reader.onerror = reject; reader.readAsDataURL(file);
  });
}

/* ══════════════════════════════════════════════════════════════
   KEYBOARD

function handleEnterNavigation(e) {
  if (e.key !== 'Enter') return;
  const el = e.target;
  if (el.tagName === 'TEXTAREA') { if (e.ctrlKey || e.metaKey) { e.preventDefault(); const mid = el.closest('.modal-bg')?.id; if (mid === 'orderModal') saveOrder(); else if (mid === 'customerModal') saveCustomer(); else if (mid === 'userModal') saveUser(); else if (mid === 'driverModal') saveDriverEdit(); } return; }
  if (el.tagName !== 'INPUT' && el.tagName !== 'SELECT') return;
  if (e.ctrlKey || e.metaKey) { e.preventDefault(); const mid = el.closest('.modal-bg')?.id; if (mid === 'orderModal') saveOrder(); else if (mid === 'customerModal') saveCustomer(); else if (mid === 'userModal') saveUser(); else if (mid === 'keyModal') saveNewKey(); else if (mid === 'customFieldModal') saveCustomField(); else if (mid === 'taskModal') saveTask(); else if (mid === 'groupModal') saveGroup(); else if (mid === 'driverModal') saveDriverEdit(); return; }
  e.preventDefault();
  const modal = el.closest('.modal'); if (!modal) return;
  const fields = Array.from(modal.querySelectorAll('input:not([type=hidden]):not([disabled]), select:not([disabled]), textarea')).filter(f => f.offsetParent !== null && !f.readOnly);
  const idx = fields.indexOf(el); if (idx === -1) return;
  const nextIdx = e.shiftKey ? idx - 1 : idx + 1;
  if (nextIdx >= 0 && nextIdx < fields.length) { fields[nextIdx].focus(); if (fields[nextIdx].select) fields[nextIdx].select(); }
  else if (!e.shiftKey) { const mid = modal.parentElement.id; if (mid === 'orderModal') saveOrder(); else if (mid === 'customerModal') saveCustomer(); else if (mid === 'userModal') saveUser(); else if (mid === 'keyModal') saveNewKey(); else if (mid === 'customFieldModal') saveCustomField(); else if (mid === 'taskModal') saveTask(); else if (mid === 'groupModal') saveGroup(); else if (mid === 'driverModal') saveDriverEdit(); }
}
['orderModal','customerModal','userModal','keyModal','customFieldModal','taskModal','groupModal','driverModal'].forEach(id => { const m = document.getElementById(id); if (m) m.addEventListener('keydown', handleEnterNavigation); });
function isInInput() { const t = document.activeElement?.tagName; return t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT'; }
window.addEventListener('keydown', e => {
  const inInput = isInInput(); const activeModal = getActiveModal(); const dialogActive = document.getElementById('dialogBg').classList.contains('active');
  if (dialogActive) { if (e.key === 'Enter') { e.preventDefault(); dialogResolve(true); } if (e.key === 'Escape') { e.preventDefault(); dialogResolve(false); } return; }
  if (e.key === 'Escape' && activeModal) { activeModal.classList.remove('active'); return; }
  if (e.key === 'F1') { e.preventDefault(); showShortcuts(); return; }
  if (e.ctrlKey || e.metaKey) {
    const c = e.code;
    if (c === 'Equal' || c === 'NumpadAdd') { e.preventDefault(); zoomIn(); return; }
    if (c === 'Minus' || c === 'NumpadSubtract') { e.preventDefault(); zoomOut(); return; }
    if (c === 'Digit0' || c === 'Numpad0') { e.preventDefault(); zoomReset(); return; }
    if (c === 'KeyS') { e.preventDefault(); if (activeModal?.id === 'orderModal') saveOrder(); else if (activeModal?.id === 'customerModal') saveCustomer(); else if (activeModal?.id === 'userModal') saveUser(); else if (activeModal?.id === 'keyModal') saveNewKey(); else if (activeModal?.id === 'driverModal') saveDriverEdit(); return; }
    if (c === 'KeyK') { e.preventDefault(); const p = document.querySelector('.page.active')?.id?.replace('page-', ''); const map = { entry: 'entrySearch', ready: 'readySearch', transferred: 'transferredSearch', log: 'logSearch', customers: 'custSearch', tasks: 'tasksSearch' }; const elId = map[p]; if (elId) document.getElementById(elId)?.focus(); return; }
    if (c === 'KeyP') { e.preventDefault(); if (document.getElementById('page-ready').classList.contains('active')) printReady(); else if (document.getElementById('page-transferred').classList.contains('active')) printTransferred(); else if (document.getElementById('page-log').classList.contains('active')) printLog(); else window.print(); return; }
    return;
  }
  if (e.altKey) {
    const c = e.code;
    if (!activeModal) {
      if (c === 'Digit1' || c === 'Numpad1') { e.preventDefault(); if (hasPerm('accessDashboard')) go('dashboard'); return; }
      if (c === 'Digit2' || c === 'Numpad2') { e.preventDefault(); if (hasPerm('accessEntry')) go('entry'); return; }
      if (c === 'Digit3' || c === 'Numpad3') { e.preventDefault(); if (hasPerm('accessGroups')) go('groups'); return; }
      if (c === 'Digit4' || c === 'Numpad4') { e.preventDefault(); if (hasPerm('accessReady')) go('ready'); return; }
      if (c === 'Digit5' || c === 'Numpad5') { e.preventDefault(); if (hasPerm('accessTransferred')) go('transferred'); return; }
      if (c === 'Digit6' || c === 'Numpad6') { e.preventDefault(); if (hasPerm('accessLog')) go('log'); return; }
      if (c === 'KeyN') { e.preventDefault(); if (hasPerm('addOrder')) addOrder(); return; }
      if (c === 'KeyB' && document.getElementById('page-entry').classList.contains('active')) { e.preventDefault(); bulkTransfer(); return; }
      if (c === 'KeyM' && document.getElementById('page-ready').classList.contains('active')) { e.preventDefault(); moveReadyToLog(); return; }
      if (c === 'KeyD') { e.preventDefault(); toggleTheme(); return; }
      if (c === 'KeyI') { e.preventDefault(); toggleNotifPanel(); return; }
    }
    return;
  }
  if (!inInput && !activeModal && e.key === 'Delete') {
    const p = document.querySelector('.page.active')?.id?.replace('page-', '');
    if (p === 'entry' && selectedOrderId && hasPerm('deleteOrder')) { e.preventDefault(); deleteOrder(selectedOrderId); }
  }
});
['orderInvoice','orderCustomer','orderLocation','orderStatus','orderReceiptMethod','orderDriver','orderDriverPhone','orderBranch','orderNotes'].forEach(id => {

function saveDraft() {
  if (!document.getElementById('orderModal').classList.contains('active')) return;
  const draft = { invoice: document.getElementById('orderInvoice').value, branch: document.getElementById('orderBranch').value, customer: document.getElementById('orderCustomer').value, customerId: document.getElementById('orderCustomerId').value, customerPhone: document.getElementById('orderCustomerPhone').value, location: document.getElementById('orderLocation').value, status: document.getElementById('orderStatus').value, receiptMethod: document.getElementById('orderReceiptMethod').value, driver: document.getElementById('orderDriver').value, driverPhone: document.getElementById('orderDriverPhone').value, notes: document.getElementById('orderNotes').value };
  if (draft.invoice || draft.customer) { localStorage.setItem(DRAFT_KEY, JSON.stringify(draft)); document.getElementById('draftBadge').classList.add('show'); }
}
function clearDraft() { localStorage.removeItem(DRAFT_KEY); document.getElementById('draftBadge').classList.remove('show'); }
window.discardDraft = function () { clearDraft(); toast('تم حذف المسودة', 'info'); };
window.restoreDraft = function () {
  const raw = localStorage.getItem(DRAFT_KEY); if (!raw) return;
  try {
    const d = JSON.parse(raw);
    addOrder(true);
    document.getElementById('orderInvoice').value = d.invoice || '';
    if (d.branch) document.getElementById('orderBranch').value = d.branch;
    document.getElementById('orderCustomer').value = d.customer || '';
    document.getElementById('orderCustomerId').value = d.customerId || '';
    document.getElementById('orderCustomerPhone').value = d.customerPhone || '';
    document.getElementById('orderLocation').value = d.location || '';
    document.getElementById('orderStatus').value = d.status || ORDER_STATUS.PROGRESS;
    if (d.receiptMethod) {
      document.getElementById('orderReceiptMethod').value = d.receiptMethod;
      onReceiptMethodChange();
    }
    document.getElementById('orderDriver').value = d.driver || '';
    document.getElementById('orderDriverPhone').value = d.driverPhone || '';
    document.getElementById('orderNotes').value = d.notes || '';
    toast('تم استرجاع المسودة', 'success');
  } catch { clearDraft(); }
};

<script>
(function () {
    function prepareTablesForPrint() {
        const tables = document.querySelectorAll('table');
        tables.forEach(function (table) {
            const headers = table.querySelectorAll('thead th');
            let notesIndex = -1;
            headers.forEach(function (th, index) {
                const text = (th.textContent || '').trim().replace(/\s+/g, ' ');
                if (text.includes('ملاحظات') || text.includes('ملاحظة') || text.toLowerCase().includes('notes')) notesIndex = index;
            });
            const rows = table.querySelectorAll('tr');
            rows.forEach(function (row) {
                const cells = row.querySelectorAll('th, td');
                cells.forEach(function (cell, index) {
                    if (index === notesIndex) { cell.style.whiteSpace = 'normal'; cell.style.overflow = 'visible'; cell.style.overflowWrap = 'anywhere'; return; }
                    cell.style.whiteSpace = 'nowrap'; cell.style.overflow = 'hidden';
                    if (cell.tagName.toLowerCase() === 'td') {
                        let fontSize = 9; cell.style.fontSize = fontSize + 'px';
                        while (cell.scrollWidth > cell.clientWidth && fontSize > 6) { fontSize -= 0.25; cell.style.fontSize = fontSize + 'px'; }
                    }
                });
            });
        });
    }
    window.addEventListener('beforeprint', function () { prepareTablesForPrint(); });
    if (window.matchMedia) {
        const mediaQuery = window.matchMedia('print');
        mediaQuery.addEventListener('change', function (event) { if (event.matches) prepareTablesForPrint(); });
    }
})();
</script>
