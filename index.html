/* ══════════════════════════════════════════════════════════════
   RATE LIMIT
   ══════════════════════════════════════════════════════════════ */
function updateRateLimit(headers) {
  const remaining = headers.get('X-RateLimit-Remaining');
  const limit = headers.get('X-RateLimit-Limit');
  const reset = headers.get('X-RateLimit-Reset');
  if (remaining !== null && limit !== null) {
    rateLimitInfo = { remaining: parseInt(remaining), limit: parseInt(limit), reset: reset ? new Date(parseInt(reset) * 1000) : null };
    renderRateLimitWidget(); adjustSyncInterval(); maybeNotifyLowRate();
  }
}
function renderRateLimitWidget() {
  const widget = document.getElementById('rateWidget'); const fill = document.getElementById('rateFill');
  const text = document.getElementById('rateText'); const icon = document.getElementById('rateIcon');
  if (!widget || !fill || !text) return;
  if (icon && !icon.innerHTML) icon.innerHTML = ico('zap', 12);
  if (!rateLimitInfo) { text.textContent = '— / —'; fill.style.width = '0%'; return; }
  const { remaining, limit, reset } = rateLimitInfo;
  const pct = limit > 0 ? Math.max(0, Math.min(100, (remaining / limit) * 100)) : 0;
  fill.style.width = pct + '%';
  text.textContent = `${remaining.toLocaleString('en-US')} / ${limit.toLocaleString('en-US')}`;
  widget.classList.remove('warn','danger');
  if (pct < 10) widget.classList.add('danger'); else if (pct < 30) widget.classList.add('warn');
  const resetStr = reset ? reset.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }) : '—';
  const level = getRateLevel(remaining);
  widget.title = `الحصة\nالمتبقي: ${remaining.toLocaleString('en-US')} من ${limit.toLocaleString('en-US')}\nالنسبة: ${pct.toFixed(1)}%\nالمستوى: ${level.label}\nيتجدد الساعة: ${resetStr}`;
}
function getRateLevel(remaining) { for (const lvl of RATE_LEVELS) { if (remaining >= lvl.min) return lvl; } return RATE_LEVELS[RATE_LEVELS.length - 1]; }
function adjustSyncInterval() {
  if (!rateLimitInfo) return;
  const level = getRateLevel(rateLimitInfo.remaining);
  if (level.interval === currentSyncInterval) return;
  currentSyncInterval = level.interval;
  if (!currentUser) return;
  if (currentSyncInterval > 0) startPolling(); else stopPolling();
}
function maybeNotifyLowRate() {
  if (!rateLimitInfo) return;
  const now = Date.now();
  if (now - lastRateNotificationAt < 30 * 60 * 1000) return;
  const pct = rateLimitInfo.limit > 0 ? (rateLimitInfo.remaining / rateLimitInfo.limit) * 100 : 100;
  if (pct < 10) { lastRateNotificationAt = now; addDeliveryNotification('تنبيه الحصة', `استهلاك منخفض: ${rateLimitInfo.remaining} طلب متبقي`, 'warning'); }
}

function canManageUser(t) {

  if (currentUser.role === ROLE_OWNER) return true;
  if (currentUser.role === ROLE_MANAGER) return !!(currentUser.permissions?.manageUsers && t.role === ROLE_WORKER);
  return false;
}
function getGrantablePerms(targetRole) {
  if (!currentUser) return [];
  if (currentUser.role === ROLE_OWNER) { if (targetRole === ROLE_OWNER) return []; return ALL_PERM_KEYS; }
  if (currentUser.role === ROLE_MANAGER) { if (targetRole === ROLE_OWNER || targetRole === ROLE_MANAGER) return []; return ALL_PERM_KEYS.filter(k => currentUser.permissions?.[k] === true); }
  return [];
}
function getAllowedRolesToCreate() {

  if (perm === 'tabUsers' && currentUser.permissions?.manageUsers === true) return true;
  if (perm === 'tabInvoice' && currentUser.permissions?.manageInvoice === true) return true;

function normalizeUser(u) {
  if (!u) return u;
  if (u.role === 'رئيسي') u.role = ROLE_OWNER;
  if (u.role === 'عادي')  u.role = ROLE_WORKER;
  if (u.role !== ROLE_OWNER && u.role !== ROLE_MANAGER && u.role !== ROLE_WORKER) u.role = ROLE_WORKER;
  if (u.role === ROLE_OWNER) return u;
  if (!u.permissions) u.permissions = {};
  const clean = {};
  ALL_PERM_KEYS.forEach(k => { clean[k] = u.permissions[k] === true; });
  u.permissions = clean;
  return u;
}
function getAllowedReceiptMethods() {

  const allowed = [];

   ACTIVITY
   ══════════════════════════════════════════════════════════════ */
async function loadActivity() {
  const all = [];
  let hadLegacy = false;
  try {
    const r = await Storage.loadData(LEGACY_FILES.activity, 'legacy_activity');
    if (r.data && Array.isArray(r.data) && r.data.length > 0) { all.push(...r.data); hadLegacy = true; }
  } catch (_) {}
  const treeShas = await Storage.getTreeShas();
  if (treeShas) {
    const months = Object.keys(treeShas).filter(k => k.startsWith('activity/')).map(k => k.substring('activity/'.length));
    const results = await Promise.all(months.map(async m => {
      try { return await Storage.loadData(getActivityPath(m), 'activity/' + m); } catch { return null; }
    }));
    results.forEach(r => { if (r && r.data && Array.isArray(r.data)) all.push(...r.data); });
  }
  const seen = new Set();
  cache.activity = all.filter(a => {
    if (!a || !a.id) return false;
    if (seen.has(a.id)) return false;
    seen.add(a.id);
    return true;
  }).sort((a, b) => (b.ts || 0) - (a.ts || 0));
  if (hadLegacy) hasLegacyFiles = true;
}
async function saveActivity() {
  if (!currentUser) return;
  const byMonth = {};
  (cache.activity || []).forEach(a => {
    let m = a.month;
    if (!m) { const d = a.ts ? new Date(a.ts) : (parseDate(a.time) || new Date()); m = getMonthKey(d); }
    if (!byMonth[m]) byMonth[m] = [];
    byMonth[m].push(a);
  });
  if (!Object.keys(byMonth).length) return;
  await Promise.all(Object.keys(byMonth).map(async m => {
    await Storage.saveData(getActivityPath(m), byMonth[m], 'activity/' + m);
  }));
}
function logActivity(action, title, description, type = 'info', orderId = null) {
  const ts = Date.now();
  const entry = { id: uid(), action, title, description, type, orderId, user: currentUser?.username || 'system', time: fmtDate(new Date(ts)), ts, month: getMonthKey(new Date(ts)) };
  cache.activity.unshift(entry);
}
function getFilteredActivity() {
  let filtered = cache.activity;
  if (activityFilterUser) filtered = filtered.filter(a => a.user === activityFilterUser);
  if (activityFilterType) filtered = filtered.filter(a => a.type === activityFilterType);
  if (activitySearchQuery) {
    const q = activitySearchQuery.toLowerCase();
    filtered = filtered.filter(a => (a.title || '').toLowerCase().includes(q) || (a.description || '').toLowerCase().includes(q) || (a.action || '').toLowerCase().includes(q));
  }
  return filtered;
}

let dialogCallback = null;
function showDialog(opts) {
  return new Promise(resolve => {
    dialogCallback = resolve;
    const { type = 'info', title, message, okText, cancelText, showCancel = true, okClass } = opts;
    const iconMap = { info:'info', warning:'warning', danger:'trash', success:'check', question:'info' };
    const titleMap = { info:'تنبيه', warning:'تحذير', danger:'تأكيد الحذف', success:'تم بنجاح', question:'تأكيد' };
    const iconEl = document.getElementById('dialogIcon');
    iconEl.className = 'dialog-icon ' + (type === 'danger' ? 'danger' : type === 'warning' ? 'warning' : type === 'success' ? 'success' : 'info');
    iconEl.innerHTML = ico(iconMap[type] || 'info', 34);
    document.getElementById('dialogTitle').textContent = title || titleMap[type] || 'تنبيه';
    document.getElementById('dialogMessage').textContent = message || '';
    document.getElementById('dialogOkBtn').textContent = okText || 'موافق';
    document.getElementById('dialogOkBtn').className = 'btn ' + (okClass || (type === 'danger' ? 'btn-danger' : type === 'success' ? 'btn-success' : 'btn-primary'));
    const cancelBtn = document.getElementById('dialogCancelBtn');
    cancelBtn.textContent = cancelText || 'إلغاء';
    cancelBtn.style.display = showCancel ? '' : 'none';
    document.getElementById('dialogBg').classList.add('active');
  });
}
window.dialogResolve = function(r) {
  document.getElementById('dialogBg').classList.remove('active');
  if (dialogCallback) dialogCallback(r);
  dialogCallback = null;
};
const dialog = {
  alert: (msg, o = {}) => showDialog({ type: o.type || 'info', title: o.title, message: msg, showCancel: false, okText: o.okText || 'حسناً' }),
  confirm: (msg, o = {}) => showDialog({ type: o.type || 'question', title: o.title, message: msg, okText: o.okText || 'تأكيد', showCancel: true, okClass: o.okClass }),
  danger: (msg, o = {}) => showDialog({ type: 'danger', title: o.title || 'تأكيد الحذف', message: msg, okText: o.okText || 'نعم، احذف', showCancel: true })
};

function applyFileData(k, data, wasPlain) {
  if (wasPlain === true) hasLegacyFiles = true;
  if (k === 'templates') {
    cache.templates = data || null;
    const merged = data ? { ...DEFAULT_TEMPLATES, ...data } : JSON.parse(JSON.stringify(DEFAULT_TEMPLATES));
    ['ready','transferred','log','group'].forEach(key => { if (data?.[key]) merged[key] = { ...DEFAULT_TEMPLATES[key], ...data[key] }; });
    templates = merged;
  } else if (k === 'whatsappTemplates') {
    cache.whatsappTemplates = data || null;
    const merged = {};
    RECEIPT_METHODS.forEach(m => { merged[m] = { ...(DEFAULT_WHATSAPP_TEMPLATES[m] || {}), ...(data?.[m] || {}) }; });
    whatsappTemplates = merged;
  } else if (k === 'settings') {
    const s = data || {};
    cache.users    = Array.isArray(s.users)    ? s.users    : [];
    cache.drivers  = Array.isArray(s.drivers)  ? s.drivers  : [];
    cache.branches = Array.isArray(s.branches) ? s.branches : [];
    cache.customFields = Array.isArray(s.customFields) ? s.customFields : [];
    if (s.templates) {
      const merged = { ...DEFAULT_TEMPLATES, ...s.templates };
      ['ready','transferred','log','group'].forEach(key => { if (s.templates[key]) merged[key] = { ...DEFAULT_TEMPLATES[key], ...s.templates[key] }; });
      templates = merged;
    }
    if (s.whatsappTemplates) {
      const merged = {};
      RECEIPT_METHODS.forEach(m => { merged[m] = { ...(DEFAULT_WHATSAPP_TEMPLATES[m] || {}), ...(s.whatsappTemplates?.[m] || {}) }; });
      whatsappTemplates = merged;
    }
    if (s.invoiceSettings) invoiceSettings = { ...DEFAULT_INVOICE_SETTINGS, ...s.invoiceSettings };
  } else {
    cache[k] = Array.isArray(data) ? data : [];
  }
}

function normalizeLogStatuses() {
  if (!Array.isArray(cache.log) || !cache.log.length) return false;
  const toReturn = cache.log.filter(o => (o.receiptStatus || RECEIPT_NOT_RECEIVED) === RECEIPT_NOT_RECEIVED);
  if (!toReturn.length) return false;
  const idsToReturn = new Set(toReturn.map(o => o.id));
  const now = fmtDate();
  const user = currentUser?.username || 'system';
  toReturn.forEach(o => {
    const returned = { ...o };
    returned.receiptStatus = RECEIPT_NOT_RECEIVED;
    returned.returnedFromLogAt = now;
    returned.returnedFromLogBy = user;
    delete returned.archivedAt;
    delete returned.archivedBy;
    cache.transferred.push(returned);
  });
  cache.log = cache.log.filter(o => !idsToReturn.has(o.id));
  _logNormalizationPending = true;
  return true;
}
function scheduleLogNormalizationSave() {
  setTimeout(async () => {
    if (!currentUser) return;
    try { await persistKeys(['log', 'transferred']); } catch (_) {}
  }, 800);
}

/* ✅ تهيئة waSentCount من سجل النشاط للطلبات القديمة (مرة واحدة) */
function initWaSentCounts() {
  const allLists = [cache.orders, cache.ready, cache.transferred, cache.log];
  const needsInit = allLists.some(list =>
    Array.isArray(list) && list.some(o => o && o.waSentCount === undefined)
  );
  if (!needsInit) return;

  const byOrder = {};
  (cache.activity || []).forEach(a => {
    if (a && a.action === 'whatsapp-sent' && a.orderId) {
      byOrder[a.orderId] = (byOrder[a.orderId] || 0) + 1;
    }
  });

  allLists.forEach(list => {
    if (!Array.isArray(list)) return;
    list.forEach(o => {
      if (o && o.waSentCount === undefined) {
        o.waSentCount = byOrder[o.id] || 0;
      }
    });
  });
}

function postProcessData() {
  cache.drivers = (cache.drivers || []).map(d => {
    if (typeof d === 'string') return { id: uid(), name: d, phone: '', methods: [...RECEIPT_METHODS] };
    return {
      id: d.id || uid(),
      name: d.name || '',
      phone: d.phone || '',
      methods: Array.isArray(d.methods) && d.methods.length ? d.methods.filter(m => RECEIPT_METHODS.includes(m)) : [...RECEIPT_METHODS]
    };
  }).filter(d => d.name);
  cache.branches = (cache.branches || []).map(b => {
    if (typeof b === 'string') return { id: uid(), name: b };
    return { id: b.id || uid(), name: b.name || '' };
  }).filter(b => b.name);
  if (!cache.branches.length) cache.branches = [{ id: uid(), name: DEFAULT_BRANCH_NAME }];
  cache.users = (cache.users || []).map(u => {
    const nu = normalizeUser(u);
    if (nu.role !== ROLE_OWNER) {
      if (!nu.permissions) nu.permissions = {};
      if (nu.permissions.filterByReceiptMethod === undefined) nu.permissions.filterByReceiptMethod = false;
      if (nu.permissions.viewMethodsAll === undefined) nu.permissions.viewMethodsAll = true;
      if (nu.permissions.viewMethodStore === undefined) nu.permissions.viewMethodStore = true;
      if (nu.permissions.viewMethodDriver === undefined) nu.permissions.viewMethodDriver = true;
      if (nu.permissions.viewMethodOffice === undefined) nu.permissions.viewMethodOffice = true;
    }
    return nu;
  }).filter(u => u && u.id && u.username);
  cache.orders = (cache.orders || []).filter(o => o && o.id && o.invoice);
  cache.ready = (cache.ready || []).filter(o => o && o.id && o.invoice);
  cache.transferred = (cache.transferred || []).filter(o => o && o.id && o.invoice);
  cache.log = (cache.log || []).filter(o => o && o.id && o.invoice).map(o => ({
    ...o,
    receiptStatus: (o.receiptStatus === RECEIPT_RECEIVED || o.receiptStatus === RECEIPT_NOT_RECEIVED) ? o.receiptStatus : RECEIPT_NOT_RECEIVED
  }));
  cache.customers = (cache.customers || []).filter(c => c && c.id && c.name);
  cache.notifications = (Array.isArray(cache.notifications) ? cache.notifications : [])
    .filter(n => n && n.id)
    .filter(n => n.category === 'delivery' || n.category === 'task' || n.category === undefined)
    .map(n => ({
      ...n,
      category: n.category === 'task' ? 'task' : 'delivery',
      deletedBy: Array.isArray(n.deletedBy) ? n.deletedBy : [],
      readBy: Array.isArray(n.readBy) ? n.readBy : [],
      createdBy: n.createdBy || 'system'
    }));
  cache.groups = (Array.isArray(cache.groups) ? cache.groups : [])
    .filter(g => g && g.id && g.name)
    .map(g => ({
      ...g,
      status: g.status || 'نشطة',
      driverPhone: g.driverPhone || (cache.drivers.find(d => d.name === g.driver)?.phone || ''),
      orderIds: Array.isArray(g.orderIds) ? g.orderIds.filter(id =>
        cache.orders.some(o => o.id === id) || cache.ready.some(o => o.id === id) ||
        cache.transferred.some(o => o.id === id) || cache.log.some(o => o.id === id)
      ) : [],
      createdAt: g.createdAt || fmtDate(),
      createdBy: g.createdBy || 'system',
      archivedAt: g.archivedAt || null,
      archivedBy: g.archivedBy || null
    }));
  cache.tasks = (Array.isArray(cache.tasks) ? cache.tasks : [])
    .filter(t => t && t.id && t.title)
    .map(t => ({

      priority: t.priority || 'عادية',
      createdAt: t.createdAt || fmtDate(),

  cache.customFields = (Array.isArray(cache.customFields) ? cache.customFields : [])

    .map(f => ({ ...f, type: f.type || 'text', required: f.required === true, showInPrint: f.showInPrint !== false, options: Array.isArray(f.options) ? f.options : [] }));
  const validIds = new Set(cache.ready.map(o => o.id));
  Array.from(selectedReadyIds).forEach(id => { if (!validIds.has(id)) selectedReadyIds.delete(id); });

/* ══════════════════════════════════════════════════════════════
   READ / WRITE
   ══════════════════════════════════════════════════════════════ */
async function readAll(keysToRead = null) {
  hasLegacyFiles = false;
  const keys = keysToRead || DATA_KEYS.filter(k => k !== 'activity');
  const filesToLoad = new Set();
  for (const k of keys) { if (k === 'activity') continue; const f = KEY_TO_FILE[k]; if (f) filesToLoad.add(f); }
  const fileResults = {};
  await Promise.all(Array.from(filesToLoad).map(async f => {
    try { fileResults[f] = await Storage.loadData(DATA_FILES[f], f); }
    catch (e) { fileResults[f] = { notModified: false, data: null, notFound: true }; }
  }));
  const sr = fileResults.settings;
  let settingsLoaded = false;
  if (sr && !sr.notModified && sr.data) { applyFileData('settings', sr.data, sr.wasPlain); settingsLoaded = true; }
  if (!settingsLoaded && filesToLoad.has('settings')) {
    let anyLegacy = false;
    const legacyResults = await Promise.all(['users','drivers','branches','templates'].map(async k => {
      try { return { k, r: await Storage.loadData(LEGACY_FILES[k], 'legacy_' + k) }; } catch { return { k, r: null }; }
    }));
    for (const { k, r } of legacyResults) { if (r && r.data) { applyFileData(k, r.data, r.wasPlain); anyLegacy = true; } }
    if (anyLegacy) hasLegacyFiles = true;
  }
  ['orders','ready','transferred','log','customers','notifications','groups','tasks'].forEach(f => {
    if (!filesToLoad.has(f)) return;
    const r = fileResults[f];
    if (!r || r.notModified) return;
    applyFileData(f, r.data, r.wasPlain);
  });
  if (keys.includes('activity')) await loadActivity();
  postProcessData();
}
async function readMeta() {
  try {
    const r = await Storage.loadData(DATA_FILES.meta, 'meta');
    if (r.notModified) { const m = localMeta || { lastUpdate: '', version: 10 }; loadFeatureFlags(); return m; }
    const data = r.data || { lastUpdate: '', version: 10 };
    if (data.featureFlags) featureFlags = { ...featureFlags, ...data.featureFlags };
    if (data.invoiceSettings) invoiceSettings = { ...invoiceSettings, ...data.invoiceSettings };
    return data;
  } catch { return { lastUpdate: '', version: 10 }; }
}
async function writeMeta(extra = {}) {
  const meta = { lastUpdate: new Date().toISOString(), version: 10, appVersion: APP_VERSION, featureFlags, invoiceSettings, ...extra };
  if (localMeta?.analyticsSettings && !extra.analyticsSettings) meta.analyticsSettings = localMeta.analyticsSettings;
  try { await Storage.saveData(DATA_FILES.meta, meta, 'meta'); localMeta = meta; }
  catch (e) {
    if (e.message === 'CONFLICT') { await readMeta(); await Storage.saveData(DATA_FILES.meta, meta, 'meta'); localMeta = meta; }
    else throw e;
  }
}

async function persistKeys(keys) {
  setSyncing(true);
  try {
    const activityRequested = keys.includes('activity');
    const filesToWrite = new Set();
    for (const k of keys) { if (k === 'activity') continue; const f = KEY_TO_FILE[k]; if (f) filesToWrite.add(f); }
    if (filesToWrite.size > 0) {
      await Promise.all(Array.from(filesToWrite).map(async f => {
        let data;
        if (f === 'settings') {
          data = {
            users: cache.users || [],
            drivers: cache.drivers || [],
            branches: cache.branches || [],
            customFields: cache.customFields || [],
            templates: templates || {},
            whatsappTemplates: whatsappTemplates || {},
            invoiceSettings: invoiceSettings || {}
          };
        } else if (f === 'meta') {
          data = localMeta || { lastUpdate: new Date().toISOString(), version: 10, appVersion: APP_VERSION, featureFlags, invoiceSettings };
        } else { data = cache[f] || []; }
        await Storage.saveData(DATA_FILES[f], data, f);
      }));
    }
    if (activityRequested) scheduleActivitySave();
    broadcastChange();
    renderActive();
  } finally { setSyncing(false); }
}

function scheduleSync() {
  if (_debounceSyncTimer) clearTimeout(_debounceSyncTimer);
  _debounceSyncTimer = setTimeout(() => {
    _debounceSyncTimer = null;
    if (!currentUser) return;
    syncPull(true).catch(() => {});
  }, DEBOUNCE_SYNC_MS);
}
function scheduleActivitySave() {
  if (_activitySaveTimer) clearTimeout(_activitySaveTimer);
  _activitySaveTimer = setTimeout(async () => { _activitySaveTimer = null; if (!currentUser) return; try { await saveActivity(); } catch (_) {} }, ACTIVITY_SAVE_DELAY);
}
async function flushActivitySave() {
  if (_activitySaveTimer) { clearTimeout(_activitySaveTimer); _activitySaveTimer = null; }
  if (!currentUser) return;
  try { await saveActivity(); } catch (_) {}
}

/* ══════════════════════════════════════════════════════════════
   SYNC
   ══════════════════════════════════════════════════════════════ */
async function syncPull(force = false) {
  if (syncing || !currentUser) return;
  const now = Date.now();
  if (!force && now - lastSyncTime < SYNC_THROTTLE_MS) return;
  if (currentSyncInterval <= 0 && !force) return;
  lastSyncTime = now; syncing = true;
  try {
    let didChange = false;
    const treeShas = await Storage.getTreeShas();
    if (treeShas) {
      const fileKeys = Object.keys(DATA_FILES);
      const changedFiles = fileKeys.filter(f => {
        const remoteSha = treeShas[f];
        if (!remoteSha) return false;
        if (Storage.isStaleSha(f, remoteSha)) return false;
        if (Storage.isRecentlySaved(f)) return false;
        return true;
      });
      const activityRemote = Object.keys(treeShas).filter(k => k.startsWith('activity/'));
      const changedActivity = activityRemote.filter(k => {
        const remoteSha = treeShas[k];
        if (Storage.isStaleSha(k, remoteSha)) return false;
        if (Storage.isRecentlySaved(k)) return false;
        return true;
      });

      if (changedFiles.length) {
        for (const f of changedFiles) {
          try {
            const r = await Storage.loadData(DATA_FILES[f], f);
            if (r.notModified) continue;
            if (f === 'settings') applyFileData('settings', r.data, r.wasPlain);
            else applyFileData(f, r.data, r.wasPlain);
            didChange = true;
          } catch (_) {}
        }
      }
      if (changedActivity.length) { await loadActivity(); didChange = true; }
      if (didChange) {
        postProcessData();
        if (_logNormalizationPending) {
          _logNormalizationPending = false;
          scheduleLogNormalizationSave();
        }
      }
    } else {
      const meta = await readMeta();
      if (!localMeta || meta.lastUpdate !== localMeta.lastUpdate) {
        localMeta = meta; await readAll(); await loadActivity(); didChange = true;
        if (_logNormalizationPending) {
          _logNormalizationPending = false;
          scheduleLogNormalizationSave();
        }
      }
    }
    if (didChange) {
      const me = cache.users.find(u => u.username === currentUser.username);
      const permsChanged = me && JSON.stringify(me.permissions) !== JSON.stringify(currentUser?.permissions);
      if (me) currentUser = normalizeUser(me);
      if (permsChanged) applyPermissionsUI();
      renderActive();
      renderNotifications();
    }
    setOnline(true);
  } catch (e) { setOnline(true); }
  finally { syncing = false; }
}

function renderActive() {
  if (document.querySelector('.modal-bg.active')) return;
  const a = document.querySelector('.page.active')?.id?.replace('page-', '');
  try {
    if (a === 'dashboard') renderDashboard();
    if (a === 'entry') renderEntry();
    if (a === 'groups') renderGroups();
    if (a === 'ready') renderReady();
    if (a === 'transferred') renderTransferred();
    if (a === 'log') renderLog();
    if (a === 'customers') renderCustomers();
    if (a === 'tasks') renderTasks();
    if (a === 'settings') renderSettings();
  } catch (e) { console.warn('renderActive:', e); }
}

function getCurrentInterval() {
  if (currentSyncInterval <= 0) return 0;
  return document.hidden ? SYNC_INTERVAL_HIDDEN : currentSyncInterval;
}

function startPolling() {
  stopPolling();
  if (!currentUser) return;
  const interval = getCurrentInterval();
  if (interval <= 0) return;
  pollTimer = setInterval(() => {
    if (!currentUser) return;
    syncPull(false).catch(() => {});
  }, interval);
}
function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }
function setOnline(ok) {
  const dot = document.getElementById('connDot');
  if (dot) dot.className = 'status-dot online';
  const banner = document.getElementById('connectionBanner');
  if (banner) banner.classList.remove('show');
}
function setSyncing(on) {
  const dot = document.getElementById('connDot');
  if (dot) dot.className = 'status-dot online';
  const ind = document.getElementById('syncIndicator');
  if (ind) {
    if (on) {
      ind.innerHTML = ico('sync', 11) + '<span style="margin-right:4px;">مزامنة</span>';
      ind.classList.add('show');
    } else {
      ind.classList.remove('show');
    }
  }
}

function getOrderGroup(orderId) {
  return (cache.groups || []).find(g => g.status !== 'مؤرشفة' && (g.orderIds || []).includes(orderId));
}
function isOrderInActiveGroup(orderId) { return !!getOrderGroup(orderId); }
function getGroupOrders(groupId) {
  const g = cache.groups.find(x => x.id === groupId); if (!g) return [];
  const orders = [];
  (g.orderIds || []).forEach(id => {
    const o = cache.orders.find(x => x.id === id) || cache.ready.find(x => x.id === id) ||
              cache.transferred.find(x => x.id === id) || cache.log.find(x => x.id === id);
    if (o) orders.push(o);

}
function isOrderLockedByGroup(orderId, excludeGroupId = null) {
  return (cache.groups || []).some(g => {

window.transferGroupToTransferred = async function(groupId) {

/* ✅ تم حذف فلتر حالة الاستلام + إضافة فلتر الترتيب */
function getLogFilteredData() {
  const f = pageFilters.log;
  const allowed = getAllowedReceiptMethods();
  const fromDate = f.from ? new Date(f.from) : null;
  const toDate = f.to ? new Date(f.to + 'T23:59:59') : null;
  const filtered = cache.log.filter(o => {
    if (!allowed.includes(o.receiptMethod || 'المحل')) return false;
    if (f.branch && (o.branch || DEFAULT_BRANCH_NAME) !== f.branch) return false;
    if (f.receiptMethod && (o.receiptMethod || 'المحل') !== f.receiptMethod) return false;
    const d = parseDate(o.approvalDate) || parseDate(o.archivedAt);
    if (fromDate && d && d < fromDate) return false;
    if (toDate && d && d > toDate) return false;
    if ((fromDate || toDate) && !d) return false;
    if (f.search && !smartSearch(`${o.customer} ${o.invoice} ${o.customerPhone || ''} ${o.driver || ''} ${o.notes || ''}`, f.search)) return false;
    return true;
  });
  return sortLogResults(filtered, f.sort);
}

/* ✅ دالة ترتيب السجل */
function sortLogResults(list, sortKey) {
  const arr = list.slice();
  const numFromInv = (inv) => {
    const n = parseInt(String(inv || '').replace(/[^0-9]/g, ''), 10);
    return isNaN(n) ? 0 : n;
  };
  const dateFromO = (o) => {
    const d = parseDate(o.archivedAt) || parseDate(o.transferredAt) || parseDate(o.approvalDate);
    return d ? d.getTime() : 0;
  };
  switch (sortKey) {
    case 'invoice-asc':
      arr.sort((a, b) => numFromInv(a.invoice) - numFromInv(b.invoice));
      break;
    case 'invoice-desc':
      arr.sort((a, b) => numFromInv(b.invoice) - numFromInv(a.invoice));
      break;
    case 'date-asc':
      arr.sort((a, b) => dateFromO(a) - dateFromO(b));
      break;
    case 'date-desc':
    default:
      arr.sort((a, b) => dateFromO(b) - dateFromO(a));
      break;
  }
  return arr;
}

window.updateTasksFilter = function(field, value) { pageFilters.tasks[field] = value; renderTasks(); };
function renderTasks() {
  const container = document.getElementById('tasksContainer'); if (!container) return;
  const f = pageFilters.tasks;
  let tasks = cache.tasks || [];
  if (f.status) tasks = tasks.filter(t => t.status === f.status);
  if (f.priority) tasks = tasks.filter(t => t.priority === f.priority);
  if (f.search) tasks = tasks.filter(t => smartSearch(`${t.title} ${t.description || ''} ${t.assignee || ''}`, f.search));
  const tc = document.getElementById('tasksCount'); if (tc) tc.textContent = `الإجمالي: ${tasks.length} من ${cache.tasks.length}`;
  if (!tasks.length) { container.innerHTML = `<div class="empty-state"><div class="icon">${ico('check', 26)}</div><div class="title">لا توجد مهام</div><div class="desc">ابدأ بإضافة مهمة جديدة</div></div>`; return; }
  tasks.sort((a, b) => {
    const order = { 'عالية': 0, 'عادية': 1, 'منخفضة': 2 };
    const statusOrder = { 'معلقة': 0, 'قيد التنفيذ': 1, 'مكتملة': 2, 'ملغاة': 3 };
    const so = (statusOrder[a.status] || 0) - (statusOrder[b.status] || 0);
    if (so !== 0) return so;
    return (order[a.priority] || 1) - (order[b.priority] || 1);
  });
  container.innerHTML = tasks.map(t => {
    const isCompleted = t.status === 'مكتملة';
    const priorityClass = t.priority === 'عالية' ? 'high' : t.priority === 'منخفضة' ? 'low' : 'medium';
    const canEdit = hasPerm('editTask') && !isCompleted;
    const canDelete = hasPerm('deleteTask') && !isCompleted;
    const canComplete = hasPerm('completeTask') && !isCompleted;
    const statusBadgeClass = isCompleted ? 'badge-ready' : t.status === 'ملغاة' ? 'badge-not-received' : t.status === 'قيد التنفيذ' ? 'badge-progress' : 'badge-branch';
    return `<div class="task-card ${priorityClass}${isCompleted ? ' completed' : ''}">
      <div class="task-title">${esc(t.title)}</div>
      ${t.description ? `<div class="task-desc">${esc(t.description)}</div>` : ''}
      <div class="task-meta">
        ${t.assignee ? `<span>${ico('user', 11)} ${esc(t.assignee)}</span>` : ''}
        <span>${ico('zap', 11)} ${esc(t.priority)}</span>
        <span class="badge ${statusBadgeClass}" style="font-size:10px;padding:2px 7px;">${esc(t.status)}</span>
        ${t.dueDate ? `<span>${ico('clock', 11)} استحقاق: ${esc(t.dueDate)}</span>` : ''}
        <span>${ico('user', 11)} أنشأها: ${esc(t.createdBy || '—')}</span>
      </div>
      ${isCompleted ? `<div style="margin-top:8px;padding:8px 12px;background:linear-gradient(135deg,rgba(12,185,123,.08),rgba(12,185,123,.03));border-right:3px solid var(--success-500);border-radius:var(--radius-sm);display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;">
        <span style="color:var(--success-700);display:inline-flex;align-items:center;gap:5px;font-weight:700;">${ico('check', 13)} <span>أكملها</span></span>
        <b style="color:var(--text);">${esc(t.completedBy || '—')}</b>
        ${t.completedAt ? `<span style="color:var(--text-muted);margin-right:auto;">${ico('clock', 11)} ${esc(t.completedAt)}</span>` : ''}
      </div>` : ''}
      <div class="task-actions" style="margin-top:8px;">
        ${canComplete ? `<button class="btn btn-success btn-sm" onclick="completeTask('${t.id}')">${ico('check', 12)}<span>إكمال</span></button>` : ''}
        ${canEdit ? `<button class="btn btn-primary btn-sm" onclick="editTask('${t.id}')">${ico('edit', 12)}<span>تعديل</span></button>` : ''}
        ${canDelete ? `<button class="btn btn-danger btn-sm" onclick="deleteTask('${t.id}')">${ico('trash', 12)}<span>حذف</span></button>` : ''}
        ${isCompleted ? `<span class="task-locked-note">${ico('lock', 12)} المهمة مكتملة - مقفلة</span>` : ''}
      </div>
    </div>`;
  }).join('');
}

window.saveTask = async function () {
  const now = Date.now();
  if (now - _taskSubmitLock < SUBMIT_LOCK_MS) { toast('جاري الحفظ...', 'warning'); return; }
  _taskSubmitLock = now;
  const id = document.getElementById('taskId').value;
  if (id ? !hasPerm('editTask') : !hasPerm('createTask')) { toast(MSG.unauthorized, 'error'); _taskSubmitLock = 0; return; }
  clearAllErrors('taskModal');
  const title = document.getElementById('taskTitle').value.trim();
  if (!title) { setFieldError('taskTitle', 'عنوان المهمة مطلوب'); focusFirstError('taskModal'); _taskSubmitLock = 0; return; }
  if (id) { const existingTask = cache.tasks.find(t => t.id === id); if (existingTask && existingTask.status === 'مكتملة') { toast(MSG.taskLocked, 'error'); _taskSubmitLock = 0; return; } }
  const description = document.getElementById('taskDescription').value.trim();
  const assignee = document.getElementById('taskAssignee').value;
  const priority = document.getElementById('taskPriority').value;
  const dueDate = document.getElementById('taskDueDate').value;
  const status = document.getElementById('taskStatus').value;
  const existing = id ? cache.tasks.find(t => t.id === id) : null;
  const taskData = { id: id || uid(), title, description, assignee, priority, dueDate, status, createdAt: existing?.createdAt || fmtDate(), createdBy: existing?.createdBy || currentUser.username, completedAt: existing?.completedAt || null, completedBy: existing?.completedBy || null };
  if (status === 'مكتملة' && !taskData.completedAt) { taskData.completedAt = fmtDate(); taskData.completedBy = currentUser.username; }
  if (status !== 'مكتملة') { taskData.completedAt = null; taskData.completedBy = null; }
  const isNew = !id;
  const wasCompleted = existing?.status === 'مكتملة';
  if (id) { const idx = cache.tasks.findIndex(t => t.id === id); if (idx > -1) cache.tasks[idx] = taskData; logActivity('edit-task', `تعديل مهمة: ${title}`, '', 'warning'); }
  else { cache.tasks.push(taskData); logActivity('add-task', `إضافة مهمة: ${title}`, `تعيين: ${assignee || 'بدون'}`, 'success'); }
  try {
    await persistKeys(['tasks', 'activity', 'notifications']);
    closeModal('taskModal');
    renderTasks();
    if (isNew && assignee) addTaskNotification('مهمة جديدة', `تم تكليفك بمهمة`, taskData.id, title);
    if (!isNew && status === 'مكتملة' && !wasCompleted) addTaskNotification('إكمال مهمة', `${title} - بواسطة ${currentUser.username}`, taskData.id, title);
    toast(id ? 'تم التعديل بنجاح' : 'تم الإضافة بنجاح', 'success');
  } catch (e) { toast(e.message, 'error'); }
};
window.completeTask = async function (id) {
  if (!hasPerm('completeTask')) { toast(MSG.unauthorized, 'error'); return; }
  const t = cache.tasks.find(x => x.id === id); if (!t) return;
  if (t.status === 'مكتملة') { toast('المهمة مكتملة مسبقاً', 'warning'); return; }
  const ok = await dialog.confirm(`إكمال المهمة "${t.title}"؟\n\nبمجرد الإكمال، لا يمكن تعديلها أو حذفها.`, { type: 'success', okText: 'نعم، اكتملت' });
  if (!ok) return;
  t.status = 'مكتملة'; t.completedAt = fmtDate(); t.completedBy = currentUser.username;
  logActivity('complete-task', `إكمال مهمة: ${t.title}`, `بواسطة: ${currentUser.username}`, 'success');
  try { await persistKeys(['tasks', 'activity', 'notifications']); renderTasks(); addTaskNotification('إكمال مهمة', `${t.title} - بواسطة ${currentUser.username}`, t.id, t.title); toast('تم إكمال المهمة - أصبحت مقفلة', 'success'); }
  catch (e) { toast(e.message, 'error'); }
};
window.deleteTask = async function (id) {
  if (!hasPerm('deleteTask')) { toast(MSG.unauthorized, 'error'); return; }
  const t = cache.tasks.find(x => x.id === id); if (!t) return;
  if (t.status === 'مكتملة') { toast(MSG.taskLocked, 'error'); return; }

function renderDonut(chartId, legendId, segments) {
  const total = segments.reduce((s, x) => s + x.value, 0);
  const donut = document.getElementById(chartId); const legend = document.getElementById(legendId);
  if (!donut || !legend) return;
  if (total === 0) {
    donut.innerHTML = `<div class="center" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;"><div class="big" style="color:var(--text-muted);font-size:20px;">0</div><div class="small">لا بيانات</div></div>`;
    legend.innerHTML = '<div class="empty-top">لا توجد بيانات</div>';
    return;
  }
  const radius = 55, cx = 65, cy = 65, circumference = 2 * Math.PI * radius;
  let offset = 0;
  const circles = segments.map(s => {
    const p = s.value / total;
    const dash = p * circumference;
    const el = `<circle cx="${cx}" cy="${cy}" r="${radius}" stroke="${s.color}" stroke-dasharray="${dash} ${circumference - dash}" stroke-dashoffset="${-offset}" />`;
    offset += dash;
    return el;
  }).join('');
  donut.innerHTML = `<svg width="130" height="130" viewBox="0 0 130 130"><circle cx="${cx}" cy="${cy}" r="${radius}" stroke="var(--border)" stroke-width="15" fill="none"/>${circles}</svg><div class="center"><div class="big">${total.toLocaleString()}</div><div class="small">الإجمالي</div></div>`;
  legend.innerHTML = segments.filter(s => s.value > 0).map(s => {
    const p = total > 0 ? Math.round((s.value / total) * 100) : 0;
    return `<div class="legend-item"><span class="dot" style="background:${s.color};"></span><span class="name">${esc(s.label)}</span><span class="pct">${p}%</span><span class="val">${s.value}</span></div>`;
  }).join('');
}

function renderTrend7Days() {
  const days = [];
  const today = new Date(); today.setHours(0, 0, 0, 0);
  for (let i = 0; i <= 6; i++) { const d = new Date(today); d.setDate(d.getDate() - i); days.push(d); }
  const allOrders = filterOrdersByPermission([...cache.orders, ...cache.ready, ...cache.transferred, ...cache.log]);
  const counts = days.map(day => {
    const nextDay = new Date(day); nextDay.setDate(nextDay.getDate() + 1);
    return allOrders.filter(o => { const cd = parseDate(o.createdAt) || parseDate(o.transferredAt) || parseDate(o.archivedAt); return cd && cd >= day && cd < nextDay; }).length;
  });
  const max = Math.max(...counts, 1);
  const w = 100, h = 40;
  const points = counts.map((c, i) => { const x = w - (i / 6) * w; const y = h - (c / max) * (h - 6) - 3; return [x, y]; });
  const path = points.map((p, i) => (i === 0 ? 'M' : 'L') + p[0].toFixed(2) + ' ' + p[1].toFixed(2)).join(' ');
  const areaPath = path + ` L0 ${h} L${w} ${h} Z`;
  const dayNames = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  const el = document.getElementById('trendChart'); if (!el) return;
  el.innerHTML = `
    <svg viewBox="0 0 ${w + 4} ${h + 6}" preserveAspectRatio="none" style="width:100%;height:100px;direction:ltr;">
      <defs><linearGradient id="trendGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4266e8" stop-opacity="0.35"/><stop offset="100%" stop-color="#4266e8" stop-opacity="0"/></linearGradient></defs>
      <path d="${areaPath}" fill="url(#trendGrad)"/>
      <path d="${path}" fill="none" stroke="#4266e8" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
      ${points.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="0.8" fill="#4266e8" vector-effect="non-scaling-stroke" />`).join('')}
    </svg>
    <div style="display:flex;margin-top:6px;font-size:10.5px;color:var(--text-muted);font-weight:600;gap:4px;">
      ${days.map((d, i) => `<span style="text-align:center;flex:1;">${dayNames[d.getDay()]}<br><b style="color:var(--brand-600);">${counts[i]}</b></span>`).join('')}
    </div>`;
}

/* ══════════════════════════════════════════════════════════════
   ANALYTICS ENGINE
   ══════════════════════════════════════════════════════════════ */
const Analytics = (() => {
  function getAllOrders() { return filterOrdersByPermission([...cache.orders, ...cache.ready, ...cache.transferred, ...cache.log]); }
  function getOrderDate(o) { return parseDate(o.createdAt) || parseDate(o.transferredAt) || parseDate(o.archivedAt); }
  function inRange(date, from, to) { if (!date) return false; if (from && date < from) return false; if (to && date >= to) return false; return true; }
  function getPeriodOrders(period) {
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    let from = null, to = null;
    if (period === 'today') { from = today; to = new Date(today.getTime() + 86400000); }
    else if (period === 'week') { from = new Date(today.getTime() - 6 * 86400000); to = new Date(today.getTime() + 86400000); }
    else if (period === 'month') { from = new Date(today.getTime() - 29 * 86400000); to = new Date(today.getTime() + 86400000); }
    else if (period === 'month-prev') { from = new Date(today.getFullYear(), today.getMonth() - 1, 1); to = new Date(today.getFullYear(), today.getMonth(), 1); }
    const all = getAllOrders();
    if (!from && !to) return all;
    return all.filter(o => inRange(getOrderDate(o), from, to));
  }
  function analyzeCustomers(orders = null) {
    const list = orders || getAllOrders();
    const stats = {};
    list.forEach(o => {
      const key = o.customer || '';
      if (!key) return;
      if (!stats[key]) stats[key] = { name: key, count: 0, received: 0, notReceived: 0, firstOrder: null, lastOrder: null, locations: new Set(), drivers: new Set(), methods: {} };
      const s = stats[key];
      s.count++;
      if (o.receiptStatus === RECEIPT_RECEIVED) s.received++;
      else s.notReceived++;
      const d = getOrderDate(o);
      if (d) { if (!s.firstOrder || d < s.firstOrder) s.firstOrder = d; if (!s.lastOrder || d > s.lastOrder) s.lastOrder = d; }
      if (o.location) s.locations.add(o.location);
      if (o.driver) s.drivers.add(o.driver);
      if (o.receiptMethod) s.methods[o.receiptMethod] = (s.methods[o.receiptMethod] || 0) + 1;
    });
    const inactiveDays = localMeta?.analyticsSettings?.anomalyInactiveDays || 30;
    return Object.values(stats).map(s => ({
      ...s, locations: Array.from(s.locations), drivers: Array.from(s.drivers),
      daysSinceLastOrder: s.lastOrder ? Math.floor((Date.now() - s.lastOrder.getTime()) / 86400000) : null,
      loyaltyScore: s.count * 10 + s.received * 5,
      isInactive: s.lastOrder && Math.floor((Date.now() - s.lastOrder.getTime()) / 86400000) > inactiveDays
    }));
  }
  function analyzeDrivers(orders = null) {
    const list = orders || getAllOrders();
    const stats = {};
    list.forEach(o => {
      if (!o.driver) return;
      if (!stats[o.driver]) stats[o.driver] = { name: o.driver, phone: o.driverPhone || '', total: 0, delivered: 0, locations: {}, customers: {} };
      const s = stats[o.driver];
      s.total++;
      if (o.receiptStatus === RECEIPT_RECEIVED) s.delivered++;
      if (o.location) { const loc = o.location.split(/[-–—,]/)[0].trim(); s.locations[loc] = (s.locations[loc] || 0) + 1; }
      if (o.customer) s.customers[o.customer] = (s.customers[o.customer] || 0) + 1;
    });
    return Object.values(stats).map(s => {
      const topLocation = Object.entries(s.locations).sort((a,b) => b[1] - a[1])[0];
      const successRate = s.total > 0 ? Math.round((s.delivered / s.total) * 100) : 0;
      return { ...s, locations: Object.entries(s.locations).sort((a,b) => b[1] - a[1]).map(([k,v]) => ({ location: k, count: v })), topLocation: topLocation ? topLocation[0] : null, topLocationCount: topLocation ? topLocation[1] : 0, successRate, customersCount: Object.keys(s.customers).length };
    });
  }
  function analyzeLocations(orders = null) {
    const list = orders || getAllOrders();
    const stats = {};
    list.forEach(o => {
      if (!o.location) return;
      const loc = o.location.split(/[-–—,]/)[0].trim();
      if (!loc) return;
      if (!stats[loc]) stats[loc] = { location: loc, count: 0, customers: new Set(), drivers: new Set() };
      stats[loc].count++;
      if (o.customer) stats[loc].customers.add(o.customer);
      if (o.driver) stats[loc].drivers.add(o.driver);
    });
    return Object.values(stats).map(s => ({ ...s, customersCount: s.customers.size, driversCount: s.drivers.size })).sort((a, b) => b.count - a.count);
  }
  function comparePeriods(p1, p2) {
    const d1 = getPeriodOrders(p1); const d2 = getPeriodOrders(p2);
    const calc = (list) => ({
      total: list.length,
      received: list.filter(o => o.receiptStatus === RECEIPT_RECEIVED).length,
      notReceived: list.filter(o => o.receiptStatus === RECEIPT_NOT_RECEIVED).length,
      customers: new Set(list.map(o => o.customer).filter(Boolean)).size,
      drivers: new Set(list.map(o => o.driver).filter(Boolean)).size
    });
    const s1 = calc(d1), s2 = calc(d2);
    const diff = (a, b) => { if (b === 0 && a === 0) return { pct: 0, dir: 'flat' }; if (b === 0) return { pct: 100, dir: 'up' }; const pct = Math.round(((a - b) / b) * 100); return { pct: Math.abs(pct), dir: pct > 0 ? 'up' : pct < 0 ? 'down' : 'flat' }; };
    return { current: { period: p1, ...s1 }, previous: { period: p2, ...s2 }, changes: { total: diff(s1.total, s2.total), received: diff(s1.received, s2.received), notReceived: diff(s1.notReceived, s2.notReceived), customers: diff(s1.customers, s2.customers), drivers: diff(s1.drivers, s2.drivers) } };
  }
  return { getAllOrders, getOrderDate, getPeriodOrders, analyzeCustomers, analyzeDrivers, analyzeLocations, comparePeriods };
})();

const Anomaly = (() => {
  function getSettings() { return { ...DEFAULT_ANALYTICS_SETTINGS, ...(localMeta?.analyticsSettings || {}) }; }
  function detectAll() {
    const s = getSettings(); const anomalies = []; const all = Analytics.getAllOrders(); const now = Date.now();
    const windowMs = s.anomalyWindowDays * 86400000;
    const recent = all.filter(o => { const d = Analytics.getOrderDate(o); return d && (now - d.getTime()) <= windowMs; });
    const previous = all.filter(o => { const d = Analytics.getOrderDate(o); return d && (now - d.getTime()) > windowMs && (now - d.getTime()) <= windowMs * 2; });
    if (previous.length >= 5) {
      const drop = ((previous.length - recent.length) / previous.length) * 100;
      if (drop >= s.anomalyDropPercent) anomalies.push({ type: 'drop', severity: drop >= 60 ? 'high' : 'medium', icon: 'trendDown', title: 'انخفاض في عدد الطلبات', description: `انخفضت الطلبات بنسبة ${Math.round(drop)}%`, suggestion: 'راجع أسباب انخفاض الطلب' });
    }
    if (previous.length >= 5) {
      const spike = ((recent.length - previous.length) / previous.length) * 100;
      if (spike >= s.anomalySpikePercent) anomalies.push({ type: 'spike', severity: spike >= 100 ? 'high' : 'medium', icon: 'trendUp', title: 'ارتفاع غير طبيعي', description: `ارتفعت الطلبات بنسبة ${Math.round(spike)}%`, suggestion: 'تأكد من الجاهزية' });
    }
    const customers = Analytics.analyzeCustomers();
    const inactive = customers.filter(c => c.daysSinceLastOrder && c.daysSinceLastOrder >= s.anomalyInactiveDays && c.count >= 3);
    if (inactive.length > 0) anomalies.push({ type: 'inactive-customers', severity: inactive.length >= 10 ? 'high' : 'medium', icon: 'user', title: `${inactive.length} عميل غير نشط`, description: inactive.slice(0, 5).map(c => `- ${c.name} (${c.daysSinceLastOrder} يوم)`).join('\n'), suggestion: 'تواصل معهم' });
    const invoiceMap = {};
    all.forEach(o => { if (!o.invoice) return; const key = String(o.invoice).trim(); if (!invoiceMap[key]) invoiceMap[key] = []; invoiceMap[key].push(o); });
    const duplicates = Object.entries(invoiceMap).filter(([_, arr]) => arr.length > 1);
    if (duplicates.length > 0) anomalies.push({ type: 'duplicate-invoice', severity: 'high', icon: 'warning', title: `${duplicates.length} فاتورة مكررة!`, description: duplicates.slice(0, 5).map(([inv, arr]) => `- ${inv} (${arr.length}x)`).join('\n'), suggestion: 'راجعها فوراً' });
    const staleTransferred = cache.transferred.filter(o => { const d = parseDate(o.transferredAt); if (!d) return false; return Math.floor((now - d.getTime()) / 86400000) >= 14; });
    if (staleTransferred.length > 0) anomalies.push({ type: 'stale-transferred', severity: staleTransferred.length >= 5 ? 'high' : 'medium', icon: 'clock', title: `${staleTransferred.length} طلب منذ 14+ يوم`, description: staleTransferred.slice(0, 5).map(o => `- ${o.invoice} - ${o.customer}`).join('\n'), suggestion: 'تابع العملاء' });
    return anomalies.sort((a, b) => { const sev = { high: 3, medium: 2, low: 1 }; return (sev[b.severity] || 0) - (sev[a.severity] || 0); });
  }
  return { detectAll };
})();

async function changeReceiptStatusWithTransfer(orderId, newStatus) {
  const order = cache.transferred.find(x => x.id === orderId) || cache.log.find(x => x.id === orderId);
  if (!order) { toast('الطلب غير موجود', 'error'); return false; }
  const current = order.receiptStatus || RECEIPT_NOT_RECEIVED;
  const isOwner = currentUser?.role === ROLE_OWNER;
  const canRevert = hasPerm('revertReceiptStatus');
  if (current === newStatus) return true;
  if (current === RECEIPT_NOT_RECEIVED && newStatus === RECEIPT_RECEIVED) {
    if (!isOwner && !hasPerm('editReceiptStatus')) { toast(MSG.unauthorized, 'error'); return false; }
    const ok = await dialog.confirm(`هل تم استلام الطلب "${order.invoice}" للعميل "${order.customer}"؟`, { title: 'تأكيد الاستلام', okText: 'نعم، تم الاستلام', type: 'success', okClass: 'btn-success' });
    if (!ok) return false;
    const idx = cache.transferred.findIndex(x => x.id === orderId);
    if (idx === -1) return false;
    const movedOrder = { ...cache.transferred[idx], receiptStatus: RECEIPT_RECEIVED, receiptUpdatedAt: fmtDate(), receiptUpdatedBy: currentUser.username, archivedAt: fmtDate(), archivedBy: currentUser.username };
    cache.log.push(movedOrder);
    cache.transferred.splice(idx, 1);
    logActivity('receipt-received', `تأكيد استلام: ${order.invoice}`, `العميل: ${order.customer}`, 'success');
    addDeliveryNotification('تأكيد استلام', `تم استلام الطلب للعميل ${order.customer}`, 'success', order.id, order.invoice);
    try { await persistKeys(['transferred', 'log', 'activity', 'notifications']); toast('تم تأكيد الاستلام وانتقل الطلب إلى السجل', 'success'); return true; }
    catch (e) { toast(e.message, 'error'); return false; }
  }
  if (current === RECEIPT_RECEIVED && newStatus === RECEIPT_NOT_RECEIVED) {
    if (!isOwner && !canRevert) { toast('لا يمكن التراجع عن تأكيد الاستلام', 'error'); return false; }
    const ok = await dialog.confirm(`إلغاء تأكيد استلام الطلب "${order.invoice}"؟\nسيُعاد الطلب إلى قسم "الطلبات التي تم نقلها".`, { title: 'إلغاء الاستلام', okText: 'نعم، إلغاء', type: 'warning', okClass: 'btn-warning' });
    if (!ok) return false;
    const idx = cache.log.findIndex(x => x.id === orderId);
    if (idx === -1) return false;
    const returnedOrder = { ...cache.log[idx], receiptStatus: RECEIPT_NOT_RECEIVED, receiptUpdatedAt: fmtDate(), receiptUpdatedBy: currentUser.username };
    delete returnedOrder.archivedAt; delete returnedOrder.archivedBy;
    cache.transferred.push(returnedOrder);
    cache.log.splice(idx, 1);
    logActivity('receipt-revert', `إلغاء استلام: ${order.invoice}`, `العميل: ${order.customer}`, 'warning');
    addDeliveryNotification('إلغاء استلام', `تم إلغاء استلام الطلب للعميل ${order.customer}`, 'warning', order.id, order.invoice);
    try { await persistKeys(['transferred', 'log', 'activity', 'notifications']); toast('تم إلغاء الاستلام', 'warning'); return true; }
    catch (e) { toast(e.message, 'error'); return false; }
  }
  return false;
}

function validateOrderForm() {
  clearAllErrors('orderModal');
  let valid = true;
  const invoice = document.getElementById('orderInvoice').value.trim();
  const customer = document.getElementById('orderCustomer').value.trim();
  const customerId = document.getElementById('orderCustomerId').value;
  const branch = document.getElementById('orderBranch').value;
  const id = document.getElementById('orderId').value;
  const mode = document.getElementById('orderModal').dataset.mode || 'orders';
  if (!invoice) { setFieldError('orderInvoice', 'رقم الفاتورة مطلوب'); valid = false; }
  else {
    const inv = String(invoice).trim().toLowerCase();
    const isDup = (list, excludeId) => list.some(o => o.id !== excludeId && (o.invoice || '').trim().toLowerCase() === inv);
    let dup = false;
    if (mode === 'transferred') dup = isDup(cache.transferred, id) || isDup(cache.orders, null) || isDup(cache.ready, null) || isDup(cache.log, null);
    else dup = isDup(cache.orders, id) || isDup(cache.ready, null) || isDup(cache.transferred, null) || isDup(cache.log, null);
    if (dup) { setFieldError('orderInvoice', MSG.invoiceDup); valid = false; }
  }
  if (!branch) { setFieldError('orderBranch', 'الفرع مطلوب'); valid = false; }
  if (!customer) { setFieldError('orderCustomer', 'العميل مطلوب'); valid = false; }
  else {
    let matched = customerId ? cache.customers.find(c => c.id === customerId) : null;
    if (!matched) matched = cache.customers.find(c => c.name.toLowerCase() === customer.toLowerCase());
    if (!matched) { setFieldError('orderCustomer', 'اختر عميلاً من القائمة'); valid = false; }
    else {
      document.getElementById('orderCustomerId').value = matched.id;
      document.getElementById('orderCustomer').value = matched.name;
      document.getElementById('orderCustomerPhone').value = matched.phone || '';
      if (!document.getElementById('orderLocation').value.trim() && matched.location) document.getElementById('orderLocation').value = matched.location;
    }
  }
  if (!validateCustomFields()) valid = false;
  if (!valid) { focusFirstError('orderModal'); toast('يرجى تعبئة الحقول المطلوبة', 'error'); }
  return valid;
}
window.saveOrder = async function () {
  const now = Date.now();
  if (now - _orderSubmitLock < SUBMIT_LOCK_MS) { toast('جاري الحفظ، يرجى الانتظار...', 'warning'); return; }
  _orderSubmitLock = now;
  if (now - lastSaveTime < SAVE_COOLDOWN) { const wait = Math.ceil((SAVE_COOLDOWN - (now - lastSaveTime)) / 1000); toast(`يرجى الانتظار ${wait} ثانية`, 'warning'); _orderSubmitLock = 0; return; }
  if (saveInProgress) { toast('جاري الحفظ...', 'info'); _orderSubmitLock = 0; return; }
  if (!validateOrderForm()) { _orderSubmitLock = 0; return; }
  const id = document.getElementById('orderId').value;
  const mode = document.getElementById('orderModal').dataset.mode || 'orders';
  saveInProgress = true;
  const btn = document.getElementById('saveOrderBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'جاري الحفظ...'; }
  const data = {
    invoice: document.getElementById('orderInvoice').value.trim(),
    branch: document.getElementById('orderBranch').value || DEFAULT_BRANCH_NAME,
    customerId: document.getElementById('orderCustomerId').value,
    customerPhone: document.getElementById('orderCustomerPhone').value.trim(),
    customer: document.getElementById('orderCustomer').value.trim(),
    location: document.getElementById('orderLocation').value.trim(),
    status: document.getElementById('orderStatus').value,
    receiptMethod: document.getElementById('orderReceiptMethod').value,
    driver: document.getElementById('orderDriver').value,
    driverPhone: document.getElementById('orderDriverPhone').value.trim(),
    notes: document.getElementById('orderNotes').value.trim(),
    customData: collectCustomFields(),
    lastEditBy: currentUser.username,
    updatedAt: fmtDate()
  };
  if (mode === 'transferred') {
    const idx = cache.transferred.findIndex(x => x.id === id);
    if (idx === -1) { toast('الطلب غير موجود', 'error'); saveInProgress = false; _orderSubmitLock = 0; if (btn) { btn.disabled = false; btn.innerHTML = 'حفظ الطلب'; } return; }
    cache.transferred[idx] = { ...cache.transferred[idx], ...data };
    logActivity('edit-transferred', `تعديل مُنقل: ${data.invoice}`, '', 'warning');
    closeModal('orderModal'); clearDraft();
    delete document.getElementById('orderModal').dataset.mode;
    try { await persistKeys(['transferred', 'activity']); toast('تم التحديث بنجاح', 'success'); lastSaveTime = Date.now(); }
    catch (e) { toast(e.message, 'error'); }
    finally { saveInProgress = false; if (btn) { btn.disabled = false; btn.innerHTML = 'حفظ الطلب'; } }
    return;
  }
  const existing = id ? cache.orders.find(x => x.id === id) : null;
  let approvalDate = document.getElementById('orderDate').value || (existing?.approvalDate || '');
  if (data.status === ORDER_STATUS.READY && !approvalDate) approvalDate = fmtDate();
  data.approvalDate = approvalDate;
  if (id) { const idx = cache.orders.findIndex(x => x.id === id); cache.orders[idx] = { ...cache.orders[idx], ...data }; logActivity('edit-order', `تعديل: ${data.invoice}`, '', 'warning'); }
  else {
    data.id = uid(); data.createdAt = fmtDate();
    cache.orders.push(data);
    logActivity('add-order', `طلب جديد: ${data.invoice}`, '', 'success');
  }
  if (invoiceSettings.autoIncrement) {
    const prefix = invoiceSettings.prefix || '';
    let maxNum = 0;
    const allLists = [cache.orders, cache.ready, cache.transferred, cache.log];
    for (const list of allLists) {
      if (!Array.isArray(list)) continue;
      for (const o of list) {
        if (!o || !o.invoice) continue;
        let numPart = String(o.invoice).trim();
        if (prefix) {
          if (!numPart.startsWith(prefix)) continue;
          numPart = numPart.substring(prefix.length);
        }
        const n = parseInt(numPart, 10);
        if (!isNaN(n) && n > maxNum) maxNum = n;
      }
    }
    const newNext = maxNum + 1;
    if (newNext > (invoiceSettings.nextNumber || 1)) {
      invoiceSettings.nextNumber = newNext;
      try {
        await writeMeta({ invoiceSettings });
        localMeta = { ...localMeta, invoiceSettings };
      } catch (_) {}
    }
  }
  closeModal('orderModal'); clearDraft();
  delete document.getElementById('orderModal').dataset.mode;
  try { await persistKeys(['orders', 'activity']); toast('تم الحفظ بنجاح', 'success'); lastSaveTime = Date.now(); }
  catch (e) { toast(e.message, 'error'); }
  finally { saveInProgress = false; if (btn) { btn.disabled = false; btn.innerHTML = 'حفظ الطلب'; } }
};

/* ✅ يبني الرسالة حسب طريقة الاستلام (يحافظ على اختلاف القوالب) */
function buildWhatsAppMessage(order, method) {
  const m = method || order.receiptMethod || 'المحل';
  const tpl = (whatsappTemplates[m]?.message)
           || (DEFAULT_WHATSAPP_TEMPLATES[m]?.message)
           || DEFAULT_WHATSAPP_TEMPLATES['المحل'].message;
  return String(tpl)
    .replace(/{customer}/g, order.customer || '')
    .replace(/{invoice}/g, order.invoice || '')
    .replace(/{driver}/g, order.driver || '—')
    .replace(/{driverPhone}/g, order.driverPhone || '—')
    .replace(/{customerPhone}/g, order.customerPhone || '—')
    .replace(/{date}/g, fmtDate())
    .replace(/{method}/g, m);
}

function normalizePhoneForWhatsApp(phone) {
  if (!phone) return '';
  let p = String(phone).trim();
  p = p.replace(/[^0-9]/g, '');
  if (/^7\d{8}$/.test(p)) p = '967' + p;
  else if (/^0\d{9}$/.test(p)) p = '967' + p.substring(1);
  return p;
}

function openBackgroundTab(url, closeAfterMs = 5000) {
  let win = null;
  try { win = window.open(url, '_blank'); } catch (_) { win = null; }
  if (!win) return null;
  try { win.blur(); } catch (_) {}
  try { window.focus(); } catch (_) {}
  if (closeAfterMs > 0) {
    setTimeout(() => { try { win.close(); } catch (_) {} }, closeAfterMs);
  }
  return win;
}

function openWhatsApp(phone, message) {
  phone = String(phone).replace(/[^\d]/g, '');
  const text = encodeURIComponent(message);
  const ua = navigator.userAgent;
  const isAndroid = /Android/i.test(ua);
  const isIOS = /iPhone|iPad|iPod/i.test(ua);
  const isWindows = /Windows/i.test(ua);

  if (isAndroid) {
    const appUrl = `intent://send?phone=${phone}&text=${text}#Intent;scheme=whatsapp;package=com.whatsapp;end`;
    window.location.href = appUrl;
    setTimeout(() => { openBackgroundTab(`https://web.whatsapp.com/send?phone=${phone}&text=${text}`); }, 1800);
    return;
  }
  if (isIOS) {
    window.location.href = `whatsapp://send?phone=${phone}&text=${text}`;
    setTimeout(() => { openBackgroundTab(`https://web.whatsapp.com/send?phone=${phone}&text=${text}`); }, 1800);
    return;
  }
  if (isWindows) {
    window.location.href = `whatsapp://send?phone=${phone}&text=${text}`;
    setTimeout(() => { openBackgroundTab(`https://web.whatsapp.com/send?phone=${phone}&text=${text}`); }, 2000);
    return;
  }
  openBackgroundTab(`https://web.whatsapp.com/send?phone=${phone}&text=${text}`);
}

/* ✅ دالة مساعدة لإرسال سريع من خارج المودال */
function triggerWhatsAppNotification(order) {
  const m = order.receiptMethod || 'المحل';
  if (whatsappTemplates[m]?.enabled === false) return;
  if (!hasPerm('sendWhatsApp')) return;
  const phone = normalizePhoneForWhatsApp(order.customerPhone);
  if (!phone) { toast('لا يوجد رقم هاتف للعميل لإرسال الإشعار', 'warning'); return; }
  const message = buildWhatsAppMessage(order, m);
  logActivity('whatsapp-sent', `إرسال واتساب: ${order.invoice}`, `إلى: ${order.customer} (${phone})`, 'success', order.id);
  openWhatsApp(phone, message);
}

  const o = [...cache.orders, ...cache.ready, ...cache.transferred, ...cache.log].find(x => x.id === orderId);
  if (!o) { toast('الطلب غير موجود', 'error'); return; }

  /* ✅ زيادة العداد على الطلب نفسه (يُزامن مع الجميع) */
  o.waSentCount = (Number(o.waSentCount) || 0) + 1;
  o.lastWaSentAt = fmtDate();

  const inTransferred = cache.transferred.some(x => x.id === orderId);

  logActivity('whatsapp-sent', `إرسال واتساب: ${o.invoice}`, `إلى: ${o.customer} (${method})`, 'success', orderId);

function initCustomerSearch() {
  const input = document.getElementById('orderCustomer');
  const dropdown = document.getElementById('customerDropdown');
  if (!input || !dropdown) return;
  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    document.getElementById('orderCustomerId').value = '';
    document.getElementById('orderCustomerPhone').value = '';
    clearFieldError('orderCustomer');
    if (!q) { dropdown.classList.remove('show'); return; }
    const matches = cache.customers.filter(c => smartSearch(`${c.code} ${c.name} ${c.phone} ${c.location}`, q)).slice(0, 8);
    let html = matches.length ? matches.map(c => `<div class="customer-option" data-id="${c.id}" data-name="${esc(c.name)}" data-loc="${esc(c.location)}" data-phone="${esc(c.phone || '')}"><span class="loc">${esc(c.location)}</span><b>${esc(c.name)}</b> <span class="code">${esc(c.code || '')}</span></div>`).join('') : '';
    const exact = cache.customers.some(c => c.name.toLowerCase() === q);
    if (!exact && q.length >= 2) html += `<div class="customer-option create" data-create="1">إنشاء عميل جديد: "${esc(input.value)}"</div>`;
    if (!html) html = '<div class="customer-option empty">لا توجد نتائج</div>';
    dropdown.innerHTML = html; dropdown.classList.add('show');
    dropdown.querySelectorAll('.customer-option').forEach(opt => {
      opt.addEventListener('mousedown', e => {
        e.preventDefault();
        if (opt.dataset.create) {
          document.getElementById('custName').value = input.value.trim();
          document.getElementById('custId').value = '';
          document.getElementById('custModalTitle').innerHTML = ico('user', 20) + '<span>عميل جديد</span>';
          ['custCode','custLocation','custPhone'].forEach(id => document.getElementById(id).value = '');
          clearAllErrors('customerModal');
          openModal('customerModal');
          setTimeout(() => document.getElementById('custCode').focus(), 100);
          dropdown.classList.remove('show');
        } else {
          document.getElementById('orderCustomerId').value = opt.dataset.id;
          input.value = opt.dataset.name;
          document.getElementById('orderCustomerPhone').value = opt.dataset.phone || '';
          document.getElementById('orderLocation').value = opt.dataset.loc || '';
          dropdown.classList.remove('show');
        }
      });
    });
  });
  input.addEventListener('focus', () => { if (input.value.trim()) input.dispatchEvent(new Event('input')); });
  input.addEventListener('blur', () => setTimeout(() => dropdown.classList.remove('show'), 150));
}

function validateCustomerForm() {

function buildRoleSelect(editingUser = null) {
  const select = document.getElementById('userRole');
  const allowed = getAllowedRolesToCreate();
  select.disabled = false;
  if (editingUser && editingUser.id === currentUser.id) { const rl = roleLabel(editingUser.role); select.innerHTML = `<option value="${editingUser.role}">${rl.label}</option>`; select.disabled = true; return; }
  if (currentUser.role === ROLE_OWNER && editingUser) { const roleOpts = [ROLE_MANAGER, ROLE_WORKER]; select.innerHTML = roleOpts.map(r => { const rl = roleLabel(r); return `<option value="${r}" ${editingUser.role === r ? 'selected' : ''}>${rl.label}</option>`; }).join(''); return; }
  select.innerHTML = allowed.map(r => { const rl = roleLabel(r); return `<option value="${r}">${rl.label}</option>`; }).join('');
}
function rebuildTempPermsForRole(role) {
  const grantable = getGrantablePerms(role);
  const defaults = role === ROLE_MANAGER ? MANAGER_DEFAULTS : WORKER_DEFAULTS;
  tempPerms = {};
  grantable.forEach(k => { tempPerms[k] = defaults[k] === true; });
}
function renderPermissionsGrid() {
  const container = document.getElementById('permissionsGrid');
  const role = document.getElementById('userRole').value;
  const grantable = getGrantablePerms(role);
  if (role === ROLE_OWNER) { container.innerHTML = ''; document.getElementById('permissionsGrid').style.display = 'none'; document.getElementById('permAdminNote').style.display = 'block'; return; }
  document.getElementById('permissionsGrid').style.display = 'block';
  document.getElementById('permAdminNote').style.display = 'none';
  if (!grantable.length) { container.innerHTML = '<div class="empty-top">لا توجد صلاحيات يمكنك منحها</div>'; return; }
  const grouped = {};
  grantable.forEach(key => { const def = PERMISSIONS[key]; if (!def) return; if (!grouped[def.cat]) grouped[def.cat] = []; grouped[def.cat].push({ key, ...def }); });
  let html = '';
  Object.keys(PERM_CATEGORIES).forEach(cat => {
    const items = grouped[cat] || []; if (!items.length) return;
    const catDef = PERM_CATEGORIES[cat];
    html += `<div class="perm-category"><div class="perm-category-title">${ico(catDef.icon, 14)}<span>${catDef.label}</span></div><div class="perm-grid">${items.map(p => { const checked = tempPerms[p.key] === true; return `<label class="perm-item ${checked ? 'checked' : ''}" data-perm="${p.key}"><input type="checkbox" ${checked ? 'checked' : ''} onchange="togglePerm('${p.key}', this.checked)"><span>${esc(p.label)}</span></label>`; }).join('')}</div></div>`;
  });
  container.innerHTML = html || '<div class="empty-top">لا توجد صلاحيات</div>';
}
window.togglePerm = function (key, checked) {
  tempPerms[key] = checked;
  document.querySelector(`.perm-item[data-perm="${key}"]`)?.classList.toggle('checked', checked);
  if (key === 'manageUsers') { const tabChip = document.querySelector(`.perm-item[data-perm="tabUsers"]`); if (tabChip) { tempPerms.tabUsers = checked; const inp = tabChip.querySelector('input'); if (inp) inp.checked = checked; tabChip.classList.toggle('checked', checked); } }

  const featureMap = { useCustomFields: 'featureCustomFields', accessGroups: 'featureWorkGroups', accessTasks: 'featureTasks' };

function validateUserForm() {

window.saveUser = async function () {
  if (!hasPerm('manageUsers')) { toast(MSG.unauthorized, 'error'); return; }
  if (!validateUserForm()) return;
  const id = document.getElementById('userId').value;
  const username = document.getElementById('userName').value.trim();
  const password = document.getElementById('userPass').value;
  const role = document.getElementById('userRole').value;
  if (id) {
    const existing = cache.users.find(u => u.id === id);
    if (!existing) { toast('المستخدم غير موجود', 'error'); return; }
    if (!canManageUser(existing)) { toast('لا يمكنك تعديله', 'error'); return; }
    if (existing.role === ROLE_OWNER && role !== ROLE_OWNER) { const oc = cache.users.filter(u => u.role === ROLE_OWNER).length; if (oc <= 1) { toast('لا يمكن تغيير دور المالك الوحيد', 'error'); return; } }
  } else {
    const allowedRoles = getAllowedRolesToCreate();
    if (!allowedRoles.includes(role)) { toast('لا يمكنك إنشاء هذا الدور', 'error'); return; }
  }
  let permissions = {};
  if (role === ROLE_OWNER) { permissions = {}; }
  else {
    const grantable = getGrantablePerms(role);
    grantable.forEach(k => { permissions[k] = tempPerms[k] === true; });
    if (currentUser.role === ROLE_MANAGER) { const ownPerms = ALL_PERM_KEYS.filter(k => currentUser.permissions?.[k] === true); Object.keys(permissions).forEach(k => { if (!ownPerms.includes(k)) permissions[k] = false; }); }
    if (permissions.manageUsers) permissions.tabUsers = true;
    if (permissions.manageInvoice) permissions.tabInvoice = true;
  }
  const existingUser = id ? cache.users.find(u => u.id === id) : null;
  let passwordFields = {};
  try {
    if (!id) { const h = await Crypto.hashPassword(password); passwordFields = h; }
    else if (existingUser) {
      if (!password) {
        if (existingUser.passwordHash) passwordFields = { passwordHash: existingUser.passwordHash, passwordSalt: existingUser.passwordSalt, passwordAlgo: existingUser.passwordAlgo };
        else passwordFields = { password: existingUser.password };
      } else { const h = await Crypto.hashPassword(password); passwordFields = h; }
    }
  } catch (e) { toast('تعذر تشفير كلمة المرور', 'error'); return; }
  const userData = { id: id || uid(), username, role, permissions, ...passwordFields };
  if (id) { const idx = cache.users.findIndex(u => u.id === id); if (idx > -1) cache.users[idx] = userData; logActivity('edit-user', `تعديل: ${username}`, `الدور: ${role}`, 'warning'); }
  else { cache.users.push(userData); logActivity('add-user', `إضافة: ${username}`, `الدور: ${role}`, 'success'); }
  try {
    await persistKeys(['users', 'activity']);
    if (currentUser.username === username) { currentUser = normalizeUser(userData); applyPermissionsUI(); }
    closeModal('userModal');
    toast('تم الحفظ بنجاح', 'success');
  } catch (e) { toast(e.message, 'error'); }
};

function buildPrintHTML(items, template, extra = {}) {
  const tpl = template;
  const replaceVars = (str) => String(str || '')
    .replace(/{date}/g, fmtDate()).replace(/{count}/g, items.length)
    .replace(/{user}/g, esc(currentUser.username))
    .replace(/{from}/g, extra.from || 'البداية').replace(/{to}/g, extra.to || 'اليوم')
    .replace(/{groupName}/g, extra.groupName || '').replace(/{driver}/g, extra.driver || '').replace(/{time}/g, extra.time || '');
  const cols = [];
  if (tpl.showInvoice !== false) cols.push({ key:'invoice', header:'رقم الفاتورة', cls:'col-code', weight:70, cell:o => esc(o.invoice) });
  if (tpl.showBranch !== false) cols.push({ key:'branch', header:'الفرع', cls:'', weight:75, cell:o => esc(o.branch || DEFAULT_BRANCH_NAME) });
  if (tpl.showCustomer !== false) cols.push({ key:'customer', header:'العميل', cls:'col-name', weight:105, cell:o => esc(o.customer) });
  if (tpl.showCustomerPhone !== false) cols.push({ key:'customerPhone', header:'هاتف العميل', cls:'col-code', weight:105, cell:o => esc(o.customerPhone || '—') });
  if (tpl.showLocation !== false) cols.push({ key:'location', header:'الموقع', cls:'col-name', weight:95, cell:o => esc(o.location) });
  if (tpl.showStatus !== false) cols.push({ key:'status', header:'حالة الطلب', cls:'', weight:70, cell:o => esc(o.status) });
  if (tpl.showApprovalDate !== false) cols.push({ key:'approvalDate', header:'تاريخ الاعتماد', cls:'col-code', weight:90, cell:o => esc(o.approvalDate || '—') });
  if (tpl.showReceiptMethod !== false) cols.push({ key:'receiptMethod', header:'طريقة الاستلام', cls:'', weight:80, cell:o => esc(o.receiptMethod || '—') });
  if (tpl.showDriver !== false) cols.push({ key:'driver', header:'الموصل', cls:'col-name', weight:95, cell:o => esc(o.driver || '—') });
  if (tpl.showDriverPhone !== false) cols.push({ key:'driverPhone', header:'هاتف الموصل', cls:'col-code', weight:105, cell:o => esc(o.driverPhone || '—') });
  if (tpl.showNotes !== false) cols.push({ key:'notes', header:'ملاحظات', cls:'col-notes', weight:110, cell:o => esc(o.notes || '—') });
  if (tpl.showTransferredAt) cols.push({ key:'transferredAt', header:'تاريخ النقل', cls:'col-code', weight:90, cell:o => esc(o.transferredAt || '—') });
  if (tpl.showArchivedAt) cols.push({ key:'archivedAt', header:'تاريخ الترحيل', cls:'col-code', weight:90, cell:o => esc(o.archivedAt || '—') });
  if (tpl.showReceiptStatus) cols.push({ key:'receiptStatus', header:'حالة الاستلام', cls:'', weight:70, cell:o => esc(o.receiptStatus || RECEIPT_NOT_RECEIVED) });
  (cache.customFields || []).filter(f => f.showInPrint !== false).forEach(cf => { cols.push({ key: 'cf_' + cf.key, header: cf.label, cls: 'col-name', weight: 80, cell: o => esc(o.customData?.[cf.key] || '—') }); });
  const allCols = [{ key:'index', header:'#', cls:'col-num', weight:25, cell:null }].concat(cols);
  const totalWeight = allCols.reduce((s, c) => s + c.weight, 0);
  const colgroup = allCols.map(c => `<col style="width:${((c.weight / totalWeight) * 100).toFixed(3)}%">`).join('');
  const headersHTML = allCols.map(c => `<th class="${c.cls}">${esc(c.header)}</th>`).join('');
  const rowsHTML = items.map((o, i) => { const cells = allCols.map(c => { const content = c.cell ? c.cell(o) : String(i + 1); return `<td class="${c.cls}">${content}</td>`; }).join(''); return `<tr>${cells}</tr>`; }).join('');
  const paperKey = tpl.paperSize || 'A4';
  const paper = PAPER_SIZES[paperKey] || PAPER_SIZES.A4;
  const baseFont = Math.max(9, Math.min(14, tpl.fontSize || 10));
  const logoHTML = templates.logo ? `<div class="print-logo"><img src="${templates.logo}" alt="" style="width:${templates.logoWidth || 180}mm;max-width:100%;height:auto;max-height:${templates.logoHeight || 40}mm;object-fit:contain;display:block;margin:0 auto;"></div>` : '';
  return `<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><title>${esc(replaceVars(tpl.title))}</title>
<style>
  @page { size: ${paper.w}mm ${paper.h}mm portrait; margin: 8mm 8mm 10mm 8mm; }
  * { box-sizing: border-box; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  html, body { margin: 0; padding: 0; background: #fff; color: #000; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; direction: rtl; }
  body { font-size: ${baseFont}pt; line-height: 1.4; }
  .print-logo { text-align: center; margin: 0 0 5mm 0; }
  h1.print-title { font-size: ${baseFont + 6}pt; color: #1d3193; margin: 0 0 3mm 0; text-align: center; font-weight: 800; }
  .print-subtitle { text-align: center; font-size: ${baseFont + 1}pt; color: #475569; margin: 0 0 5mm 0; }
  table.print-table { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: ${baseFont}pt; }
  table.print-table thead { display: table-header-group; }
  table.print-table tr { page-break-inside: avoid; }
  table.print-table th { background: #1d3193; color: #fff; font-weight: 700; text-align: center; padding: 4mm 1.5mm; border: 0.6px solid #1a2870; }
  table.print-table td { padding: 3mm 1.5mm; border: 0.6px solid #64748b; background: #fff; word-break: break-word; }
  table.print-table tbody tr:nth-child(even) td { background: #eef4ff; }
  .col-num { text-align: center !important; font-weight: 700; color: #1d3193; }
  .col-code { direction: ltr; text-align: center !important; font-family: 'Courier New', monospace; }
  .col-name { text-align: right !important; }
  .col-notes { text-align: right !important; overflow-wrap: anywhere; font-size: ${baseFont - 0.3}pt; }
  .print-footer { margin-top: 8mm; padding-top: 4mm; text-align: center; font-size: ${baseFont + 1}pt; border-top: 0.8px dashed #94a3b8; }
  @media screen { body { background: #e5e7eb; padding: 15mm 10mm; } .print-container { background: #fff; width: ${paper.w}mm; max-width: 100%; min-height: ${paper.h}mm; margin: 0 auto; padding: 8mm 8mm 10mm 8mm; box-shadow: 0 4px 20px rgba(0,0,0,0.15); } }
  @media print { .print-container { width: 100%; padding: 0; box-shadow: none; } }
</style></head><body>
<div class="print-container">${logoHTML}<h1 class="print-title">${esc(replaceVars(tpl.title))}</h1><div class="print-subtitle">${esc(replaceVars(tpl.subtitle))}</div>
<table class="print-table"><colgroup>${colgroup}</colgroup><thead><tr>${headersHTML}</tr></thead><tbody>${rowsHTML}</tbody></table>
${tpl.footer ? `<div class="print-footer">${esc(replaceVars(tpl.footer))}</div>` : ''}</div>
<script>window.addEventListener('load', function() { setTimeout(function() { window.print(); }, 400); });<\/script>
</body></html>`;
}

  const headers = ['رقم الفاتورة','الفرع','العميل','هاتف العميل','الموقع','الحالة','تاريخ الاعتماد','طريقة الاستلام','الموصل','هاتف الموصل','ملاحظات','تاريخ الترحيل','حالة الاستلام','تاريخ تأكيد الاستلام','المستخدم'];
  const rows = data.map(o => [o.invoice, o.branch || DEFAULT_BRANCH_NAME, o.customer, o.customerPhone || '', o.location, o.status, o.approvalDate, o.receiptMethod || '', o.driver, o.driverPhone, o.notes || '', o.archivedAt, o.receiptStatus || RECEIPT_NOT_RECEIVED, o.receiptUpdatedAt || '', o.receiptUpdatedBy || '']);
  const csv = [headers, ...rows].map(r => r.map(c => `"${String(c ?? '').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `log_${new Date().toISOString().slice(0,10)}.csv`; a.click();
  toast('تم تصدير CSV بنجاح', 'success');
};
