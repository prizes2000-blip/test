/* ══════════════════════════════════════════════════════════════
   SESSION TIMER
   ══════════════════════════════════════════════════════════════ */
function startSessionTimer() {
  stopSessionTimer();
  sessionExpireAt = Date.now() + SESSION_TIMEOUT;
  updateSessionTimer();
  sessionTimer = setInterval(updateSessionTimer, 1000);
  sessionWarningTimer = setInterval(checkSessionWarning, 1000);
}
function stopSessionTimer() {
  if (sessionTimer) { clearInterval(sessionTimer); sessionTimer = null; }
  if (sessionWarningTimer) { clearInterval(sessionWarningTimer); sessionWarningTimer = null; }
}
function resetSessionTimer() { if (currentUser) sessionExpireAt = Date.now() + SESSION_TIMEOUT; }
function updateSessionTimer() {
  if (!currentUser) return;
  const el = document.getElementById('sessionTimer');
  const txt = document.getElementById('sessionTimerText');
  if (!el || !txt) return;
  const remaining = sessionExpireAt - Date.now();
  if (remaining <= 0) { txt.textContent = 'منتهية'; el.className = 'session-timer danger'; return; }
  const mins = Math.floor(remaining / 60000);
  const secs = Math.floor((remaining % 60000) / 1000);
  txt.textContent = `${mins}:${String(secs).padStart(2, '0')}`;
  if (remaining < 2 * 60 * 1000) el.className = 'session-timer danger';
  else if (remaining < SESSION_WARNING) el.className = 'session-timer warning';
  else el.className = 'session-timer';
}
function checkSessionWarning() {
  if (!currentUser) return;
  const remaining = sessionExpireAt - Date.now();
  if (remaining <= 0) { stopSessionTimer(); logout(true); toast(MSG.sessionExpired, 'warning'); return; }
  if (remaining <= SESSION_WARNING && remaining > SESSION_WARNING - 1000) {
    addNotification('تنبيه', MSG.sessionWarning, 'warning', true);
  }
}
['mousemove','keydown','click','scroll','touchstart'].forEach(evt => {
  document.addEventListener(evt, () => { if (currentUser) resetSessionTimer(); }, { passive: true });
});

/* ══════════════════════════════════════════════════════════════
   PERMISSIONS & ROLES
   ══════════════════════════════════════════════════════════════ */
function roleLabel(role) {
  if (role === ROLE_OWNER)   return { label:'مالك',  icon:'crown',  cls:'badge-owner' };
  if (role === ROLE_MANAGER) return { label:'مدير',  icon:'shield', cls:'badge-manager' };
  return { label:'عامل', icon:'user', cls:'badge-worker' };
}
function canManageUser(targetUser) {
  if (!currentUser || !targetUser) return false;
  if (targetUser.id === currentUser.id) return false;
  if (currentUser.role === ROLE_OWNER) return true;
  if (currentUser.role === ROLE_MANAGER) {
    if (!currentUser.permissions?.manageUsers) return false;
    return targetUser.role === ROLE_WORKER;
  }
  return false;
}
function getGrantablePerms(targetRole) {
  if (!currentUser) return [];
  if (currentUser.role === ROLE_OWNER) {
    if (targetRole === ROLE_OWNER) return [];
    return ALL_PERM_KEYS;
  }
  if (currentUser.role === ROLE_MANAGER) {
    if (targetRole === ROLE_OWNER || targetRole === ROLE_MANAGER) return [];
    return ALL_PERM_KEYS.filter(k => currentUser.permissions?.[k] === true);
  }
  return [];
}
function getAllowedRolesToCreate() {
  if (!currentUser) return [];
  if (currentUser.role === ROLE_OWNER) return [ROLE_MANAGER, ROLE_WORKER];
  if (currentUser.role === ROLE_MANAGER) return [ROLE_WORKER];
  return [];
}
function hasPerm(perm) {
  if (!currentUser) return false;
  if (currentUser.role === ROLE_OWNER) return true;
  if (perm === 'tabUsers' && currentUser.permissions?.manageUsers === true) return true;
  return currentUser.permissions?.[perm] === true;
}
function normalizeUser(u) {
  if (!u) return u;
  if (u.role === 'رئيسي') u.role = ROLE_OWNER;
  if (u.role === 'عادي')  u.role = ROLE_WORKER;
  if (u.role !== ROLE_OWNER && u.role !== ROLE_MANAGER && u.role !== ROLE_WORKER) u.role = ROLE_WORKER;
  if (u.role === ROLE_OWNER) return u;
  if (!u.permissions) u.permissions = {};
  const clean = {};
  ALL_PERM_KEYS.forEach(k => { clean[k] = u.permissions[k] === true; });
  u.permissions = clean;
  return u;
}
function applyPermissionsUI() {
  document.querySelectorAll('[class*="perm-"]').forEach(el => {
    const classes = el.className.split(' ');
    let allowed = true;
    classes.forEach(c => {
      if (c.startsWith('perm-')) { const perm = c.replace('perm-', ''); if (PERMISSIONS[perm] && !hasPerm(perm)) allowed = false; }
    });
    el.style.display = allowed ? '' : 'none';
  });
  rebuildNav(); rebuildSettingsTabs();
}
function rebuildNav() {
  const navBar = document.getElementById('navBar'); if (!navBar) return;

function rebuildSettingsTabs() {
  const tabsEl = document.getElementById('settingsTabs'); if (!tabsEl) return;
  const tabs = [
    { id:'token', icon:'key', label:'مفتاح الاتصال', perm:'tabToken' },

    { id:'backup', icon:'save', label:'نسخ احتياطي', perm:'tabBackup' }
  ].filter(t => hasPerm(t.perm));
  if (!tabs.length) { tabsEl.innerHTML = '<div style="padding:16px;color:var(--text-muted);">لا توجد تبويبات متاحة</div>'; return; }
  const currentActive = tabsEl.querySelector('.tab-btn.active');
  const currentId = currentActive?.dataset?.tab;
  const firstId = tabs.find(t => t.id === currentId)?.id || tabs[0].id;
  tabsEl.innerHTML = tabs.map(t => `<button class="tab-btn ${t.id === firstId ? 'active' : ''}" data-tab="${t.id}" onclick="switchTab(event,'${t.id}')">${ico(t.icon, 15)}<span>${t.label}</span></button>`).join('');
  document.querySelectorAll('.tab-panel').forEach(p => p.style.display = 'none');
  document.getElementById('tab-' + firstId).style.display = 'block';
}

function renderStats() {
  const { from, to } = getStatsDateRange();
  const allOrdersRaw = [...cache.orders, ...cache.ready, ...cache.log];
  const allOrders = allOrdersRaw.filter(o => orderInRange(o, from, to));
  const active = cache.orders.filter(o => orderInRange(o, from, to)).length;
  const ready = cache.ready.filter(o => orderInRange(o, from, to)).length;
  const archived = cache.log.filter(o => orderInRange(o, from, to)).length;
  const total = allOrders.length;
  const payPaid = allOrders.filter(o => o.pay === 'مدفوع').length;
  const payUnpaid = allOrders.filter(o => o.pay === 'غير مدفوع').length;
  const payVip = allOrders.filter(o => o.pay === 'VIP').length;
  const payTotalPaid = payPaid + payVip;
  const readyActive = allOrders.filter(o => o.status === 'جاهز').length;
  const progressActive = allOrders.filter(o => o.status === 'قيد التجهيز').length;
  const completionRate = total > 0 ? Math.round(((ready + archived) / total) * 100) : 0;
  const payRate = total > 0 ? Math.round((payTotalPaid / total) * 100) : 0;
  const unpaidRate = total > 0 ? Math.round((payUnpaid / total) * 100) : 0;
  const vipRate = total > 0 ? Math.round((payVip / total) * 100) : 0;
  const readyRate = active > 0 ? Math.round((readyActive / active) * 100) : 0;
  const today = new Date(); today.setHours(0,0,0,0);
  const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate()+1);
  const weekAgo = new Date(today); weekAgo.setDate(weekAgo.getDate()-7);
  const monthAgo = new Date(today); monthAgo.setDate(monthAgo.getDate()-30);
  const getOrderDate = (o) => parseDate(o.createdAt) || parseDate(o.transferredAt) || parseDate(o.archivedAt);
  const todayCount = allOrdersRaw.filter(o => { const d = getOrderDate(o); return d && d >= today && d < tomorrow; }).length;
  const weekCount = allOrdersRaw.filter(o => { const d = getOrderDate(o); return d && d >= weekAgo; }).length;
  const monthCount = allOrdersRaw.filter(o => { const d = getOrderDate(o); return d && d >= monthAgo; }).length;
  const avgDaily = Math.round((weekCount / 7) * 10) / 10;
  const avgMonthly = Math.round((monthCount / 30) * 10) / 10;
  const custCount = {};
  allOrders.forEach(o => { if (o.customer) custCount[o.customer] = (custCount[o.customer] || 0) + 1; });
  const topCustomers = Object.entries(custCount).sort((a,b) => b[1] - a[1]).slice(0, 5);
  const branchCount = {};
  allOrders.forEach(o => { const b = o.branch || DEFAULT_BRANCH_NAME; branchCount[b] = (branchCount[b] || 0) + 1; });
  const topBranches = Object.entries(branchCount).sort((a,b) => b[1] - a[1]);
  const driverCount = {};
  allOrders.forEach(o => { if (o.driver) driverCount[o.driver] = (driverCount[o.driver] || 0) + 1; });
  const topDrivers = Object.entries(driverCount).sort((a,b) => b[1] - a[1]).slice(0, 5);
  const userCount = {};
  allOrders.forEach(o => { if (o.lastEditBy) userCount[o.lastEditBy] = (userCount[o.lastEditBy] || 0) + 1; });
  const topUsers = Object.entries(userCount).sort((a,b) => b[1] - a[1]).slice(0, 5);
  const diff = (curr, prev) => {
    if (prev === 0 && curr === 0) return { dir:'flat', pct:0 };
    if (prev === 0) return { dir:'up', pct:100 };
    const pct = Math.round(((curr - prev) / prev) * 100);
    return { dir: pct > 0 ? 'up' : pct < 0 ? 'down' : 'flat', pct: Math.abs(pct) };
  };
  const trendIcon = (dir) => dir === 'up' ? ico('trendUp', 10) : dir === 'down' ? ico('trendDown', 10) : '';
  const badgeT = (t) => (t && t.dir !== 'flat') ? `<span class="trend ${t.dir}">${trendIcon(t.dir)}<span>${t.pct}%</span></span>` : '';

  document.getElementById('statsOverview').innerHTML = `
    <div class="stat"><div class="stat-head"><div class="stat-icon">${ico('layers', 17)}</div>${badgeT(diff(total, prevStats.total))}</div><div class="num">${total.toLocaleString()}</div><div class="lbl">إجمالي الطلبات</div><div class="sub">حسب الفترة المحددة</div></div>
    <div class="stat orange"><div class="stat-head"><div class="stat-icon">${ico('list', 17)}</div>${badgeT(diff(active, prevStats.orders))}</div><div class="num">${active.toLocaleString()}</div><div class="lbl">قيد الإدخال</div><div class="sub">${progressActive} قيد • ${readyActive} جاهز</div></div>
    <div class="stat green"><div class="stat-head"><div class="stat-icon">${ico('box', 17)}</div>${badgeT(diff(ready, prevStats.ready))}</div><div class="num">${ready.toLocaleString()}</div><div class="lbl">جاهزة للنقل</div><div class="sub">${readyRate}% من النشطة</div><div class="progress-bar"><div class="fill green" style="width:${readyRate}%"></div></div></div>
    <div class="stat purple"><div class="stat-head"><div class="stat-icon">${ico('archive', 17)}</div>${badgeT(diff(archived, prevStats.log))}</div><div class="num">${archived.toLocaleString()}</div><div class="lbl">في السجل</div><div class="sub">أرشيف نهائي</div></div>
    <div class="stat teal"><div class="stat-head"><div class="stat-icon">${ico('target', 17)}</div></div><div class="num">${completionRate}%</div><div class="lbl">نسبة الإنجاز</div><div class="progress-bar"><div class="fill" style="width:${completionRate}%"></div></div></div>
  `;
  document.getElementById('statsPayments').innerHTML = `
    <div class="stat green"><div class="stat-head"><div class="stat-icon">${ico('money', 17)}</div></div><div class="num small">${payTotalPaid.toLocaleString()}</div><div class="lbl">مدفوع + VIP</div><div class="sub">${payRate}% من الإجمالي</div><div class="progress-bar"><div class="fill green" style="width:${payRate}%"></div></div></div>
    <div class="stat red"><div class="stat-head"><div class="stat-icon">${ico('warning', 17)}</div></div><div class="num small">${payUnpaid.toLocaleString()}</div><div class="lbl">غير مدفوع</div><div class="sub">${unpaidRate}%</div><div class="progress-bar"><div class="fill red" style="width:${unpaidRate}%"></div></div></div>
    <div class="stat purple"><div class="stat-head"><div class="stat-icon">${ico('crown', 17)}</div></div><div class="num small">${payVip.toLocaleString()}</div><div class="lbl">VIP</div><div class="sub">${vipRate}%</div><div class="progress-bar"><div class="fill purple" style="width:${vipRate}%"></div></div></div>
    <div class="stat"><div class="stat-head"><div class="stat-icon">${ico('check', 17)}</div></div><div class="num small">${payPaid.toLocaleString()}</div><div class="lbl">مدفوع فقط</div><div class="sub">بدون VIP</div></div>
  `;
  document.getElementById('timeStatsContainer').innerHTML = `
    <div class="time-stats">
      <div class="time-stat"><div class="tv">${todayCount}</div><div class="tl">اليوم</div></div>
      <div class="time-stat"><div class="tv">${weekCount}</div><div class="tl">آخر 7 أيام</div></div>
      <div class="time-stat"><div class="tv">${monthCount}</div><div class="tl">آخر 30 يوم</div></div>
      <div class="time-stat"><div class="tv">${avgDaily}</div><div class="tl">متوسط يومي</div></div>
      <div class="time-stat"><div class="tv">${avgMonthly}</div><div class="tl">متوسط شهري</div></div>
    </div>
  `;
  renderDonut('donutChart', 'donutLegend', [
    { value: active, color: '#4266e8', label: 'قيد الإدخال' },
    { value: ready, color: '#0cb97b', label: 'جاهزة' },
    { value: archived, color: '#8b5cf6', label: 'في السجل' }
  ]);
  renderDonut('payDonutChart', 'payDonutLegend', [
    { value: payPaid, color: '#0cb97b', label: 'مدفوع' },
    { value: payUnpaid, color: '#ef3d52', label: 'غير مدفوع' },
    { value: payVip, color: '#f0a824', label: 'VIP' }
  ]);
  const branchColors = ['#4266e8','#0cb97b','#8b5cf6','#f97316','#14b8a6','#ec4899'];
  const branchSegments = topBranches.slice(0, 6).map((b, i) => ({ value: b[1], color: branchColors[i], label: b[0] }));
  renderDonut('branchDonutChart', 'branchDonutLegend', branchSegments);
  renderTopList('topCustomers', topCustomers, topCustomers[0]?.[1] || 1);
  renderTopList('topBranches', topBranches, topBranches[0]?.[1] || 1);
  renderTopList('topDrivers', topDrivers, topDrivers[0]?.[1] || 1);
  renderTopList('topUsers', topUsers, topUsers[0]?.[1] || 1);
  document.getElementById('performanceMetrics').innerHTML = `
    <div class="metric-box"><div class="mv">${total}</div><div class="ml">إجمالي الطلبات</div></div>
    <div class="metric-box"><div class="mv">${todayCount}</div><div class="ml">اليوم</div></div>
    <div class="metric-box"><div class="mv green">${payTotalPaid}</div><div class="ml">مدفوعة</div></div>
    <div class="metric-box"><div class="mv red">${payUnpaid}</div><div class="ml">غير مدفوعة</div></div>
    <div class="metric-box"><div class="mv purple">${payVip}</div><div class="ml">VIP</div></div>
    <div class="metric-box"><div class="mv">${completionRate}%</div><div class="ml">الإنجاز</div></div>
    <div class="metric-box"><div class="mv green">${payRate}%</div><div class="ml">الدفع</div></div>
    <div class="metric-box"><div class="mv">${avgDaily}</div><div class="ml">متوسط يومي</div></div>
  `;
  renderTrend7Days();
  prevStats = { orders: active, ready: ready, log: archived, total: total };
}
function renderDonut(chartId, legendId, segments) {
  const total = segments.reduce((s, x) => s + x.value, 0);
  const donut = document.getElementById(chartId);
  const legend = document.getElementById(legendId);
  if (!donut || !legend) return;
  if (total === 0) {
    donut.innerHTML = `<div class="center" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;"><div class="big" style="color:var(--text-muted);font-size:20px;">0</div><div class="small">لا بيانات</div></div>`;
    legend.innerHTML = '<div class="empty-top">لا توجد بيانات</div>';
    return;
  }
  const radius = 55, cx = 65, cy = 65, circumference = 2 * Math.PI * radius;
  let offset = 0;
  const circles = segments.map(s => {
    const p = s.value / total;
    const dash = p * circumference;
    const el = `<circle cx="${cx}" cy="${cy}" r="${radius}" stroke="${s.color}" stroke-dasharray="${dash} ${circumference - dash}" stroke-dashoffset="${-offset}" />`;
    offset += dash;
    return el;
  }).join('');
  donut.innerHTML = `<svg width="130" height="130" viewBox="0 0 130 130"><circle cx="${cx}" cy="${cy}" r="${radius}" stroke="var(--border)" stroke-width="15" fill="none"/>${circles}</svg><div class="center"><div class="big">${total.toLocaleString()}</div><div class="small">الإجمالي</div></div>`;
  legend.innerHTML = segments.filter(s => s.value > 0).map(s => {
    const p = total > 0 ? Math.round((s.value / total) * 100) : 0;
    return `<div class="legend-item"><span class="dot" style="background:${s.color};"></span><span class="name">${esc(s.label)}</span><span class="pct">${p}%</span><span class="val">${s.value}</span></div>`;
  }).join('');
}
function renderTopList(elId, entries, maxVal) {
  const el = document.getElementById(elId); if (!el) return;
  if (!entries || !entries.length) { el.innerHTML = '<div class="empty-top">لا توجد بيانات</div>'; return; }
  el.innerHTML = entries.map(([name, count], i) => {
    const p = maxVal > 0 ? Math.round((count / maxVal) * 100) : 0;
    const rankClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
    return `<div class="top-item"><span class="rank ${rankClass}">${i+1}</span><span class="name" title="${esc(name)}">${esc(name)}</span><span class="bar-mini"><span class="fill" style="width:${p}%"></span></span><span class="count">${count}</span></div>`;
  }).join('');
}
function renderTrend7Days() {
  const days = [];
  const today = new Date(); today.setHours(0, 0, 0, 0);
  for (let i = 0; i <= 6; i++) { const d = new Date(today); d.setDate(d.getDate() - i); days.push(d); }
  const allOrders = [...cache.orders, ...cache.ready, ...cache.log];
  const counts = days.map(day => {
    const nextDay = new Date(day); nextDay.setDate(nextDay.getDate() + 1);
    return allOrders.filter(o => {
      const cd = parseDate(o.createdAt) || parseDate(o.transferredAt) || parseDate(o.archivedAt);
      return cd && cd >= day && cd < nextDay;
    }).length;
  });
  const max = Math.max(...counts, 1);
  const w = 100, h = 40;
  const points = counts.map((c, i) => { const x = w - (i / 6) * w; const y = h - (c / max) * (h - 6) - 3; return [x, y]; });
  const path = points.map((p, i) => (i === 0 ? 'M' : 'L') + p[0].toFixed(2) + ' ' + p[1].toFixed(2)).join(' ');
  const areaPath = path + ` L0 ${h} L${w} ${h} Z`;
  const dayNames = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  const el = document.getElementById('trendChart'); if (!el) return;
  el.innerHTML = `
    <svg viewBox="0 0 ${w + 4} ${h + 6}" preserveAspectRatio="none" style="width:100%;height:100px;direction:ltr;">
      <defs><linearGradient id="trendGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4266e8" stop-opacity="0.35"/><stop offset="100%" stop-color="#4266e8" stop-opacity="0"/></linearGradient></defs>
      <path d="${areaPath}" fill="url(#trendGrad)"/>
      <path d="${path}" fill="none" stroke="#4266e8" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
      ${points.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="0.8" fill="#4266e8" vector-effect="non-scaling-stroke" />`).join('')}
    </svg>
    <div style="display:flex;margin-top:6px;font-size:10.5px;color:var(--text-muted);font-weight:600;gap:4px;">
      ${days.map((d, i) => `<span style="text-align:center;flex:1;">${dayNames[d.getDay()]}<br><b style="color:var(--brand-600);">${counts[i]}</b></span>`).join('')}
    </div>`;
}

function renderEntry() {

  const branchFilter = document.getElementById('entryBranchFilter')?.value || '';
  let data = cache.orders;
  if (branchFilter) data = data.filter(o => (o.branch || DEFAULT_BRANCH_NAME) === branchFilter);

   RENDER: LOG
   ══════════════════════════════════════════════════════════════ */
function getLogFilteredData() {
  const fromVal = document.getElementById('filterLogFrom')?.value || '';
  const toVal = document.getElementById('filterLogTo')?.value || '';
  const nameVal = (document.getElementById('filterLogName')?.value || '').trim().toLowerCase();
  const payVal = document.getElementById('filterLogPay')?.value || '';
  const receiptVal = document.getElementById('filterLogReceipt')?.value || '';
  const branchVal = document.getElementById('filterLogBranch')?.value || '';
  const fromDate = fromVal ? new Date(fromVal) : null;
  const toDate = toVal ? new Date(toVal + 'T23:59:59') : null;
  return cache.log.filter(o => {
    if (nameVal && !`${o.customer} ${o.invoice} ${o.customerPhone || ''}`.toLowerCase().includes(nameVal)) return false;
    if (payVal && o.pay !== payVal) return false;
    if (receiptVal && (o.receiptStatus || RECEIPT_NOT_RECEIVED) !== receiptVal) return false;
    if (branchVal && (o.branch || DEFAULT_BRANCH_NAME) !== branchVal) return false;
    const d = parseDate(o.approvalDate) || parseDate(o.archivedAt);
    if (fromDate && d && d < fromDate) return false;
    if (toDate && d && d > toDate) return false;
    if ((fromDate || toDate) && !d) return false;
    return true;
  });
}
function receiptStatusCell(o) {
  const status = o.receiptStatus || RECEIPT_NOT_RECEIVED;
  const isDone = status === RECEIPT_RECEIVED;
  const canEdit = hasPerm('editReceiptStatus');
  const canRevert = hasPerm('revertReceiptStatus');
  const isOwner = currentUser?.role === ROLE_OWNER;
  if (isDone && !canRevert && !isOwner) {
    return `<span class="badge badge-received" title="تم الاستلام${o.receiptUpdatedBy ? ' • بواسطة ' + esc(o.receiptUpdatedBy) : ''}${o.receiptUpdatedAt ? ' • ' + esc(o.receiptUpdatedAt) : ''}">${ico('check', 11)} تم</span>`;
  }
  if (!canEdit && !canRevert && !isOwner) {
    return isDone
      ? `<span class="badge badge-received">${ico('check', 11)} تم</span>`
      : `<span class="badge badge-not-received">لا</span>`;
  }
  const cls = isDone ? 'receipt-select is-done owner-locked' : 'receipt-select';
  return `<select class="${cls}" onclick="event.stopPropagation()" onchange="changeReceiptStatus('${o.id}', this.value)">
    <option value="${RECEIPT_NOT_RECEIVED}" ${!isDone ? 'selected' : ''}>لا</option>
    <option value="${RECEIPT_RECEIVED}" ${isDone ? 'selected' : ''}>تم</option>
  </select>`;
}
function renderLog() {
  const data = getLogFilteredData();
  const canEdit = hasPerm('editLog'), canDelete = hasPerm('deleteLog');

  if (!data.length) { body.innerHTML = emptyState('archive', 'لا توجد نتائج', cache.log.length ? 'جرّب تعديل الفلاتر' : 'لم يتم ترحيل بعد', 16); return; }
  body.innerHTML = data.map((o, i) => {
    const btns = `
      ${canEdit ? `<button class="btn btn-primary btn-sm" onclick="editFromLog('${o.id}')" title="تعديل">${ico('edit', 13)}</button>` : ''}
      ${canDelete ? `<button class="btn btn-danger btn-sm" onclick="deleteFromLog('${o.id}')" title="حذف">${ico('trash', 13)}</button>` : ''}
    `;
    return `<tr>
      <td>${i+1}</td><td><b>${esc(o.invoice)}</b></td><td>${branchBadge(o.branch)}</td><td>${esc(o.customer)}</td>
      <td>${phoneBadge(o.customerPhone)}</td>
      <td>${esc(o.location)}</td><td>${badge(o.status)}</td>
      <td style="font-size:11.5px;color:var(--text-muted);">${esc(o.approvalDate || '—')}</td>
      <td>${badge(o.pay)}</td><td>${esc(o.driver)}</td><td>${esc(o.driverPhone)}</td>
      <td class="note-cell"><div class="note-text" title="${esc(o.notes)}">${esc(o.notes) || '—'}</div></td>
      <td style="font-size:11.5px;color:var(--text-muted);">${esc(o.lastEditBy || '—')}</td>
      <td style="font-size:11.5px;color:var(--text-muted);">${esc(o.archivedAt || '—')}</td>
      <td class="no-print" style="text-align:center;">${receiptStatusCell(o)}</td>
      <td class="no-print" style="white-space:nowrap;">${showActions ? btns : '—'}</td>
    </tr>`;
  }).join('');

/* ══════════════════════════════════════════════════════════════
   NAVIGATION
   ══════════════════════════════════════════════════════════════ */
window.go = function (page) {
  const pagePerm = { dashboard:'accessDashboard', entry:'accessEntry', ready:'accessReady', log:'accessLog', customers:'accessCustomers', settings:'accessSettings' };
  if (pagePerm[page] && !hasPerm(pagePerm[page])) { toast(MSG.unauthorized, 'error'); return; }
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + page)?.classList.add('active');
  document.querySelector(`nav button[data-page="${page}"]`)?.classList.add('active');
  if (page === 'dashboard') renderDashboard();
  if (page === 'entry') { populateBranchSelects(); renderEntry(); }
  if (page === 'ready') { populateBranchSelects(); renderReady(); }
  if (page === 'log') { populateBranchSelects(); renderLog(); }
  if (page === 'customers') renderCustomers();
  if (page === 'settings') { rebuildSettingsTabs(); renderSettings(); updateCurrentKeyInfo(); }
};
window.switchTab = function (evt, tab) {
  const tabPerm = { token:'tabToken', activity:'tabActivity', branches:'tabBranches', drivers:'tabDrivers', users:'tabUsers', templates:'tabTemplates', backup:'tabBackup' };
  if (tabPerm[tab] && !hasPerm(tabPerm[tab])) { toast(MSG.unauthorized, 'error'); return; }
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.style.display = 'none');
  const btn = evt.target.closest('.tab-btn'); if (btn) btn.classList.add('active');
  document.getElementById('tab-' + tab).style.display = 'block';
  if (tab === 'templates') renderTemplates();
  if (tab === 'token') updateCurrentKeyInfo();
  if (tab === 'activity') { activityCurrentPage = 1; renderActivity(); }
  if (tab === 'users') renderUsers();
};

/* ══════════════════════════════════════════════════════════════
   KEY MANAGEMENT
   ══════════════════════════════════════════════════════════════ */
function getStoredKey() { return localStorage.getItem(ACCESS_KEY) || ''; }
function saveKey(t) { localStorage.setItem(ACCESS_KEY, t.trim()); }
function hideKeyForever() { localStorage.setItem(KEY_HIDDEN_FLAG, '1'); }
function isKeyHidden() { return localStorage.getItem(KEY_HIDDEN_FLAG) === '1'; }
async function clearKey() {
  const ok = await dialog.confirm('سيتم إزالة المفتاح من هذا الجهاز، هل تريد المتابعة؟', { type: 'warning', title: 'إزالة المفتاح' });
  if (!ok) return;
  localStorage.removeItem(ACCESS_KEY);
  localStorage.removeItem(KEY_HIDDEN_FLAG);
  toast('تمت إزالة المفتاح بنجاح', 'success');
  updateKeyStatus(); updateCurrentKeyInfo();
}
function updateKeyStatus() {
  const statusEl = document.getElementById('keyStatus');
  const fieldEl = document.getElementById('keyField');
  const token = getStoredKey();
  if (isKeyHidden() && token) { statusEl.style.display = 'none'; fieldEl.style.display = 'none'; return; }
  statusEl.style.display = '';
  if (token) {
    statusEl.className = 'key-status saved';
    statusEl.innerHTML = `<span>${ico('check', 14)} المفتاح جاهز للاستخدام</span><button onclick="showKeyField()">تغيير</button>`;
    fieldEl.style.display = 'none';
  } else {
    statusEl.className = 'key-status missing';

   RATE LIMIT
   ══════════════════════════════════════════════════════════════ */
function updateRateLimit(headers) {
  const remaining = headers.get('X-RateLimit-Remaining');
  const limit = headers.get('X-RateLimit-Limit');
  const reset = headers.get('X-RateLimit-Reset');
  if (remaining !== null && limit !== null) {
    rateLimitInfo = { remaining: parseInt(remaining), limit: parseInt(limit), reset: reset ? new Date(parseInt(reset) * 1000) : null };
    renderRateLimitWidget(); adjustSyncInterval(); maybeNotifyLowRate();
  }
}
function renderRateLimitWidget() {
  const widget = document.getElementById('rateWidget');
  const fill = document.getElementById('rateFill');
  const text = document.getElementById('rateText');
  const icon = document.getElementById('rateIcon');
  if (!widget || !fill || !text) return;
  if (icon && !icon.innerHTML) icon.innerHTML = ico('zap', 12);
  if (!rateLimitInfo) { text.textContent = '— / —'; fill.style.width = '0%'; return; }
  const { remaining, limit, reset } = rateLimitInfo;
  const pct = limit > 0 ? Math.max(0, Math.min(100, (remaining / limit) * 100)) : 0;
  fill.style.width = pct + '%';
  text.textContent = `${remaining.toLocaleString('en-US')} / ${limit.toLocaleString('en-US')}`;
  widget.classList.remove('warn','danger');
  if (pct < 10) widget.classList.add('danger'); else if (pct < 30) widget.classList.add('warn');
  const resetStr = reset ? reset.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }) : '—';
  const level = getRateLevel(remaining);
  widget.title = `📊 استهلاك الحصة\nالمتبقي: ${remaining.toLocaleString('en-US')} من ${limit.toLocaleString('en-US')}\nالنسبة: ${pct.toFixed(1)}%\nالمستوى: ${level.label}\nيتجدد الساعة: ${resetStr}`;
}
function getRateLevel(remaining) { for (const lvl of RATE_LEVELS) { if (remaining >= lvl.min) return lvl; } return RATE_LEVELS[RATE_LEVELS.length - 1]; }
function adjustSyncInterval() {
  if (!rateLimitInfo) return;
  const level = getRateLevel(rateLimitInfo.remaining);
  if (level.interval === currentSyncInterval) return;
  currentSyncInterval = level.interval;
  if (!currentUser) return;
  if (currentSyncInterval > 0) startPolling();
  else stopPolling();
}
function maybeNotifyLowRate() {
  if (!rateLimitInfo) return;
  const now = Date.now();
  if (now - lastRateNotificationAt < 30 * 60 * 1000) return;
  const pct = rateLimitInfo.limit > 0 ? (rateLimitInfo.remaining / rateLimitInfo.limit) * 100 : 100;
  if (pct < 10) { lastRateNotificationAt = now; addNotification('تنبيه', `استهلاك منخفض للحصة: ${rateLimitInfo.remaining} طلب متبقي`, 'warning', true); }
}

let dialogCallback = null;
function showDialog(opts) {
  return new Promise(resolve => {
    dialogCallback = resolve;
    const { type = 'info', title, message, okText, cancelText, showCancel = true, okClass } = opts;
    const iconMap = { info:'info', warning:'warning', danger:'trash', success:'check', question:'info' };
    const titleMap = { info:'تنبيه', warning:'تحذير', danger:'تأكيد الحذف', success:'تم بنجاح', question:'تأكيد' };
    const iconEl = document.getElementById('dialogIcon');
    iconEl.className = 'dialog-icon ' + (type === 'danger' ? 'danger' : type === 'warning' ? 'warning' : type === 'success' ? 'success' : 'info');
    iconEl.innerHTML = ico(iconMap[type] || 'info', 34);
    document.getElementById('dialogTitle').textContent = title || titleMap[type] || 'تنبيه';
    document.getElementById('dialogMessage').textContent = message || '';
    document.getElementById('dialogOkBtn').textContent = okText || 'موافق';
    document.getElementById('dialogOkBtn').className = 'btn ' + (okClass || (type === 'danger' ? 'btn-danger' : type === 'success' ? 'btn-success' : 'btn-primary'));
    const cancelBtn = document.getElementById('dialogCancelBtn');
    cancelBtn.textContent = cancelText || 'إلغاء';
    cancelBtn.style.display = showCancel ? '' : 'none';
    document.getElementById('dialogBg').classList.add('active');
  });
}
window.dialogResolve = function(r) {
  document.getElementById('dialogBg').classList.remove('active');
  if (dialogCallback) dialogCallback(r);
  dialogCallback = null;
};
const dialog = {
  alert: (msg, o = {}) => showDialog({ type: o.type || 'info', title: o.title, message: msg, showCancel: false, okText: o.okText || 'حسناً' }),
  confirm: (msg, o = {}) => showDialog({ type: o.type || 'question', title: o.title, message: msg, okText: o.okText || 'تأكيد', showCancel: true, okClass: o.okClass }),
  danger: (msg, o = {}) => showDialog({ type: 'danger', title: o.title || 'تأكيد الحذف', message: msg, okText: o.okText || 'نعم، احذف', showCancel: true })
};
function toast(msg, type = 'info') {
  const icons = { success:'check', error:'x', info:'info', warning:'warning' };

  const el = document.createElement('div');
  el.className = 'toast ' + type;

function encodeBase64(str) { return btoa(unescape(encodeURIComponent(str))); }

async function ensureJSZip() {
  if (typeof JSZip !== 'undefined') return true;
  return new Promise((resolve) => {
    const existing = document.querySelector('script[data-jszip-loader]');
    if (existing) { existing.addEventListener('load', () => resolve(typeof JSZip !== 'undefined')); existing.addEventListener('error', () => resolve(false)); return; }
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    script.setAttribute('data-jszip-loader', '1');
    script.onload = () => resolve(typeof JSZip !== 'undefined');
    script.onerror = () => resolve(false);
    document.head.appendChild(script);
  });
}

let _themeMediaListener = null;
function initTheme() {
  let saved = localStorage.getItem(THEME_KEY);
  if (!saved) saved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', saved);
  updateMetaThemeColor(saved);
  updateThemeBtn();
  if (window.matchMedia) {
    if (_themeMediaListener) window.matchMedia('(prefers-color-scheme: dark)').removeEventListener?.('change', _themeMediaListener);
    _themeMediaListener = (e) => {
      if (!localStorage.getItem(THEME_KEY)) {
        const t = e.matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
        updateMetaThemeColor(t); updateThemeBtn();
      }
    };
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', _themeMediaListener);
  }
}
function updateMetaThemeColor(theme) {
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', theme === 'dark' ? '#070b15' : '#3654d4');
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem(THEME_KEY, next);
  updateMetaThemeColor(next); updateThemeBtn();
  const btn = document.getElementById('themeBtn');
  if (btn) { btn.style.transform = 'rotate(360deg) scale(1.15)'; setTimeout(() => { btn.style.transform = ''; }, 350); }
}
function updateThemeBtn() {

  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';

window.doLogin = async function () {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginError');
  const loadEl = document.getElementById('loginLoading');
  const btn = document.getElementById('loginBtn');
  errEl.classList.remove('show'); errEl.textContent = ''; loadEl.textContent = '';

  const keyFieldEl = document.getElementById('keyField');
  if (keyFieldEl.style.display !== 'none') {
    const t = document.getElementById('loginKey').value.trim();
    if (t) { saveKey(t); updateKeyStatus(); }
  }
  if (!getStoredKey()) { errEl.textContent = MSG.keyMissing; errEl.classList.add('show'); return; }
  if (!u || !p) { errEl.textContent = 'يرجى إدخال اسم المستخدم وكلمة المرور'; errEl.classList.add('show'); return; }
  if (location.protocol === 'file:') { errEl.textContent = 'يرجى فتح النظام عبر الرابط الرسمي'; errEl.classList.add('show'); return; }

  btn.disabled = true;
  loadEl.textContent = 'جاري التحقق...';
  showLoading('جاري التحقق من البيانات...', 20);
  try {
    setLoadingProgress(50, 'جاري التحميل...');
    await readAll();
    await loadActivity();
    const meta = await readMeta();
    localMeta = meta;
    setLoadingProgress(80, 'جاري تسجيل الدخول...');

    if (!cache.users.length) {
      errEl.textContent = MSG.storageIssues;
      errEl.classList.add('show');
      btn.disabled = false; loadEl.textContent = ''; hideLoading();
      return;
    }

    // ─── التحقق من كلمة المرور (يدعم الجديد والقديم) ───
    let found = null;
    for (const candidate of cache.users) {
      if (candidate.username !== u) continue;
      const ok = await Crypto.verifyPassword(p, candidate);
      if (ok) { found = candidate; break; }
    }
    if (!found) {
      errEl.textContent = MSG.authFail;
      errEl.classList.add('show');
      btn.disabled = false; loadEl.textContent = ''; hideLoading();
      return;
    }

    // ─── ترحيل تلقائي لكلمة المرور القديمة → Hashed ───
    if (Crypto.needsMigration(found)) {
      try {
        const { passwordHash, passwordSalt, passwordAlgo } = await Crypto.hashPassword(p);
        found.passwordHash = passwordHash;
        found.passwordSalt = passwordSalt;
        found.passwordAlgo = passwordAlgo;
        delete found.password;
        const idx = cache.users.findIndex(x => x.id === found.id);
        if (idx > -1) cache.users[idx] = found;
        persistKeys(['users']).catch(() => {});
      } catch (e) { /* تجاهل */ }
    }

    hideKeyForever();

    if (hasLegacyFiles && found.role === ROLE_OWNER) {
      hideLoading();
      const ok = await dialog.confirm('سيتم تحديث طريقة حفظ البيانات، هل تريد المتابعة؟', { title: 'تحديث', okText: 'الآن', cancelText: 'لاحقاً' });
      if (ok) { try { showLoading('جاري التحديث...'); await saveAllDataNowSilent(); hideLoading(); hasLegacyFiles = false; } catch (e2) { hideLoading(); } }
    }
    setLoadingProgress(100, 'تم الدخول');
    localStorage.setItem('oms_lastUser', u);
    currentUser = normalizeUser(found);
    logActivity('login', `تسجيل دخول: ${u}`, `الدور: ${currentUser.role}`, 'success');
    loadEl.textContent = 'تم الدخول';
    hideLoading();
    startApp();
  } catch (e) {
    errEl.textContent = e.message || MSG.connFail;
    errEl.classList.add('show');
    hideLoading();
  }
  finally { btn.disabled = false; }
};

  const branch = document.getElementById('orderBranch').value;
  const id = document.getElementById('orderId').value;
  const isLogEdit = document.getElementById('orderLogMode').value === '1';
  if (!invoice) { setFieldError('orderInvoice', 'رقم الفاتورة مطلوب'); valid = false; }
  else {
    const excludeType = isLogEdit ? 'log' : (id ? 'orders' : null);
    if (isInvoiceDuplicate(invoice, id, excludeType)) {
      setFieldError('orderInvoice', MSG.invoiceDup);
      valid = false;
    }
  }
  if (!branch) { setFieldError('orderBranch', 'الفرع مطلوب'); valid = false; }
  if (!customer) { setFieldError('orderCustomer', 'العميل مطلوب'); valid = false; }
  else {
    let matched = customerId ? cache.customers.find(c => c.id === customerId) : null;
    if (!matched) matched = cache.customers.find(c => c.name.toLowerCase() === customer.toLowerCase());
    if (!matched) { setFieldError('orderCustomer', 'اختر عميلاً من القائمة'); valid = false; }

      document.getElementById('orderCustomerPhone').value = matched.phone || '';

    }
  }
  if (!valid) { focusFirstError('orderModal'); toast('يرجى تعبئة الحقول المطلوبة', 'error'); }
  return valid;
}
window.saveOrder = async function () {

function initCustomerSearch() {
  const input = document.getElementById('orderCustomer');
  const dropdown = document.getElementById('customerDropdown');
  if (!input || !dropdown) return;
  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    document.getElementById('orderCustomerId').value = '';
    document.getElementById('orderCustomerPhone').value = '';
    clearFieldError('orderCustomer');
    if (!q) { dropdown.classList.remove('show'); return; }
    const matches = cache.customers.filter(c => `${c.code} ${c.name} ${c.phone} ${c.location}`.toLowerCase().includes(q)).slice(0, 8);
    let html = matches.length ? matches.map(c => `<div class="customer-option" data-id="${c.id}" data-name="${esc(c.name)}" data-loc="${esc(c.location)}" data-phone="${esc(c.phone || '')}"><span class="loc">${esc(c.location)}</span><b>${esc(c.name)}</b> <span class="code">${esc(c.code || '')}</span></div>`).join('') : '';
    const exact = cache.customers.some(c => c.name.toLowerCase() === q);
    if (!exact && q.length >= 2) html += `<div class="customer-option create" data-create="1">إنشاء عميل جديد: "${esc(input.value)}"</div>`;
    if (!html) html = '<div class="customer-option empty">لا توجد نتائج</div>';
    dropdown.innerHTML = html; dropdown.classList.add('show');
    dropdown.querySelectorAll('.customer-option').forEach(opt => {
      opt.addEventListener('mousedown', e => {
        e.preventDefault();
        if (opt.dataset.create) {
          document.getElementById('custName').value = input.value.trim();
          document.getElementById('custId').value = '';
          document.getElementById('custModalTitle').innerHTML = ico('user', 20) + '<span>عميل جديد</span>';
          ['custCode','custLocation','custPhone'].forEach(id => document.getElementById(id).value = '');
          clearAllErrors('customerModal');
          openModal('customerModal');
          setTimeout(() => document.getElementById('custCode').focus(), 100);
          dropdown.classList.remove('show');
        } else {
          document.getElementById('orderCustomerId').value = opt.dataset.id;
          input.value = opt.dataset.name;
          document.getElementById('orderCustomerPhone').value = opt.dataset.phone || '';
          document.getElementById('orderLocation').value = opt.dataset.loc || '';
          dropdown.classList.remove('show');
        }
      });
    });
  });
  input.addEventListener('focus', () => { if (input.value.trim()) input.dispatchEvent(new Event('input')); });
  input.addEventListener('blur', () => setTimeout(() => dropdown.classList.remove('show'), 150));
}

/* ══════════════════════════════════════════════════════════════
   WHATSAPP — فتح ذكي حسب المنصة
   ══════════════════════════════════════════════════════════════ */
function buildWhatsAppMessage(order) {
  const tpl = (templates.whatsapp?.message) || DEFAULT_TEMPLATES.whatsapp.message;
  return tpl
    .replace(/{customer}/g, order.customer || '')
    .replace(/{invoice}/g, order.invoice || '')
    .replace(/{driver}/g, order.driver || '—')
    .replace(/{driverPhone}/g, order.driverPhone || '—')
    .replace(/{customerPhone}/g, order.customerPhone || '—')
    .replace(/{date}/g, fmtDate());
}
function normalizePhoneForWhatsApp(phone) {
  if (!phone) return '';
  let p = String(phone).trim();
  p = p.replace(/[^0-9]/g, '');
  if (/^7\d{8}$/.test(p)) p = '967' + p;
  else if (/^0\d{9}$/.test(p)) p = '967' + p.substring(1);
  return p;
}
function openBackgroundTab(url, closeAfterMs = 5000) {
  let win = null;
  try { win = window.open(url, '_blank'); } catch (_) { win = null; }
  if (!win) return null;
  try { win.blur(); } catch (_) {}
  try { window.focus(); } catch (_) {}
  if (closeAfterMs > 0) {
    setTimeout(() => { try { win.close(); } catch (_) {} }, closeAfterMs);
  }
  return win;
}
function openWhatsApp(phone, message) {
  phone = String(phone).replace(/[^\d]/g, '');
  const text = encodeURIComponent(message);
  const ua = navigator.userAgent;
  const isAndroid = /Android/i.test(ua);
  const isIOS = /iPhone|iPad|iPod/i.test(ua);
  const isWindows = /Windows/i.test(ua);

  if (isAndroid) {
    const appUrl = `intent://send?phone=${phone}&text=${text}#Intent;scheme=whatsapp;package=com.whatsapp;end`;
    window.location.href = appUrl;
    setTimeout(() => { openBackgroundTab(`https://web.whatsapp.com/send?phone=${phone}&text=${text}`); }, 1800);
    return;
  }
  if (isIOS) {
    window.location.href = `whatsapp://send?phone=${phone}&text=${text}`;
    setTimeout(() => { openBackgroundTab(`https://web.whatsapp.com/send?phone=${phone}&text=${text}`); }, 1800);
    return;
  }
  if (isWindows) {
    window.location.href = `whatsapp://send?phone=${phone}&text=${text}`;
    setTimeout(() => { openBackgroundTab(`https://web.whatsapp.com/send?phone=${phone}&text=${text}`); }, 2000);
    return;
  }
  openBackgroundTab(`https://web.whatsapp.com/send?phone=${phone}&text=${text}`);
}
function triggerWhatsAppNotification(order) {
  if (templates.whatsapp?.enabled === false) return;
  if (!hasPerm('sendWhatsApp')) return;
  const phone = normalizePhoneForWhatsApp(order.customerPhone);
  if (!phone) { toast('لا يوجد رقم هاتف للعميل لإرسال الإشعار', 'warning'); return; }
  const message = buildWhatsAppMessage(order);
  logActivity('whatsapp-sent', `إرسال واتساب: ${order.invoice}`, `إلى: ${order.customer} (${order.customerPhone})`, 'success');
  openWhatsApp(phone, message);
}
window.sendWhatsAppManually = function(orderId) {
  if (!hasPerm('sendWhatsApp')) { toast(MSG.unauthorized, 'error'); return; }
  const o = cache.log.find(x => x.id === orderId) || cache.orders.find(x => x.id === orderId) || cache.ready.find(x => x.id === orderId);
  if (!o) { toast('الطلب غير موجود', 'error'); return; }

};

window.changeReceiptStatus = async function (id, newStatus) {
  const o = cache.log.find(x => x.id === id);
  if (!o) { renderLog(); return; }
  const current = o.receiptStatus || RECEIPT_NOT_RECEIVED;
  const isOwner = currentUser?.role === ROLE_OWNER;
  const canRevert = hasPerm('revertReceiptStatus');
  if (current === newStatus) { renderLog(); return; }
  if (current === RECEIPT_RECEIVED && !isOwner && !canRevert) { toast('لا يمكن التراجع عن تأكيد الاستلام', 'error'); renderLog(); return; }
  if (newStatus === RECEIPT_RECEIVED && !isOwner && !hasPerm('editReceiptStatus')) { toast(MSG.unauthorized, 'error'); renderLog(); return; }
  if (newStatus === RECEIPT_RECEIVED) {
    const ok = await dialog.confirm(`هل تم استلام الطلب "${o.invoice}" للعميل:\n\n"${o.customer}"؟`, { title: 'تأكيد الاستلام', okText: 'نعم، تم الاستلام', type: 'success', okClass: 'btn-success' });
    if (!ok) { renderLog(); return; }
  }
  if (newStatus === RECEIPT_NOT_RECEIVED && current === RECEIPT_RECEIVED) {
    const ok = await dialog.confirm(`إلغاء تأكيد استلام الطلب "${o.invoice}" للعميل "${o.customer}"؟`, { title: 'إلغاء الاستلام', okText: 'نعم، إلغاء', type: 'warning', okClass: 'btn-warning' });
    if (!ok) { renderLog(); return; }
  }
  const previous = current;
  const previousAt = o.receiptUpdatedAt;
  const previousBy = o.receiptUpdatedBy;
  o.receiptStatus = newStatus;
  o.receiptUpdatedAt = fmtDate();
  o.receiptUpdatedBy = currentUser.username;
  logActivity('receipt-status', newStatus === RECEIPT_RECEIVED ? `تأكيد استلام: ${o.invoice}` : `إلغاء استلام: ${o.invoice}`, `العميل: ${o.customer}`, newStatus === RECEIPT_RECEIVED ? 'success' : 'warning');
  try {
    await persistKeys(['log', 'activity']);
    renderLog();
    addNotification(newStatus === RECEIPT_RECEIVED ? 'تأكيد استلام' : 'إلغاء استلام', `${o.invoice} — ${o.customer}`, newStatus === RECEIPT_RECEIVED ? 'success' : 'warning', true);
    toast(newStatus === RECEIPT_RECEIVED ? '✅ تم تأكيد الاستلام' : 'تم إلغاء الاستلام', newStatus === RECEIPT_RECEIVED ? 'success' : 'warning');
    if (newStatus === RECEIPT_RECEIVED) { setTimeout(() => triggerWhatsAppNotification(o), 400); }
  } catch (e) {
    o.receiptStatus = previous;
    o.receiptUpdatedAt = previousAt;
    o.receiptUpdatedBy = previousBy;
    toast(e.message, 'error');
    renderLog();
  }
};

function buildPrintHTML(items, template, extra = {}) {
  const tpl = template;
  const replaceVars = (str) => String(str || '')
    .replace(/{date}/g, fmtDate())
    .replace(/{count}/g, items.length)
    .replace(/{user}/g, esc(currentUser.username))
    .replace(/{from}/g, extra.from || 'البداية')
    .replace(/{to}/g, extra.to || 'اليوم');
  const cols = [];
  if (tpl.showInvoice !== false)        cols.push({ key:'invoice',        header:'الفاتورة',      cls:'col-code',  weight: PRINT_COL_WEIGHTS.invoice,        cell:o => esc(o.invoice) });
  if (tpl.showBranch !== false)         cols.push({ key:'branch',         header:'الفرع',         cls:'',          weight: PRINT_COL_WEIGHTS.branch,         cell:o => esc(o.branch || DEFAULT_BRANCH_NAME) });
  if (tpl.showCustomer !== false)       cols.push({ key:'customer',       header:'العميل',        cls:'col-name',  weight: PRINT_COL_WEIGHTS.customer,       cell:o => esc(o.customer) });
  if (tpl.showCustomerPhone !== false)  cols.push({ key:'customerPhone',  header:'هاتف العميل',   cls:'col-code',  weight: PRINT_COL_WEIGHTS.customerPhone,  cell:o => esc(o.customerPhone || '—') });
  if (tpl.showLocation !== false)       cols.push({ key:'location',       header:'الموقع',        cls:'',          weight: PRINT_COL_WEIGHTS.location,       cell:o => esc(o.location) });
  if (tpl.showStatus !== false)         cols.push({ key:'status',         header:'الحالة',        cls:'',          weight: PRINT_COL_WEIGHTS.status,         cell:o => esc(o.status) });
  if (tpl.showApprovalDate !== false)   cols.push({ key:'approvalDate',   header:'الاعتماد',      cls:'col-code',  weight: PRINT_COL_WEIGHTS.approvalDate,   cell:o => esc(o.approvalDate || '—') });
  if (tpl.showPay !== false)            cols.push({ key:'pay',            header:'الدفع',         cls:'',          weight: PRINT_COL_WEIGHTS.pay,            cell:o => esc(o.pay || '—') });
  if (tpl.showDriver !== false)         cols.push({ key:'driver',         header:'الموصل',        cls:'col-name',  weight: PRINT_COL_WEIGHTS.driver,         cell:o => esc(o.driver || '—') });
  if (tpl.showDriverPhone !== false)    cols.push({ key:'driverPhone',    header:'هاتف الموصل',   cls:'col-code',  weight: PRINT_COL_WEIGHTS.driverPhone,    cell:o => esc(o.driverPhone || '—') });
  if (tpl.showNotes !== false)          cols.push({ key:'notes',          header:'ملاحظات',       cls:'col-notes', weight: PRINT_COL_WEIGHTS.notes,          cell:o => esc(o.notes || '—') });
  if (tpl.showArchivedAt)               cols.push({ key:'archivedAt',     header:'تاريخ الترحيل', cls:'col-code',  weight: PRINT_COL_WEIGHTS.archivedAt,     cell:o => esc(o.archivedAt || '—') });
  if (tpl.showReceiptStatus)            cols.push({ key:'receiptStatus',  header:'حالة الاستلام', cls:'',          weight: PRINT_COL_WEIGHTS.receiptStatus,  cell:o => esc(o.receiptStatus || RECEIPT_NOT_RECEIVED) });
  const allCols = [{ key:'index', header:'#', cls:'col-num', weight: PRINT_COL_WEIGHTS.index, cell:null }].concat(cols);
  const totalWeight = allCols.reduce((s, c) => s + c.weight, 0);
  const colgroup = allCols.map(c => `<col style="width:${((c.weight / totalWeight) * 100).toFixed(3)}%">`).join('');
  const headersHTML = allCols.map(c => `<th class="${c.cls}"><span class="fit-text">${esc(c.header)}</span></th>`).join('');
  const rowsHTML = items.map((o, i) => {
    const cells = allCols.map(c => {
      const content = c.cell ? c.cell(o) : String(i + 1);
      if (c.cls === 'col-notes') return `<td class="${c.cls}">${content}</td>`;
      return `<td class="${c.cls}"><span class="fit-text">${content}</span></td>`;
    }).join('');
    return `<tr>${cells}</tr>`;
  }).join('');
  const paperKey = tpl.paperSize || 'A4';
  const paper = PAPER_SIZES[paperKey] || PAPER_SIZES.A4;
  const baseFont = tpl.fontSize || 10;
  const titleSize = baseFont + 5;
  const metaSize = baseFont;
  const footSize = baseFont;
  const smallFont = +(baseFont * 0.92).toFixed(2);
  const printableW = paper.w - 16;
  const logoW = Math.min(templates.logoWidth || 180, printableW);
  const logoH = templates.logoHeight || 40;
  const logoHTML = templates.logo
    ? `<div class="print-logo"><img src="${templates.logo}" alt="" style="width:${logoW}mm;max-width:100%;height:auto;max-height:${logoH}mm;object-fit:contain;display:block;margin:0 auto;"></div>`
    : '';
  return `<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><title>${esc(replaceVars(tpl.title))}</title>
    <style>
      @page { size: ${paper.w}mm ${paper.h}mm portrait; margin: 8mm; }
      * { box-sizing: border-box; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }
      html, body { margin: 0; padding: 0; background: #fff; color: #000; font-family: Tahoma, Arial, sans-serif; }
      .print-logo { text-align: center; margin: 0 0 4mm 0; }
      h1 { font-size: ${titleSize}pt; color: #1d3193; margin: 0 0 2mm 0; text-align: center; font-weight: 700; line-height: 1.3; }
      .meta { text-align: center; font-size: ${metaSize}pt; color: #475569; margin: 0 0 3mm 0; line-height: 1.4; }
      table { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: ${baseFont}pt; }
      th, td { border: 1px solid #334155; padding: 3px 5px; vertical-align: middle; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: clip; }
      thead { display: table-header-group; }
      tfoot { display: table-footer-group; }
      th { background: #1d3193; color: #fff; font-weight: 700; text-align: center; font-size: ${smallFont}pt; }
      td { text-align: right; background: #fff; }
      tbody tr:nth-child(even) td { background: #eef4ff; }
      tbody tr { page-break-inside: avoid; break-inside: avoid; }
      .fit-text { display: inline-block; white-space: nowrap; vertical-align: middle; transform-origin: right center; }
      th .fit-text { transform-origin: center center; }
      .col-num { text-align: center !important; font-weight: 600; color: #1d3193; }
      .col-code { direction: ltr; text-align: center !important; font-family: 'Courier New', Consolas, monospace; }
      .col-notes { text-align: right !important; white-space: normal !important; overflow-wrap: anywhere; line-height: 1.4; overflow: visible; }
      .col-name { text-align: right !important; white-space: nowrap !important; }
      tfoot td { border: none; padding-top: 6mm; text-align: center; font-size: ${footSize}pt; color: #334155; background: #fff !important; white-space: normal; overflow: visible; }
    </style>
    </head><body>
    ${logoHTML}
    <h1>${esc(replaceVars(tpl.title))}</h1>
    <div class="meta">${esc(replaceVars(tpl.subtitle))}</div>
    <table>
      <colgroup>${colgroup}</colgroup>
      <thead><tr>${headersHTML}</tr></thead>
      <tbody>${rowsHTML}</tbody>
      ${tpl.footer ? `<tfoot><tr><td colspan="${allCols.length}">${esc(replaceVars(tpl.footer))}</td></tr></tfoot>` : ''}
    </table>
    <script>
      function fitPrintText() {
        const table = document.querySelector('table'); if (!table) return;
        const cells = table.querySelectorAll('thead th, tbody td:not(.col-notes)');
        cells.forEach(cell => {
          const text = cell.querySelector('.fit-text'); if (!text) return;
          text.style.transform = 'none'; text.style.fontSize = '';
          const base = parseFloat(getComputedStyle(text).fontSize) || ${baseFont} * 1.333;
          const min = 5 * 1.333;
          const available = Math.max(1, cell.clientWidth - 8);
          let size = base; text.style.fontSize = size + 'px';
          let guard = 120;
          while (text.scrollWidth > available && size > min && guard-- > 0) { size -= 0.2; text.style.fontSize = size + 'px'; }
          if (text.scrollWidth > available) {
            const scale = available / Math.max(1, text.scrollWidth);
            text.style.transform = 'scaleX(' + Math.max(0.08, scale).toFixed(4) + ')';
          }
        });
      }
      window.onload = () => setTimeout(() => { fitPrintText(); setTimeout(() => window.print(), 180); }, 350);
    <\/script>
    </body></html>`;
}

async function resizeImage(file, maxWidth = 1400) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const ratio = Math.min(1, maxWidth / img.width);
        canvas.width = Math.round(img.width * ratio);
        canvas.height = Math.round(img.height * ratio);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = reject; img.src = e.target.result;
    };
    reader.onerror = reject; reader.readAsDataURL(file);
  });
}

function renderPermissionsGrid() {

    return;
  }
  const grouped = {};
  grantable.forEach(key => {
    const def = PERMISSIONS[key];
    if (!def) return;
    if (!grouped[def.cat]) grouped[def.cat] = [];
    grouped[def.cat].push({ key, ...def });
  });
  let html = '';

    const items = grouped[cat] || []; if (!items.length) return;
    const catDef = PERM_CATEGORIES[cat];

    else if (!/[a-zA-Z]/.test(password) || !/[0-9]/.test(password)) { setFieldError('userPass', 'يجب أن تحتوي كلمة المرور على أحرف وأرقام'); valid = false; }
  } else if (password) {

    else if (!/[a-zA-Z]/.test(password) || !/[0-9]/.test(password)) { setFieldError('userPass', 'يجب أن تحتوي كلمة المرور على أحرف وأرقام'); valid = false; }

window.saveUser = async function () {
  if (!hasPerm('manageUsers')) { toast(MSG.unauthorized, 'error'); return; }
  if (!validateUserForm()) return;
  const id = document.getElementById('userId').value;
  const username = document.getElementById('userName').value.trim();
  const password = document.getElementById('userPass').value;
  const role = document.getElementById('userRole').value;
  if (id) {
    const existing = cache.users.find(u => u.id === id);
    if (!existing) { toast('المستخدم غير موجود', 'error'); return; }
    if (!canManageUser(existing)) { toast('لا يمكنك تعديل هذا المستخدم', 'error'); return; }
    if (existing.role === ROLE_OWNER && role !== ROLE_OWNER) {
      const ownersCount = cache.users.filter(u => u.role === ROLE_OWNER).length;
      if (ownersCount <= 1) { toast('لا يمكن تغيير دور المالك الوحيد', 'error'); return; }
    }
  } else {
    const allowedRoles = getAllowedRolesToCreate();
    if (!allowedRoles.includes(role)) { toast('لا يمكنك إنشاء هذا الدور', 'error'); return; }
  }
  let permissions = {};
  if (role === ROLE_OWNER) { permissions = {}; }
  else {
    const grantable = getGrantablePerms(role);
    grantable.forEach(k => { permissions[k] = tempPerms[k] === true; });
    if (currentUser.role === ROLE_MANAGER) {
      const ownPerms = ALL_PERM_KEYS.filter(k => currentUser.permissions?.[k] === true);
      Object.keys(permissions).forEach(k => { if (!ownPerms.includes(k)) permissions[k] = false; });
    }
    if (permissions.manageUsers) permissions.tabUsers = true;
  }

  // ─── تشفير كلمة المرور ───
  const existingUser = id ? cache.users.find(u => u.id === id) : null;
  let passwordFields = {};
  try {
    if (!id) {
      const h = await Crypto.hashPassword(password);
      passwordFields = h;
    } else if (existingUser) {
      if (!password) {
        // احتفظ بكلمة المرور الحالية
        if (existingUser.passwordHash) {
          passwordFields = {
            passwordHash: existingUser.passwordHash,
            passwordSalt: existingUser.passwordSalt,
            passwordAlgo: existingUser.passwordAlgo
          };
        } else {
          passwordFields = { password: existingUser.password };
        }
      } else {
        // كلمة مرور جديدة → شفّرها
        const h = await Crypto.hashPassword(password);
        passwordFields = h;
      }
    }
  } catch (e) {
    toast('تعذر تشفير كلمة المرور', 'error');
    return;
  }

  const userData = { id: id || uid(), username, role, permissions, ...passwordFields };

  if (id) {
    const idx = cache.users.findIndex(u => u.id === id);
    if (idx > -1) cache.users[idx] = userData;
    logActivity('edit-user', `تعديل: ${username}`, `الدور: ${role}`, 'warning');
  } else {
    cache.users.push(userData);
    logActivity('add-user', `إضافة: ${username}`, `الدور: ${role}`, 'success');
  }
  try {
    await persistKeys(['users', 'activity']);
    if (currentUser.username === username) { currentUser = normalizeUser(userData); applyPermissionsUI(); }
    closeModal('userModal'); renderUsers();
    toast(id ? 'تم التعديل بنجاح' : 'تم الإضافة بنجاح', 'success');
  } catch (e) { toast(e.message, 'error'); }
};

function handleEnterNavigation(e) {

  e.preventDefault();

  const fields = Array.from(modal.querySelectorAll('input:not([type=hidden]):not([disabled]), select:not([disabled]), textarea')).filter(f => f.offsetParent !== null && !f.readOnly);
  const idx = fields.indexOf(el); if (idx === -1) return;
  const nextIdx = e.shiftKey ? idx - 1 : idx + 1;
  if (nextIdx >= 0 && nextIdx < fields.length) { fields[nextIdx].focus(); if (fields[nextIdx].select) fields[nextIdx].select(); }
  else if (!e.shiftKey) { const mid = modal.parentElement.id; if (mid === 'orderModal') saveOrder(); else if (mid === 'customerModal') saveCustomer(); else if (mid === 'userModal') saveUser(); else if (mid === 'keyModal') saveNewKey(); }
}

      if (c === 'KeyM' && document.getElementById('page-ready').classList.contains('active')) { e.preventDefault(); moveReadyToLog(); return; }
      if (c === 'KeyA' && document.getElementById('page-ready').classList.contains('active')) { e.preventDefault(); selectAllReady(); return; }
      if (c === 'KeyD') { e.preventDefault(); toggleTheme(); return; }
      if (c === 'KeyI') { e.preventDefault(); toggleNotifPanel(); return; }
    }
    return;
  }
  if (!inInput && !activeModal && e.key === 'Delete') {
    const p = document.querySelector('.page.active')?.id?.replace('page-', '');
    if (p === 'entry' && selectedOrderId && hasPerm('deleteOrder')) { e.preventDefault(); deleteOrder(selectedOrderId); }
  }
});
['orderInvoice','orderCustomer','orderLocation','orderStatus','orderPay','orderDriver','orderDriverPhone','orderNotes','orderBranch'].forEach(id => {
  const el = document.getElementById(id);
  if (el) el.addEventListener('input', () => { clearTimeout(el._t); el._t = setTimeout(saveDraft, 1500); });
});

<script>
(function () {
    function prepareTablesForPrint() {
        const tables = document.querySelectorAll('table');
        tables.forEach(function (table) {
            const headers = table.querySelectorAll('thead th');
            let notesIndex = -1;
            headers.forEach(function (th, index) {
                const text = (th.textContent || '').trim().replace(/\s+/g, ' ');
                if (text.includes('ملاحظات') || text.includes('ملاحظة') || text.includes('الملاحظات') || text.toLowerCase().includes('notes')) notesIndex = index;
            });
            const rows = table.querySelectorAll('tr');
            rows.forEach(function (row) {
                const cells = row.querySelectorAll('th, td');
                cells.forEach(function (cell, index) {
                    if (index === notesIndex) {
                        cell.style.whiteSpace = 'normal'; cell.style.overflow = 'visible';
                        cell.style.textOverflow = 'initial'; cell.style.wordBreak = 'normal'; cell.style.overflowWrap = 'anywhere';
                        return;
                    }
                    cell.style.whiteSpace = 'nowrap'; cell.style.overflow = 'hidden'; cell.style.textOverflow = 'clip';
                    if (cell.tagName.toLowerCase() === 'td') {
                        let fontSize = 9;
                        cell.style.fontSize = fontSize + 'px';
                        while (cell.scrollWidth > cell.clientWidth && fontSize > 6) {
                            fontSize -= 0.25;
                            cell.style.fontSize = fontSize + 'px';
                        }
                    }
                });
            });
        });
    }
    window.addEventListener('beforeprint', function () { prepareTablesForPrint(); });
    if (window.matchMedia) {
        const mediaQuery = window.matchMedia('print');
        mediaQuery.addEventListener('change', function (event) { if (event.matches) prepareTablesForPrint(); });
    }
})();
</script>
