})();

/* ══════════════════════════════════════════════════════════════
   ANOMALY DETECTION
   ══════════════════════════════════════════════════════════════ */
const Anomaly = (() => {
  function getSettings() { return { ...DEFAULT_ANALYTICS_SETTINGS, ...(localMeta?.analyticsSettings || {}) }; }
  function detectAll() {
    const settings = getSettings();
    const anomalies = [];
    const all = Analytics.getAllOrders();
    const now = Date.now();
    const windowMs = settings.anomalyWindowDays * 86400000;
    const recent = all.filter(o => { const d = Analytics.getOrderDate(o); return d && (now - d.getTime()) <= windowMs; });
    const previous = all.filter(o => { const d = Analytics.getOrderDate(o); return d && (now - d.getTime()) > windowMs && (now - d.getTime()) <= windowMs * 2; });
    if (previous.length >= 5) {
      const drop = ((previous.length - recent.length) / previous.length) * 100;
      if (drop >= settings.anomalyDropPercent) anomalies.push({
        type: 'drop', severity: drop >= 60 ? 'high' : 'medium', icon: 'trendDown',
        title: 'انخفاض في عدد الطلبات',
        description: `انخفضت الطلبات بنسبة ${Math.round(drop)}% خلال آخر ${settings.anomalyWindowDays} أيام (${recent.length} مقابل ${previous.length})`,
        suggestion: 'راجع أسباب انخفاض الطلب'
      });
    }
    if (previous.length >= 5) {
      const spike = ((recent.length - previous.length) / previous.length) * 100;
      if (spike >= settings.anomalySpikePercent) anomalies.push({
        type: 'spike', severity: spike >= 100 ? 'high' : 'medium', icon: 'trendUp',
        title: 'ارتفاع غير طبيعي في الطلبات',
        description: `ارتفعت الطلبات بنسبة ${Math.round(spike)}% خلال آخر ${settings.anomalyWindowDays} أيام`,
        suggestion: 'تأكد من جاهزية الموصلين والمخزون'
      });
    }
    const customers = Analytics.analyzeCustomers();
    const inactive = customers.filter(c => c.daysSinceLastOrder && c.daysSinceLastOrder >= settings.anomalyInactiveDays && c.count >= 3);
    if (inactive.length > 0) {
      const top5 = inactive.slice(0, 5);
      anomalies.push({
        type: 'inactive-customers', severity: inactive.length >= 10 ? 'high' : 'medium', icon: 'user',
        title: `${inactive.length} عميل غير نشط`,
        description: `عملاء لم يطلبوا منذ ${settings.anomalyInactiveDays}+ يوماً:\n${top5.map(c => `• ${c.name} (${c.daysSinceLastOrder} يوم)`).join('\n')}`,
        suggestion: 'تواصل معهم'
      });
    }
    const recentWithPay = recent.filter(o => o.pay);
    if (recentWithPay.length >= 10) {
      const unpaidRate = (recentWithPay.filter(o => o.pay === 'غير مدفوع').length / recentWithPay.length) * 100;
      if (unpaidRate >= 40) anomalies.push({
        type: 'unpaid-rate', severity: unpaidRate >= 60 ? 'high' : 'medium', icon: 'money',
        title: 'نسبة الدفع منخفضة',
        description: `${Math.round(unpaidRate)}% من الطلبات الأخيرة غير مدفوعة`,
        suggestion: 'راجع آلية التحصيل'
      });
    }
    if (recent.length >= 20) {
      const custCount = {};
      recent.forEach(o => { if (o.customer) custCount[o.customer] = (custCount[o.customer] || 0) + 1; });
      const sorted = Object.entries(custCount).sort((a, b) => b[1] - a[1]);
      if (sorted.length > 0 && sorted[0][1] / recent.length >= 0.5) anomalies.push({
        type: 'customer-concentration', severity: 'medium', icon: 'crown',
        title: 'تركيز عالٍ على عميل واحد',
        description: `${sorted[0][0]} يمثل ${Math.round((sorted[0][1] / recent.length) * 100)}% من الطلبات الأخيرة`,
        suggestion: 'نوّع مصادر الطلبات'
      });
    }
    const drivers = Analytics.analyzeDrivers(recent);
    const lowPerformers = drivers.filter(d => d.total >= 5 && d.successRate < 50);
    if (lowPerformers.length > 0) anomalies.push({
      type: 'driver-performance', severity: 'medium', icon: 'truck',
      title: `${lowPerformers.length} موصل بأداء منخفض`,
      description: lowPerformers.map(d => `• ${d.name}: ${d.successRate}% نجاح (${d.total} طلب)`).join('\n'),
      suggestion: 'راجع أدائهم'
    });
    const invoiceMap = {};
    all.forEach(o => { if (!o.invoice) return; const key = String(o.invoice).trim(); if (!invoiceMap[key]) invoiceMap[key] = []; invoiceMap[key].push(o); });
    const duplicates = Object.entries(invoiceMap).filter(([_, arr]) => arr.length > 1);
    if (duplicates.length > 0) anomalies.push({
      type: 'duplicate-invoice', severity: 'high', icon: 'warning',
      title: `${duplicates.length} فاتورة مكررة!`,
      description: `أرقام فواتير متكررة:\n${duplicates.slice(0, 5).map(([inv, arr]) => `• ${inv} (${arr.length} مرة)`).join('\n')}`,
      suggestion: 'راجع هذه الفواتير فوراً'
    });
    const staleOrders = cache.orders.filter(o => { const d = parseDate(o.createdAt); if (!d) return false; return Math.floor((now - d.getTime()) / 86400000) >= 14; });
    if (staleOrders.length > 0) anomalies.push({
      type: 'stale-orders', severity: staleOrders.length >= 5 ? 'high' : 'medium', icon: 'clock',
      title: `${staleOrders.length} طلب قديم قيد الإدخال`,
      description: `طلبات لم تُحوَّل منذ 14+ يوماً`,
      suggestion: 'راجعها أو احذفها'
    });
    return anomalies.sort((a, b) => {
      const sev = { high: 3, medium: 2, low: 1 };
      return (sev[b.severity] || 0) - (sev[a.severity] || 0);
    });
  }
  return { detectAll };
})();

/* ══════════════════════════════════════════════════════════════
   DRIVER SUGGESTION
   ══════════════════════════════════════════════════════════════ */
const DriverSuggestion = (() => {
  function getSettings() { return { ...DEFAULT_ANALYTICS_SETTINGS, ...(localMeta?.analyticsSettings || {}) }; }
  function normalizeLocation(loc) { if (!loc) return ''; return loc.split(/[-–—,]/)[0].trim().toLowerCase(); }
  function _calcCandidates(customerLocation, excludeDriver = null) {
    const settings = getSettings();
    if (!settings.driverSuggestionEnabled) return [];
    if (!customerLocation) return [];
    const targetLoc = normalizeLocation(customerLocation);
    if (!targetLoc) return [];
    const all = Analytics.getAllOrders();
    const stats = {};
    all.forEach(o => {
      if (!o.driver) return;
      if (excludeDriver && o.driver === excludeDriver) return;
      const oLoc = normalizeLocation(o.location);
      if (!oLoc) return;
      let score = 0;
      if (oLoc === targetLoc) score = 3;
      else if (oLoc.includes(targetLoc) || targetLoc.includes(oLoc)) score = 2;
      else {
        const tWords = targetLoc.split(/\s+/);
        const oWords = oLoc.split(/\s+/);
        const common = tWords.filter(w => w.length > 2 && oWords.includes(w)).length;
        if (common > 0) score = 1;
      }
      if (score === 0) return;
      if (!stats[o.driver]) stats[o.driver] = { name: o.driver, phone: o.driverPhone || '', score: 0, count: 0, delivered: 0 };
      stats[o.driver].score += score;
      stats[o.driver].count++;
      if (o.receiptStatus === RECEIPT_RECEIVED || o.status === 'جاهز') stats[o.driver].delivered++;
      if (o.driverPhone) stats[o.driver].phone = o.driverPhone;
    });
    return Object.values(stats)
      .filter(s => s.count >= settings.driverSuggestionMinOrders)
      .map(s => ({ ...s, successRate: s.count > 0 ? Math.round((s.delivered / s.count) * 100) : 0, finalScore: s.score * 10 + s.successRate }))
      .sort((a, b) => b.finalScore - a.finalScore);
  }
  function suggest(customerLocation, excludeDriver = null) { const all = _calcCandidates(customerLocation, excludeDriver); return all.length > 0 ? all[0] : null; }
  function getAllSuggestions(customerLocation) { return _calcCandidates(customerLocation).slice(0, 3); }
  return { suggest, getAllSuggestions };
})();

window.applyDriverSuggestion = function(driverName, phone) {

/* ══════════════════════════════════════════════════════════════
   PERMISSIONS & ROLES
   ══════════════════════════════════════════════════════════════ */
function roleLabel(role) {
  if (role === ROLE_OWNER)   return { label:'مالك',  icon:'crown',  cls:'badge-owner' };
  if (role === ROLE_MANAGER) return { label:'مدير',  icon:'shield', cls:'badge-manager' };
  return { label:'عامل', icon:'user', cls:'badge-worker' };
}
function canManageUser(targetUser) {
  if (!currentUser || !targetUser) return false;
  if (targetUser.id === currentUser.id) return false;
  if (currentUser.role === ROLE_OWNER) return true;
  if (currentUser.role === ROLE_MANAGER) { if (!currentUser.permissions?.manageUsers) return false; return targetUser.role === ROLE_WORKER; }
  return false;
}
function getGrantablePerms(targetRole) {
  if (!currentUser) return [];
  if (currentUser.role === ROLE_OWNER) { if (targetRole === ROLE_OWNER) return []; return ALL_PERM_KEYS; }
  if (currentUser.role === ROLE_MANAGER) { if (targetRole === ROLE_OWNER || targetRole === ROLE_MANAGER) return []; return ALL_PERM_KEYS.filter(k => currentUser.permissions?.[k] === true); }
  return [];
}
function getAllowedRolesToCreate() {
  if (!currentUser) return [];
  if (currentUser.role === ROLE_OWNER) return [ROLE_MANAGER, ROLE_WORKER];
  if (currentUser.role === ROLE_MANAGER) return [ROLE_WORKER];
  return [];
}
function hasPerm(perm) {
  if (!currentUser) return false;
  if (currentUser.role === ROLE_OWNER) return true;
  if (perm === 'tabUsers' && currentUser.permissions?.manageUsers === true) return true;
  return currentUser.permissions?.[perm] === true;
}
function normalizeUser(u) {
  if (!u) return u;
  if (u.role === 'رئيسي') u.role = ROLE_OWNER;
  if (u.role === 'عادي')  u.role = ROLE_WORKER;
  if (u.role !== ROLE_OWNER && u.role !== ROLE_MANAGER && u.role !== ROLE_WORKER) u.role = ROLE_WORKER;
  if (u.role === ROLE_OWNER) return u;
  if (!u.permissions) u.permissions = {};
  const clean = {};
  ALL_PERM_KEYS.forEach(k => { clean[k] = u.permissions[k] === true; });
  u.permissions = clean;
  return u;
}
function applyPermissionsUI() {
  document.querySelectorAll('[class*="perm-"]').forEach(el => {
    const classes = el.className.split(' ');
    let allowed = true;
    classes.forEach(c => { if (c.startsWith('perm-')) { const perm = c.replace('perm-', ''); if (PERMISSIONS[perm] && !hasPerm(perm)) allowed = false; } });
    el.style.display = allowed ? '' : 'none';
  });
  rebuildNav(); rebuildSettingsTabs(); applyFeatureUI();
}

function getFilteredActivity() {

function renderActivity() {
  const el = document.getElementById('activityList'); const paginationEl = document.getElementById('activityPagination'); const statsEl = document.getElementById('activityStats');

  const start = (activityCurrentPage - 1) * ACTIVITY_PER_PAGE;
  const end = Math.min(start + ACTIVITY_PER_PAGE, total);
  const pageEntries = filtered.slice(start, end);
  el.innerHTML = pageEntries.map(a => {
    const typeClass = a.type === 'success' ? 'success' : a.type === 'danger' ? 'danger' : a.type === 'warning' ? 'warning' : '';
    const iconName = a.type === 'danger' ? 'trash' : a.type === 'success' ? 'check' : a.type === 'warning' ? 'warning' : 'info';
    return `<div class="activity-item"><div class="activity-icon ${typeClass}">${ico(iconName, 15)}</div><div class="activity-body"><div class="activity-title">${esc(a.title)}</div><div class="activity-desc">${esc(a.description || '')}</div><div class="activity-meta"><span>${ico('user', 11)} ${esc(a.user)}</span><span>${ico('clock', 11)} ${esc(a.time)}</span></div></div></div>`;
  }).join('');
  if (!paginationEl) return;
  const pageButtons = buildPageNumbers(activityCurrentPage, totalPages);
  paginationEl.innerHTML = `<div class="activity-pagination-inner"><button class="pg-btn" onclick="activityGoFirst()" ${activityCurrentPage === 1 ? 'disabled' : ''}>${ico('chevronsRight', 14)}</button><button class="pg-btn" onclick="activityGoPrev()" ${activityCurrentPage === 1 ? 'disabled' : ''}>${ico('arrowRight', 14)}</button>${pageButtons}<button class="pg-btn" onclick="activityGoNext()" ${activityCurrentPage === totalPages ? 'disabled' : ''}>${ico('arrowRight', 14)}</button><button class="pg-btn" onclick="activityGoLast()" ${activityCurrentPage === totalPages ? 'disabled' : ''}>${ico('chevronsLeft', 14)}</button><span class="pg-info">صفحة <b>${activityCurrentPage}</b> / <b>${totalPages}</b></span><span class="pg-info">عرض ${start + 1}-${end} من ${total}</span></div>`;
}
function buildPageNumbers(current, total) {
  const buttons = [];
  const maxButtons = 7;
  if (total <= maxButtons) { for (let i = 1; i <= total; i++) buttons.push(i); }
  else {
    buttons.push(1);
    let start = Math.max(2, current - 2);
    let end = Math.min(total - 1, current + 2);
    if (start > 2) buttons.push('...');
    for (let i = start; i <= end; i++) buttons.push(i);
    if (end < total - 1) buttons.push('...');
    buttons.push(total);
  }
  return buttons.map(n => {
    if (n === '...') return `<span class="pg-dots">…</span>`;
    const isActive = n === current;
    return `<button class="pg-num ${isActive ? 'active' : ''}" onclick="activityGoPage(${n})">${n}</button>`;
  }).join('');
}

let dialogCallback = null;
function showDialog(opts) {
  return new Promise(resolve => {
    dialogCallback = resolve;
    const { type = 'info', title, message, okText, cancelText, showCancel = true, okClass } = opts;
    const iconMap = { info:'info', warning:'warning', danger:'trash', success:'check', question:'info' };
    const titleMap = { info:'تنبيه', warning:'تحذير', danger:'تأكيد الحذف', success:'تم بنجاح', question:'تأكيد' };
    const iconEl = document.getElementById('dialogIcon');
    iconEl.className = 'dialog-icon ' + (type === 'danger' ? 'danger' : type === 'warning' ? 'warning' : type === 'success' ? 'success' : 'info');
    iconEl.innerHTML = ico(iconMap[type] || 'info', 34);
    document.getElementById('dialogTitle').textContent = title || titleMap[type] || 'تنبيه';
    document.getElementById('dialogMessage').textContent = message || '';
    document.getElementById('dialogOkBtn').textContent = okText || 'موافق';
    document.getElementById('dialogOkBtn').className = 'btn ' + (okClass || (type === 'danger' ? 'btn-danger' : type === 'success' ? 'btn-success' : 'btn-primary'));
    const cancelBtn = document.getElementById('dialogCancelBtn');
    cancelBtn.textContent = cancelText || 'إلغاء';
    cancelBtn.style.display = showCancel ? '' : 'none';
    document.getElementById('dialogBg').classList.add('active');
  });
}
window.dialogResolve = function(r) {
  document.getElementById('dialogBg').classList.remove('active');
  if (dialogCallback) dialogCallback(r);
  dialogCallback = null;
};
const dialog = {
  alert: (msg, o = {}) => showDialog({ type: o.type || 'info', title: o.title, message: msg, showCancel: false, okText: o.okText || 'حسناً' }),
  confirm: (msg, o = {}) => showDialog({ type: o.type || 'question', title: o.title, message: msg, okText: o.okText || 'تأكيد', showCancel: true, okClass: o.okClass }),
  danger: (msg, o = {}) => showDialog({ type: 'danger', title: o.title || 'تأكيد الحذف', message: msg, okText: o.okText || 'نعم، احذف', showCancel: true })
};
function toast(msg, type = 'info') {
  const icons = { success:'check', error:'x', info:'info', warning:'warning' };
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = `<span class="toast-icon">${ico(icons[type] || 'info', 14)}</span><span class="toast-msg">${msg}</span>`;
  container.appendChild(el);

  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 400); }, 3200);
}

   ══════════════════════════════════════════════════════════════ */
let _themeMediaListener = null;
function initTheme() {
  let saved = localStorage.getItem(THEME_KEY);
  if (!saved) saved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', saved);
  updateMetaThemeColor(saved); updateThemeBtn();
  if (window.matchMedia) {
    if (_themeMediaListener) window.matchMedia('(prefers-color-scheme: dark)').removeEventListener?.('change', _themeMediaListener);
    _themeMediaListener = (e) => {
      if (!localStorage.getItem(THEME_KEY)) {
        const t = e.matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
        updateMetaThemeColor(t); updateThemeBtn();
      }
    };
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', _themeMediaListener);
  }
}
function updateMetaThemeColor(theme) {
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', theme === 'dark' ? '#070b15' : '#3654d4');
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem(THEME_KEY, next);
  updateMetaThemeColor(next); updateThemeBtn();
  const btn = document.getElementById('themeBtn');
  if (btn) { btn.style.transform = 'rotate(360deg) scale(1.15)'; setTimeout(() => { btn.style.transform = ''; }, 350); }
}
function updateThemeBtn() {
  const btn = document.getElementById('themeBtn'); if (!btn) return;
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  btn.innerHTML = isDark ? ico('sun', 17) : ico('moon', 17);
  btn.setAttribute('title', isDark ? 'الوضع النهاري' : 'الوضع الليلي');
}

/* ══════════════════════════════════════════════════════════════
   SESSION TIMER
   ══════════════════════════════════════════════════════════════ */
function startSessionTimer() {
  stopSessionTimer();
  sessionExpireAt = Date.now() + SESSION_TIMEOUT;
  updateSessionTimer();
  sessionTimer = setInterval(updateSessionTimer, 1000);
  sessionWarningTimer = setInterval(checkSessionWarning, 1000);
}
function stopSessionTimer() {
  if (sessionTimer) { clearInterval(sessionTimer); sessionTimer = null; }
  if (sessionWarningTimer) { clearInterval(sessionWarningTimer); sessionWarningTimer = null; }
}
function resetSessionTimer() { if (currentUser) sessionExpireAt = Date.now() + SESSION_TIMEOUT; }
function updateSessionTimer() {
  if (!currentUser) return;
  const el = document.getElementById('sessionTimer'); const txt = document.getElementById('sessionTimerText');
  if (!el || !txt) return;
  const remaining = sessionExpireAt - Date.now();
  if (remaining <= 0) { txt.textContent = 'منتهية'; el.className = 'session-timer danger'; return; }
  const mins = Math.floor(remaining / 60000);
  const secs = Math.floor((remaining % 60000) / 1000);
  txt.textContent = `${mins}:${String(secs).padStart(2, '0')}`;
  if (remaining < 2 * 60 * 1000) el.className = 'session-timer danger';
  else if (remaining < SESSION_WARNING) el.className = 'session-timer warning';
  else el.className = 'session-timer';
}
function checkSessionWarning() {
  if (!currentUser) return;
  const remaining = sessionExpireAt - Date.now();
  if (remaining <= 0) { stopSessionTimer(); logout(true); toast(MSG.sessionExpired, 'warning'); return; }
  if (remaining <= SESSION_WARNING && remaining > SESSION_WARNING - 1000) addNotification('تنبيه', MSG.sessionWarning, 'warning', true);
}
['mousemove','keydown','click','scroll','touchstart'].forEach(evt => {
  document.addEventListener(evt, () => { if (currentUser) resetSessionTimer(); }, { passive: true });
});

/* ══════════════════════════════════════════════════════════════
   INVOICE DUP CHECK
   ══════════════════════════════════════════════════════════════ */
function isInvoiceDuplicate(invoice, excludeId, excludeType) {
  if (!invoice) return false;
  const inv = String(invoice).trim().toLowerCase();
  if (!inv) return false;
  if (excludeType !== 'orders') { for (const o of cache.orders) { if ((o.invoice || '').trim().toLowerCase() === inv) return true; } }
  else if (excludeId) { for (const o of cache.orders) { if (o.id === excludeId) continue; if ((o.invoice || '').trim().toLowerCase() === inv) return true; } }
  else { for (const o of cache.orders) { if ((o.invoice || '').trim().toLowerCase() === inv) return true; } }
  for (const o of cache.ready) { if ((o.invoice || '').trim().toLowerCase() === inv) return true; }
  if (excludeType !== 'log') { for (const o of cache.log) { if ((o.invoice || '').trim().toLowerCase() === inv) return true; } }
  else if (excludeId) { for (const o of cache.log) { if (o.id === excludeId) continue; if ((o.invoice || '').trim().toLowerCase() === inv) return true; } }
  else { for (const o of cache.log) { if ((o.invoice || '').trim().toLowerCase() === inv) return true; } }
  return false;
}

function getStatsDateRange() {
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  let from = null, to = null;
  if (statsFilter === 'today') { from = today; to = new Date(today.getTime() + 86400000); }
  else if (statsFilter === 'week') { from = new Date(today.getTime() - 6 * 86400000); to = new Date(today.getTime() + 86400000); }
  else if (statsFilter === 'month') { from = new Date(today.getTime() - 29 * 86400000); to = new Date(today.getTime() + 86400000); }
  else if (statsFilter === 'custom') { if (statsFromDate) from = new Date(statsFromDate); if (statsToDate) { to = new Date(statsToDate); to.setDate(to.getDate() + 1); } }
  return { from, to };
}
function orderInRange(o, from, to) {
  if (!from && !to) return true;
  const d = parseDate(o.createdAt) || parseDate(o.transferredAt) || parseDate(o.archivedAt);
  if (!d) return false;
  if (from && d < from) return false;
  if (to && d >= to) return false;
  return true;
}

/* ══════════════════════════════════════════════════════════════
   DASHBOARD STATS
   ══════════════════════════════════════════════════════════════ */
function renderStats() {
  const { from, to } = getStatsDateRange();
  const allOrdersRaw = [...cache.orders, ...cache.ready, ...cache.log];
  const allOrders = allOrdersRaw.filter(o => orderInRange(o, from, to));
  const active = cache.orders.filter(o => orderInRange(o, from, to)).length;
  const ready = cache.ready.filter(o => orderInRange(o, from, to)).length;
  const archived = cache.log.filter(o => orderInRange(o, from, to)).length;
  const total = allOrders.length;
  const payPaid = allOrders.filter(o => o.pay === 'مدفوع').length;
  const payUnpaid = allOrders.filter(o => o.pay === 'غير مدفوع').length;
  const payVip = allOrders.filter(o => o.pay === 'VIP').length;
  const payTotalPaid = payPaid + payVip;
  const readyActive = allOrders.filter(o => o.status === 'جاهز').length;
  const progressActive = allOrders.filter(o => o.status === 'قيد التجهيز').length;
  const completionRate = total > 0 ? Math.round(((ready + archived) / total) * 100) : 0;
  const payRate = total > 0 ? Math.round((payTotalPaid / total) * 100) : 0;
  const unpaidRate = total > 0 ? Math.round((payUnpaid / total) * 100) : 0;
  const vipRate = total > 0 ? Math.round((payVip / total) * 100) : 0;
  const readyRate = active > 0 ? Math.round((readyActive / active) * 100) : 0;
  const today = new Date(); today.setHours(0,0,0,0);
  const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate()+1);
  const weekAgo = new Date(today); weekAgo.setDate(weekAgo.getDate()-7);
  const monthAgo = new Date(today); monthAgo.setDate(monthAgo.getDate()-30);
  const getOrderDate = (o) => parseDate(o.createdAt) || parseDate(o.transferredAt) || parseDate(o.archivedAt);
  const todayCount = allOrdersRaw.filter(o => { const d = getOrderDate(o); return d && d >= today && d < tomorrow; }).length;
  const weekCount = allOrdersRaw.filter(o => { const d = getOrderDate(o); return d && d >= weekAgo; }).length;
  const monthCount = allOrdersRaw.filter(o => { const d = getOrderDate(o); return d && d >= monthAgo; }).length;
  const avgDaily = Math.round((weekCount / 7) * 10) / 10;
  const avgMonthly = Math.round((monthCount / 30) * 10) / 10;
  const custCount = {};
  allOrders.forEach(o => { if (o.customer) custCount[o.customer] = (custCount[o.customer] || 0) + 1; });
  const topCustomers = Object.entries(custCount).sort((a,b) => b[1] - a[1]).slice(0, 5);
  const branchCount = {};
  allOrders.forEach(o => { const b = o.branch || DEFAULT_BRANCH_NAME; branchCount[b] = (branchCount[b] || 0) + 1; });
  const topBranches = Object.entries(branchCount).sort((a,b) => b[1] - a[1]);
  const driverCount = {};
  allOrders.forEach(o => { if (o.driver) driverCount[o.driver] = (driverCount[o.driver] || 0) + 1; });
  const topDrivers = Object.entries(driverCount).sort((a,b) => b[1] - a[1]).slice(0, 5);
  const userCount = {};
  allOrders.forEach(o => { if (o.lastEditBy) userCount[o.lastEditBy] = (userCount[o.lastEditBy] || 0) + 1; });
  const topUsers = Object.entries(userCount).sort((a,b) => b[1] - a[1]).slice(0, 5);
  const diff = (curr, prev) => {
    if (prev === 0 && curr === 0) return { dir:'flat', pct:0 };
    if (prev === 0) return { dir:'up', pct:100 };
    const pct = Math.round(((curr - prev) / prev) * 100);
    return { dir: pct > 0 ? 'up' : pct < 0 ? 'down' : 'flat', pct: Math.abs(pct) };
  };
  const trendIcon = (dir) => dir === 'up' ? ico('trendUp', 10) : dir === 'down' ? ico('trendDown', 10) : '';
  const badgeT = (t) => (t && t.dir !== 'flat') ? `<span class="trend ${t.dir}">${trendIcon(t.dir)}<span>${t.pct}%</span></span>` : '';

  document.getElementById('statsOverview').innerHTML = `
    <div class="stat"><div class="stat-head"><div class="stat-icon">${ico('layers', 17)}</div>${badgeT(diff(total, prevStats.total))}</div><div class="num">${total.toLocaleString()}</div><div class="lbl">إجمالي الطلبات</div><div class="sub">حسب الفترة المحددة</div></div>
    <div class="stat orange"><div class="stat-head"><div class="stat-icon">${ico('list', 17)}</div>${badgeT(diff(active, prevStats.orders))}</div><div class="num">${active.toLocaleString()}</div><div class="lbl">قيد الإدخال</div><div class="sub">${progressActive} قيد • ${readyActive} جاهز</div></div>
    <div class="stat green"><div class="stat-head"><div class="stat-icon">${ico('box', 17)}</div>${badgeT(diff(ready, prevStats.ready))}</div><div class="num">${ready.toLocaleString()}</div><div class="lbl">جاهزة للنقل</div><div class="sub">${readyRate}% من النشطة</div><div class="progress-bar"><div class="fill green" style="width:${readyRate}%"></div></div></div>
    <div class="stat purple"><div class="stat-head"><div class="stat-icon">${ico('archive', 17)}</div>${badgeT(diff(archived, prevStats.log))}</div><div class="num">${archived.toLocaleString()}</div><div class="lbl">في السجل</div><div class="sub">أرشيف نهائي</div></div>
    <div class="stat teal"><div class="stat-head"><div class="stat-icon">${ico('target', 17)}</div></div><div class="num">${completionRate}%</div><div class="lbl">نسبة الإنجاز</div><div class="progress-bar"><div class="fill" style="width:${completionRate}%"></div></div></div>`;
  document.getElementById('statsPayments').innerHTML = `
    <div class="stat green"><div class="stat-head"><div class="stat-icon">${ico('money', 17)}</div></div><div class="num small">${payTotalPaid.toLocaleString()}</div><div class="lbl">مدفوع + VIP</div><div class="sub">${payRate}% من الإجمالي</div><div class="progress-bar"><div class="fill green" style="width:${payRate}%"></div></div></div>
    <div class="stat red"><div class="stat-head"><div class="stat-icon">${ico('warning', 17)}</div></div><div class="num small">${payUnpaid.toLocaleString()}</div><div class="lbl">غير مدفوع</div><div class="sub">${unpaidRate}%</div><div class="progress-bar"><div class="fill red" style="width:${unpaidRate}%"></div></div></div>
    <div class="stat purple"><div class="stat-head"><div class="stat-icon">${ico('crown', 17)}</div></div><div class="num small">${payVip.toLocaleString()}</div><div class="lbl">VIP</div><div class="sub">${vipRate}%</div><div class="progress-bar"><div class="fill purple" style="width:${vipRate}%"></div></div></div>
    <div class="stat"><div class="stat-head"><div class="stat-icon">${ico('check', 17)}</div></div><div class="num small">${payPaid.toLocaleString()}</div><div class="lbl">مدفوع فقط</div><div class="sub">بدون VIP</div></div>`;
  document.getElementById('timeStatsContainer').innerHTML = `
    <div class="time-stats">
      <div class="time-stat"><div class="tv">${todayCount}</div><div class="tl">اليوم</div></div>
      <div class="time-stat"><div class="tv">${weekCount}</div><div class="tl">آخر 7 أيام</div></div>
      <div class="time-stat"><div class="tv">${monthCount}</div><div class="tl">آخر 30 يوم</div></div>
      <div class="time-stat"><div class="tv">${avgDaily}</div><div class="tl">متوسط يومي</div></div>
      <div class="time-stat"><div class="tv">${avgMonthly}</div><div class="tl">متوسط شهري</div></div>
    </div>`;
  renderDonut('donutChart', 'donutLegend', [
    { value: active, color: '#4266e8', label: 'قيد الإدخال' },
    { value: ready, color: '#0cb97b', label: 'جاهزة' },
    { value: archived, color: '#8b5cf6', label: 'في السجل' }
  ]);
  renderDonut('payDonutChart', 'payDonutLegend', [
    { value: payPaid, color: '#0cb97b', label: 'مدفوع' },
    { value: payUnpaid, color: '#ef3d52', label: 'غير مدفوع' },
    { value: payVip, color: '#f0a824', label: 'VIP' }
  ]);
  const branchColors = ['#4266e8','#0cb97b','#8b5cf6','#f97316','#14b8a6','#ec4899'];
  const branchSegments = topBranches.slice(0, 6).map((b, i) => ({ value: b[1], color: branchColors[i], label: b[0] }));
  renderDonut('branchDonutChart', 'branchDonutLegend', branchSegments);
  renderTopList('topCustomers', topCustomers, topCustomers[0]?.[1] || 1);
  renderTopList('topBranches', topBranches, topBranches[0]?.[1] || 1);
  renderTopList('topDrivers', topDrivers, topDrivers[0]?.[1] || 1);
  renderTopList('topUsers', topUsers, topUsers[0]?.[1] || 1);
  document.getElementById('performanceMetrics').innerHTML = `
    <div class="metric-box"><div class="mv">${total}</div><div class="ml">إجمالي الطلبات</div></div>
    <div class="metric-box"><div class="mv">${todayCount}</div><div class="ml">اليوم</div></div>
    <div class="metric-box"><div class="mv green">${payTotalPaid}</div><div class="ml">مدفوعة</div></div>

function renderDonut(chartId, legendId, segments) {
  const total = segments.reduce((s, x) => s + x.value, 0);
  const donut = document.getElementById(chartId); const legend = document.getElementById(legendId);
  if (!donut || !legend) return;
  if (total === 0) {
    donut.innerHTML = `<div class="center" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;"><div class="big" style="color:var(--text-muted);font-size:20px;">0</div><div class="small">لا بيانات</div></div>`;
    legend.innerHTML = '<div class="empty-top">لا توجد بيانات</div>';
    return;
  }
  const radius = 55, cx = 65, cy = 65, circumference = 2 * Math.PI * radius;
  let offset = 0;
  const circles = segments.map(s => {
    const p = s.value / total;
    const dash = p * circumference;
    const el = `<circle cx="${cx}" cy="${cy}" r="${radius}" stroke="${s.color}" stroke-dasharray="${dash} ${circumference - dash}" stroke-dashoffset="${-offset}" />`;
    offset += dash;
    return el;
  }).join('');
  donut.innerHTML = `<svg width="130" height="130" viewBox="0 0 130 130"><circle cx="${cx}" cy="${cy}" r="${radius}" stroke="var(--border)" stroke-width="15" fill="none"/>${circles}</svg><div class="center"><div class="big">${total.toLocaleString()}</div><div class="small">الإجمالي</div></div>`;
  legend.innerHTML = segments.filter(s => s.value > 0).map(s => {
    const p = total > 0 ? Math.round((s.value / total) * 100) : 0;
    return `<div class="legend-item"><span class="dot" style="background:${s.color};"></span><span class="name">${esc(s.label)}</span><span class="pct">${p}%</span><span class="val">${s.value}</span></div>`;
  }).join('');
}

function renderTrend7Days() {
  const days = [];
  const today = new Date(); today.setHours(0, 0, 0, 0);
  for (let i = 0; i <= 6; i++) { const d = new Date(today); d.setDate(d.getDate() - i); days.push(d); }
  const allOrders = [...cache.orders, ...cache.ready, ...cache.log];
  const counts = days.map(day => {
    const nextDay = new Date(day); nextDay.setDate(nextDay.getDate() + 1);
    return allOrders.filter(o => {
      const cd = parseDate(o.createdAt) || parseDate(o.transferredAt) || parseDate(o.archivedAt);
      return cd && cd >= day && cd < nextDay;
    }).length;
  });
  const max = Math.max(...counts, 1);
  const w = 100, h = 40;
  const points = counts.map((c, i) => { const x = w - (i / 6) * w; const y = h - (c / max) * (h - 6) - 3; return [x, y]; });
  const path = points.map((p, i) => (i === 0 ? 'M' : 'L') + p[0].toFixed(2) + ' ' + p[1].toFixed(2)).join(' ');
  const areaPath = path + ` L0 ${h} L${w} ${h} Z`;
  const dayNames = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  const el = document.getElementById('trendChart'); if (!el) return;
  el.innerHTML = `
    <svg viewBox="0 0 ${w + 4} ${h + 6}" preserveAspectRatio="none" style="width:100%;height:100px;direction:ltr;">
      <defs><linearGradient id="trendGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4266e8" stop-opacity="0.35"/><stop offset="100%" stop-color="#4266e8" stop-opacity="0"/></linearGradient></defs>
      <path d="${areaPath}" fill="url(#trendGrad)"/>
      <path d="${path}" fill="none" stroke="#4266e8" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
      ${points.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="0.8" fill="#4266e8" vector-effect="non-scaling-stroke" />`).join('')}
    </svg>
    <div style="display:flex;margin-top:6px;font-size:10.5px;color:var(--text-muted);font-weight:600;gap:4px;">
      ${days.map((d, i) => `<span style="text-align:center;flex:1;">${dayNames[d.getDay()]}<br><b style="color:var(--brand-600);">${counts[i]}</b></span>`).join('')}
    </div>`;
}

function getOrderGroup(orderId) {
  return (cache.groups || []).find(g => g.status !== 'مؤرشفة' && (g.orderIds || []).includes(orderId));
}
function isOrderInActiveGroup(orderId) { return !!getOrderGroup(orderId); }
function getGroupOrders(groupId) {
  const g = cache.groups.find(x => x.id === groupId); if (!g) return [];
  const orders = [];
  (g.orderIds || []).forEach(id => {
    const o = cache.ready.find(x => x.id === id) || cache.log.find(x => x.id === id);
    if (o) orders.push(o);
  });
  return orders;
}
function isOrderLockedByGroup(orderId, excludeGroupId = null) {
  return (cache.groups || []).some(g => {
    if (excludeGroupId && g.id === excludeGroupId) return false;
    if (g.status === 'مؤرشفة') return false;
    return (g.orderIds || []).includes(orderId);
  });
}

    : '';

function updateReadySelectionInfo() {

  if (!canSelect) { el.style.display = 'none'; return; }
  const data = getReadyFilteredData();
  const visibleIds = data.map(o => o.id);
  const selectedCount = visibleIds.filter(id => selectedReadyIds.has(id)).length;
  if (selectedCount === 0) { el.style.display = 'none'; }
  else { el.style.display = 'inline-flex'; el.classList.add('has-selection'); el.innerHTML = `${ico('checkSquare', 13)}<span>${selectedCount} من ${data.length} محدد</span>`; }
}
function renderReady() {
  const data = getReadyFilteredData();
  const body = document.getElementById('readyBody');
  if (!data.length) { body.innerHTML = emptyState('box', 'لا توجد طلبات جاهزة', 'قم بتحويل الطلبات', 15); updateReadyHeaderUI(); updateReadySelectionInfo(); return; }
  const canSelect = hasPerm('selectReadyOrders');
  const canReturn = hasPerm('returnSingle');
  body.innerHTML = data.map((o, i) => {
    const group = getOrderGroup(o.id);

    if (isLocked) checkboxCell = `<td style="text-align:center;" title="محجوز في مجموعة: ${esc(group.name)}">${ico('lock', 14)}</td>`;
    else if (canSelect) checkboxCell = `<td style="text-align:center;" onclick="event.stopPropagation()"><input type="checkbox" class="row-checkbox" ${isSelected ? 'checked' : ''} onchange="toggleReadySelection('${o.id}', this.checked)" onclick="event.stopPropagation()"></td>`;
    else checkboxCell = `<td style="text-align:center;"></td>`;
    let returnBtn;
    if (isLocked) returnBtn = `<span class="badge" style="background:linear-gradient(135deg,#8b5cf6,#7c3aed);color:#fff;font-size:10px;" title="محجوز في مجموعة: ${esc(group.name)}">${ico('lock', 11)} ${esc(group.name.substring(0, 15))}${group.name.length > 15 ? '…' : ''}</span>`;
    else if (canReturn) returnBtn = `<button class="btn btn-warning btn-sm" onclick="event.stopPropagation();returnReadyToEntry('${o.id}')" title="إرجاع">${ico('undo', 13)}<span>إرجاع</span></button>`;
    else returnBtn = '—';
    const rowClass = ((o.status === 'جاهز' ? 'status-ready ' : '') + (isSelected ? 'row-selected ' : '') + (isLocked ? 'row-locked' : '')).trim();
    return `<tr class="${rowClass}">
      ${checkboxCell}
      <td>${i+1}</td><td><b>${esc(o.invoice)}</b></td><td>${branchBadge(o.branch)}</td><td>${esc(o.customer)}</td>
      <td>${phoneBadge(o.customerPhone)}</td>
      <td>${esc(o.location)}</td><td>${badge(o.status)}</td>
      <td style="font-size:11.5px;color:var(--text-muted);">${esc(o.approvalDate || '—')}</td>
      <td>${badge(o.pay)}</td><td>${esc(o.driver)}</td><td>${esc(o.driverPhone)}</td>
      <td class="note-cell"><div class="note-text" title="${esc(o.notes)}">${esc(o.notes) || '—'}</div></td>
      <td style="font-size:11.5px;color:var(--text-muted);">${esc(o.lastEditBy || '—')}</td>

}
window.toggleReadySelection = function(id, checked) {
  if (!hasPerm('selectReadyOrders')) { toast(MSG.unauthorized, 'error'); return; }

};
window.onSelectAllReadyChange = function(checked) {
  if (!hasPerm('selectReadyOrders')) return;
  const data = getReadyFilteredData().filter(o => !isOrderInActiveGroup(o.id));
  if (checked) data.forEach(o => selectedReadyIds.add(o.id));
  else data.forEach(o => selectedReadyIds.delete(o.id));
  renderReady();
};
window.selectAllReady = function() {
  if (!hasPerm('selectReadyOrders')) { toast(MSG.unauthorized, 'error'); return; }
  const data = getReadyFilteredData().filter(o => !isOrderInActiveGroup(o.id));
  if (!data.length) { toast('لا توجد طلبات متاحة للتحديد', 'warning'); return; }

window.deselectAllReady = function() {
  if (!hasPerm('selectReadyOrders')) { toast(MSG.unauthorized, 'error'); return; }

};

/* ══════════════════════════════════════════════════════════════
   RENDER: LOG
   ══════════════════════════════════════════════════════════════ */
function getLogFilteredData() {
  const fromVal = document.getElementById('filterLogFrom')?.value || '';
  const toVal = document.getElementById('filterLogTo')?.value || '';
  const nameVal = (document.getElementById('filterLogName')?.value || '').trim().toLowerCase();
  const payVal = document.getElementById('filterLogPay')?.value || '';
  const receiptVal = document.getElementById('filterLogReceipt')?.value || '';
  const branchVal = document.getElementById('filterLogBranch')?.value || '';
  const fromDate = fromVal ? new Date(fromVal) : null;
  const toDate = toVal ? new Date(toVal + 'T23:59:59') : null;
  return cache.log.filter(o => {
    if (nameVal && !smartSearch(`${o.customer} ${o.invoice} ${o.customerPhone || ''}`, nameVal)) return false;
    if (payVal && o.pay !== payVal) return false;
    if (receiptVal && (o.receiptStatus || RECEIPT_NOT_RECEIVED) !== receiptVal) return false;
    if (branchVal && (o.branch || DEFAULT_BRANCH_NAME) !== branchVal) return false;
    const d = parseDate(o.approvalDate) || parseDate(o.archivedAt);
    if (fromDate && d && d < fromDate) return false;
    if (toDate && d && d > toDate) return false;
    if ((fromDate || toDate) && !d) return false;
    return true;
  });
}
function receiptStatusCell(o) {
  const status = o.receiptStatus || RECEIPT_NOT_RECEIVED;
  const isDone = status === RECEIPT_RECEIVED;
  const canEdit = hasPerm('editReceiptStatus');
  const canRevert = hasPerm('revertReceiptStatus');
  const isOwner = currentUser?.role === ROLE_OWNER;
  if (isDone && !canRevert && !isOwner) return `<span class="badge badge-received" title="تم الاستلام${o.receiptUpdatedBy ? ' • بواسطة ' + esc(o.receiptUpdatedBy) : ''}${o.receiptUpdatedAt ? ' • ' + esc(o.receiptUpdatedAt) : ''}">${ico('check', 11)} تم</span>`;
  if (!canEdit && !canRevert && !isOwner) return isDone ? `<span class="badge badge-received">${ico('check', 11)} تم</span>` : `<span class="badge badge-not-received">لا</span>`;
  const cls = isDone ? 'receipt-select is-done owner-locked' : 'receipt-select';
  return `<select class="${cls}" onclick="event.stopPropagation()" onchange="changeReceiptStatus('${o.id}', this.value)"><option value="${RECEIPT_NOT_RECEIVED}" ${!isDone ? 'selected' : ''}>لا</option><option value="${RECEIPT_RECEIVED}" ${isDone ? 'selected' : ''}>تم</option></select>`;
}
function renderLog() {
  const data = getLogFilteredData();
  const canEdit = hasPerm('editLog'), canDelete = hasPerm('deleteLog');
  const showActions = canEdit || canDelete;
  document.getElementById('logCount').textContent = `الإجمالي: ${cache.log.length}`;
  const fc = document.getElementById('logFilteredCount');
  if (fc) fc.textContent = `المُفلتر: ${data.length}`;
  const body = document.getElementById('logBody');
  if (!data.length) { body.innerHTML = emptyState('archive', 'لا توجد نتائج', cache.log.length ? 'جرّب تعديل الفلاتر' : 'لم يتم ترحيل بعد', 16); return; }
  body.innerHTML = data.map((o, i) => {
    const btns = `
      ${canEdit ? `<button class="btn btn-primary btn-sm" onclick="editFromLog('${o.id}')" title="تعديل">${ico('edit', 13)}</button>` : ''}
      ${canDelete ? `<button class="btn btn-danger btn-sm" onclick="deleteFromLog('${o.id}')" title="حذف">${ico('trash', 13)}</button>` : ''}`;
    return `<tr>
      <td>${i+1}</td><td><b>${esc(o.invoice)}</b></td><td>${branchBadge(o.branch)}</td><td>${esc(o.customer)}</td>
      <td>${phoneBadge(o.customerPhone)}</td>
      <td>${esc(o.location)}</td><td>${badge(o.status)}</td>
      <td style="font-size:11.5px;color:var(--text-muted);">${esc(o.approvalDate || '—')}</td>
      <td>${badge(o.pay)}</td><td>${esc(o.driver)}</td><td>${esc(o.driverPhone)}</td>
      <td class="note-cell"><div class="note-text" title="${esc(o.notes)}">${esc(o.notes) || '—'}</div></td>
      <td style="font-size:11.5px;color:var(--text-muted);">${esc(o.lastEditBy || '—')}</td>
      <td style="font-size:11.5px;color:var(--text-muted);">${esc(o.archivedAt || '—')}</td>
      <td class="no-print" style="text-align:center;">${receiptStatusCell(o)}</td>
      <td class="no-print" style="white-space:nowrap;">${showActions ? btns : '—'}</td>
    </tr>`;
  }).join('');
}
window.resetLogFilters = function () {
  document.getElementById('filterLogFrom').value = '';
  document.getElementById('filterLogTo').value = '';

  document.getElementById('filterLogPay').value = '';

  const renderGroupCard = (g, isArchived) => {

          </div>
          <div class="group-meta">
            ${g.driver ? `<span>${ico('truck', 12)} ${esc(g.driver)}</span>` : ''}
            ${driverPhone ? `<span>${ico('phone', 12)} ${esc(driverPhone)}</span>` : ''}

            <span>${ico('box', 12)} ${orders.length} طلب</span>

            ${isArchived && g.archivedAt ? `<span>${ico('archive', 12)} ${esc(g.archivedAt)}</span>` : `<span>${ico('clock', 12)} ${esc(g.createdAt || '—')}</span>`}
          </div>

          ${!isArchived && canEdit ? `<button class="btn btn-primary btn-sm" onclick="editGroup('${g.id}')" title="تعديل">${ico('edit', 13)}</button>` : ''}

        </div>

      ${orders.length > 0 ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;">${orders.slice(0, 20).map(o => `<span style="font-size:11px;padding:3px 8px;background:var(--card-bg);border-radius:10px;border:1px solid var(--border);">${esc(o.invoice)} — ${esc(o.customer)}</span>`).join('')}${orders.length > 20 ? `<span style="font-size:11px;padding:3px 8px;color:var(--text-muted);">+${orders.length - 20} أخرى</span>` : ''}</div>` : `<div style="font-size:12px;color:var(--text-muted);">لا توجد طلبات في هذه المجموعة</div>`}

function renderGroupOrdersList() {
  const el = document.getElementById('groupOrdersList'); if (!el) return;

  let available = [...cache.ready];
  available = available.filter(o => !isOrderLockedByGroup(o.id, currentGroupId));
  if (_groupCurrentFilter === 'none') {
    available = available.filter(o => !isOrderLockedByGroup(o.id, currentGroupId) && !(currentGroupId && (getGroupOrders(currentGroupId).some(x => x.id === o.id))));
  }
  if (!available.length) { el.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted);font-size:12px;">لا توجد طلبات متاحة (جميعها محجوزة في مجموعات أخرى)</div>'; return; }
  el.innerHTML = `
    <div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;">
      <button type="button" class="btn btn-ghost btn-sm" onclick="setGroupFilter('all')" style="font-size:11px;${_groupCurrentFilter === 'all' ? 'background:var(--brand-50);color:var(--brand-700);' : ''}">كل المتاحة (${available.length})</button>
      <button type="button" class="btn btn-ghost btn-sm" onclick="setGroupFilter('none')" style="font-size:11px;${_groupCurrentFilter === 'none' ? 'background:var(--brand-50);color:var(--brand-700);' : ''}">غير المُجمَّعة</button>
    </div>
    ${available.map(o => `
      <label style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer;transition:var(--transition);background:${_groupSelectedOrders.has(o.id) ? 'rgba(66,102,232,.08)' : 'transparent'};">
        <input type="checkbox" ${_groupSelectedOrders.has(o.id) ? 'checked' : ''} onchange="toggleGroupOrder('${o.id}', this.checked)" style="width:16px;height:16px;accent-color:var(--brand-500);">
        <div style="flex:1;min-width:0;">
          <div style="font-size:12.5px;font-weight:600;">${esc(o.invoice)} — ${esc(o.customer)}</div>
          <div style="font-size:11px;color:var(--text-muted);">${esc(o.location || '—')} • ${esc(o.driver || 'بدون موصل')}</div>
        </div>
      </label>`).join('')}`;
}
window.setGroupFilter = function(f) { _groupCurrentFilter = f; renderGroupOrdersList(); };
window.toggleGroupOrder = function(id, checked) {
  if (checked && isOrderLockedByGroup(id, document.getElementById('groupId').value)) { toast('الطلب محجوز في مجموعة أخرى', 'error'); renderGroupOrdersList(); return; }

window.openGroupModal = function () {

window.editGroup = function (id) {
  if (!hasPerm('manageGroups')) { toast(MSG.unauthorized, 'error'); return; }
  const g = cache.groups.find(x => x.id === id); if (!g) return;
  clearAllErrors('groupModal');
  document.getElementById('groupModalTitle').innerHTML = ico('edit', 20) + '<span>تعديل مجموعة</span>';
  document.getElementById('groupId').value = id;
  document.getElementById('groupName').value = g.name || '';
  document.getElementById('groupDepartureTime').value = g.departureTime || '';
  document.getElementById('groupNotes').value = g.notes || '';
  _groupSelectedOrders = new Set(g.orderIds || []);
  _groupCurrentFilter = 'all';
  populateBranchSelects();
  document.getElementById('groupDriver').value = g.driver || '';
  renderGroupOrdersList();
  openModal('groupModal');
};
window.saveGroup = async function () {
  const id = document.getElementById('groupId').value;
  if (id ? !hasPerm('manageGroups') : !hasPerm('createGroup')) { toast(MSG.unauthorized, 'error'); return; }
  clearAllErrors('groupModal');
  const name = document.getElementById('groupName').value.trim();
  if (!name) { setFieldError('groupName', 'اسم المجموعة مطلوب'); focusFirstError('groupModal'); return; }
  if (cache.groups.some(g => g.name === name && g.id !== id)) { setFieldError('groupName', 'الاسم مستخدم مسبقاً'); focusFirstError('groupModal'); return; }
  const driver = document.getElementById('groupDriver').value;
  const driverData = (cache.drivers || []).find(d => d.name === driver);
  const driverPhone = driverData?.phone || '';
  const departureTime = document.getElementById('groupDepartureTime').value;
  const notes = document.getElementById('groupNotes').value.trim();
  const orderIds = Array.from(_groupSelectedOrders);
  if (!orderIds.length) { toast('اختر طلباً واحداً على الأقل', 'warning'); return; }
  for (const oid of orderIds) {
    if (isOrderLockedByGroup(oid, id)) {
      const other = getOrderGroup(oid);
      toast(`الطلب موجود في مجموعة "${other?.name || '?'}" — لا يمكن إضافته لمجموعة أخرى`, 'error');
      return;
    }
  }
  const existing = id ? cache.groups.find(g => g.id === id) : null;
  const groupData = {
    id: id || uid(), name, driver, driverPhone, departureTime, notes, orderIds,
    status: existing?.status || 'نشطة',
    createdAt: existing?.createdAt || fmtDate(),
    createdBy: existing?.createdBy || currentUser.username,
    updatedAt: fmtDate(), updatedBy: currentUser.username,
    archivedAt: existing?.archivedAt || null, archivedBy: existing?.archivedBy || null
  };
  if (id) { const idx = cache.groups.findIndex(g => g.id === id); if (idx > -1) cache.groups[idx] = groupData; logActivity('edit-group', `تعديل مجموعة: ${name}`, '', 'warning'); }
  else { cache.groups.push(groupData); logActivity('add-group', `إضافة مجموعة: ${name}`, `${orderIds.length} طلب`, 'success'); }
  try {
    await persistKeys(['groups', 'activity']);
    closeModal('groupModal');
    renderGroups(); renderReady();
    toast(id ? 'تم التعديل بنجاح' : 'تم الإضافة بنجاح', 'success');
    if (!id) addNotification('مجموعة جديدة', `${name} — ${orderIds.length} طلب`, 'success', true);
  } catch (e) { toast(e.message, 'error'); }
};
window.deleteGroup = async function (id) {
  if (!hasPerm('deleteGroup')) { toast(MSG.unauthorized, 'error'); return; }
  const g = cache.groups.find(x => x.id === id); if (!g) return;
  const isArchived = g.status === 'مؤرشفة';
  const warning = isArchived ? `حذف المجموعة المؤرشفة "${g.name}"؟` : `حذف المجموعة "${g.name}"؟ (ستعود طلباتها متاحة)`;
  const ok = await dialog.danger(warning); if (!ok) return;
  cache.groups = cache.groups.filter(x => x.id !== id);
  logActivity('delete-group', `حذف مجموعة: ${g.name}`, '', 'danger');
  try { await persistKeys(['groups', 'activity']); renderGroups(); renderReady(); toast('تم الحذف بنجاح', 'success'); }
  catch (e) { toast(e.message, 'error'); }
};
window.transferGroupToLog = async function(groupId) {
  if (!hasPerm('moveToLog')) { toast(MSG.unauthorized, 'error'); return; }
  const g = cache.groups.find(x => x.id === groupId); if (!g) { toast('المجموعة غير موجودة', 'error'); return; }
  if (g.status === 'مؤرشفة') { toast('المجموعة مؤرشفة مسبقاً', 'warning'); return; }
  const orders = getGroupOrders(groupId).filter(o => cache.ready.some(r => r.id === o.id));
  if (!orders.length) { toast('لا توجد طلبات جاهزة في هذه المجموعة', 'warning'); return; }
  const ok = await dialog.confirm(`سيتم ترحيل ${orders.length} طلب من مجموعة "${g.name}" إلى السجل.`, { title: 'ترحيل المجموعة للسجل', okText: 'نعم، رحّل', okClass: 'btn-purple' });
  if (!ok) return;
  UndoRedo.beginBatch(`ترحيل مجموعة: ${g.name}`);
  const backup = { ready: [...cache.ready], log: [...cache.log], groups: JSON.parse(JSON.stringify(cache.groups)) };
  try {
    const now = fmtDate(); const user = currentUser.username;
    const idsToMove = new Set(orders.map(o => o.id));
    orders.forEach(o => { cache.log.push({ ...o, archivedAt: now, archivedBy: user, receiptStatus: o.receiptStatus || RECEIPT_NOT_RECEIVED, groupId: g.id, groupName: g.name }); });
    cache.ready = cache.ready.filter(o => !idsToMove.has(o.id));
    const gi = cache.groups.findIndex(x => x.id === groupId);
    if (gi > -1) { cache.groups[gi].status = 'مؤرشفة'; cache.groups[gi].archivedAt = now; cache.groups[gi].archivedBy = user; }
    logActivity('move-group-log', `ترحيل مجموعة: ${g.name}`, `${orders.length} طلب إلى السجل`, 'success');
    await persistKeys(['ready', 'log', 'groups', 'activity']);
    UndoRedo.commitBatch();
    renderGroups(); renderReady(); renderDashboard();
    addNotification('ترحيل مجموعة', `${g.name} — ${orders.length} طلب`, 'success', true);
    toast(`✅ تم ترحيل ${orders.length} طلب من المجموعة`, 'success');
  } catch (e) {
    cache.ready = backup.ready; cache.log = backup.log; cache.groups = backup.groups;
    UndoRedo.cancelBatch();
    toast(e.message, 'error');
  }
};

/* ══════════════════════════════════════════════════════════════
   RENDER: TASKS
   ══════════════════════════════════════════════════════════════ */
function renderTasks() {
  const container = document.getElementById('tasksContainer'); if (!container) return;
  let tasks = cache.tasks || [];
  const statusFilter = document.getElementById('tasksStatusFilter')?.value || '';
  const priorityFilter = document.getElementById('tasksPriorityFilter')?.value || '';
  if (statusFilter) tasks = tasks.filter(t => t.status === statusFilter);
  if (priorityFilter) tasks = tasks.filter(t => t.priority === priorityFilter);
  document.getElementById('tasksCount').textContent = `الإجمالي: ${tasks.length}`;
  if (!tasks.length) { container.innerHTML = `<div class="empty-state"><div class="icon">${ico('check', 26)}</div><div class="title">لا توجد مهام</div><div class="desc">ابدأ بإضافة مهمة جديدة</div></div>`; return; }
  tasks.sort((a, b) => {
    const order = { 'عالية': 0, 'عادية': 1, 'منخفضة': 2 };
    const statusOrder = { 'معلقة': 0, 'قيد التنفيذ': 1, 'مكتملة': 2, 'ملغاة': 3 };
    const so = (statusOrder[a.status] || 0) - (statusOrder[b.status] || 0);
    if (so !== 0) return so;
    return (order[a.priority] || 1) - (order[b.priority] || 1);
  });
  container.innerHTML = tasks.map(t => {
    const isCompleted = t.status === 'مكتملة';
    const priorityClass = t.priority === 'عالية' ? 'high' : t.priority === 'منخفضة' ? 'low' : 'medium';
    const canEdit = hasPerm('editTask'); const canDelete = hasPerm('deleteTask'); const canComplete = hasPerm('completeTask');
    const statusBadgeClass = isCompleted ? 'badge-ready' : t.status === 'ملغاة' ? 'badge-unpaid' : t.status === 'قيد التنفيذ' ? 'badge-progress' : 'badge-branch';
    return `<div class="task-card ${priorityClass}${isCompleted ? ' completed' : ''}">
      <div class="task-title">${esc(t.title)}</div>
      ${t.description ? `<div class="task-desc">${esc(t.description)}</div>` : ''}
      <div class="task-meta">
        ${t.assignee ? `<span>${ico('user', 11)} ${esc(t.assignee)}</span>` : ''}
        <span>${ico('zap', 11)} ${esc(t.priority)}</span>
        <span class="badge ${statusBadgeClass}" style="font-size:10px;padding:2px 7px;">${ico('check', 10)} ${esc(t.status)}</span>
        ${t.dueDate ? `<span>${ico('clock', 11)} استحقاق: ${esc(t.dueDate)}</span>` : ''}
        <span>${ico('user', 11)} أنشأها: ${esc(t.createdBy || '—')}</span>
      </div>
      ${isCompleted ? `<div style="margin-top:8px;padding:8px 12px;background:linear-gradient(135deg,rgba(12,185,123,.08),rgba(12,185,123,.03));border-right:3px solid var(--success-500);border-radius:var(--radius-sm);display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;">
        <span style="color:var(--success-700);display:inline-flex;align-items:center;gap:5px;font-weight:700;">${ico('check', 13)} <span>أكملها</span></span>
        <b style="color:var(--text);">${esc(t.completedBy || 'غير معروف')}</b>
        ${t.completedAt ? `<span style="color:var(--text-muted);margin-right:auto;">${ico('clock', 11)} ${esc(t.completedAt)}</span>` : ''}
      </div>` : ''}
      <div class="task-actions" style="margin-top:8px;">
        ${!isCompleted && canComplete ? `<button class="btn btn-success btn-sm" onclick="completeTask('${t.id}')">${ico('check', 12)}<span>إكمال</span></button>` : ''}
        ${canEdit ? `<button class="btn btn-primary btn-sm" onclick="editTask('${t.id}')">${ico('edit', 12)}<span>تعديل</span></button>` : ''}
        ${canDelete ? `<button class="btn btn-danger btn-sm" onclick="deleteTask('${t.id}')">${ico('trash', 12)}<span>حذف</span></button>` : ''}
      </div>
    </div>`;
  }).join('');
}

window.editTask = function (id) {

  document.getElementById('taskId').value = id;
  document.getElementById('taskTitle').value = t.title || '';

  document.getElementById('taskDueDate').value = t.dueDate || '';
  document.getElementById('taskStatus').value = t.status || 'معلقة';

window.saveTask = async function () {
  const id = document.getElementById('taskId').value;
  if (id ? !hasPerm('editTask') : !hasPerm('createTask')) { toast(MSG.unauthorized, 'error'); return; }
  clearAllErrors('taskModal');
  const title = document.getElementById('taskTitle').value.trim();
  if (!title) { setFieldError('taskTitle', 'عنوان المهمة مطلوب'); focusFirstError('taskModal'); return; }
  const description = document.getElementById('taskDescription').value.trim();
  const assignee = document.getElementById('taskAssignee').value;
  const priority = document.getElementById('taskPriority').value;
  const dueDate = document.getElementById('taskDueDate').value;
  const status = document.getElementById('taskStatus').value;
  const existing = id ? cache.tasks.find(t => t.id === id) : null;
  const taskData = {
    id: id || uid(), title, description, assignee, priority, dueDate, status,
    createdAt: existing?.createdAt || fmtDate(),
    createdBy: existing?.createdBy || currentUser.username,
    completedAt: existing?.completedAt || null,
    completedBy: existing?.completedBy || null
  };
  if (status === 'مكتملة' && !taskData.completedAt) { taskData.completedAt = fmtDate(); taskData.completedBy = currentUser.username; }
  if (status !== 'مكتملة') { taskData.completedAt = null; taskData.completedBy = null; }
  if (id) { const idx = cache.tasks.findIndex(t => t.id === id); if (idx > -1) cache.tasks[idx] = taskData; logActivity('edit-task', `تعديل مهمة: ${title}`, '', 'warning'); }
  else { cache.tasks.push(taskData); logActivity('add-task', `إضافة مهمة: ${title}`, `تعيين: ${assignee || 'بدون'}`, 'success'); }
  try {
    await persistKeys(['tasks', 'activity']);
    closeModal('taskModal');
    renderTasks();
    if (assignee && !id) addNotification('مهمة جديدة', `${title} — كُلفت إلى ${assignee}`, 'info', true);
    toast(id ? 'تم التعديل بنجاح' : 'تم الإضافة بنجاح', 'success');
  } catch (e) { toast(e.message, 'error'); }
};
window.completeTask = async function (id) {
  if (!hasPerm('completeTask')) { toast(MSG.unauthorized, 'error'); return; }
  const t = cache.tasks.find(x => x.id === id); if (!t) return;
  const ok = await dialog.confirm(`إكمال المهمة "${t.title}"؟`, { type: 'success', okText: 'نعم، اكتملت' });
  if (!ok) return;
  t.status = 'مكتملة'; t.completedAt = fmtDate(); t.completedBy = currentUser.username;
  logActivity('complete-task', `إكمال مهمة: ${t.title}`, `بواسطة: ${currentUser.username}`, 'success');
  try { await persistKeys(['tasks', 'activity']); renderTasks(); addNotification('إكمال مهمة', `${t.title} — ${currentUser.username}`, 'success', true); toast('✅ تم إكمال المهمة', 'success'); }
  catch (e) { toast(e.message, 'error'); }
};
window.deleteTask = async function (id) {
  if (!hasPerm('deleteTask')) { toast(MSG.unauthorized, 'error'); return; }
  const t = cache.tasks.find(x => x.id === id); if (!t) return;
  const ok = await dialog.danger(`حذف المهمة "${t.title}"؟`); if (!ok) return;
  cache.tasks = cache.tasks.filter(x => x.id !== id);
  logActivity('delete-task', `حذف مهمة: ${t.title}`, '', 'danger');
  try { await persistKeys(['tasks', 'activity']); renderTasks(); toast('تم الحذف بنجاح', 'success'); }
  catch (e) { toast(e.message, 'error'); }
};

function renderCustomFieldsList() {

}
function renderCustomFieldsInOrder(orderData = null) {
  const container = document.getElementById('customFieldsInOrder'); if (!container) return;
  if (!isFeatureEnabled('featureCustomFields') || !hasPerm('useCustomFields')) { container.innerHTML = ''; return; }
  const fields = (cache.customFields || []).filter(f => f);
  if (!fields.length) { container.innerHTML = ''; return; }
  container.innerHTML = `<div style="margin-top:14px;padding-top:14px;border-top:1px dashed var(--border);"><div style="font-size:12.5px;font-weight:700;color:var(--brand-700);margin-bottom:10px;display:flex;align-items:center;gap:6px;">${ico('grid', 14)}<span>حقول إضافية</span></div>${fields.map(f => renderCustomFieldInput(f, orderData)).join('')}</div>`;
}
function renderCustomFieldInput(field, orderData) {
  const val = orderData?.customData?.[field.key] || '';
  const req = field.required ? 'field-required' : '';
  const errId = `err-cf-${field.key}`;
  switch (field.type) {
    case 'number': return `<label class="${req}">${esc(field.label)}</label><input type="number" id="cf_${esc(field.key)}" value="${esc(val)}" autocomplete="off"><div class="field-error-msg" id="${errId}"></div>`;
    case 'date': return `<label class="${req}">${esc(field.label)}</label><input type="date" id="cf_${esc(field.key)}" value="${esc(val)}"><div class="field-error-msg" id="${errId}"></div>`;
    case 'select': return `<label class="${req}">${esc(field.label)}</label><select id="cf_${esc(field.key)}"><option value="">— اختر —</option>${(field.options || []).map(o => `<option value="${esc(o)}" ${val === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select><div class="field-error-msg" id="${errId}"></div>`;
    case 'textarea': return `<label class="${req}">${esc(field.label)}</label><textarea id="cf_${esc(field.key)}" rows="3" placeholder="${esc(field.label)}...">${esc(val)}</textarea><div class="field-error-msg" id="${errId}"></div>`;
    default: return `<label class="${req}">${esc(field.label)}</label><input type="text" id="cf_${esc(field.key)}" value="${esc(val)}" autocomplete="off"><div class="field-error-msg" id="${errId}"></div>`;
  }
}
function collectCustomFields() {
  if (!isFeatureEnabled('featureCustomFields') || !hasPerm('useCustomFields')) return {};
  const data = {};
  (cache.customFields || []).forEach(f => { const el = document.getElementById('cf_' + f.key); if (el) data[f.key] = el.value.trim(); });
  return data;
}
function validateCustomFields() {
  if (!isFeatureEnabled('featureCustomFields') || !hasPerm('useCustomFields')) return true;
  let valid = true;
  (cache.customFields || []).forEach(f => {
    const el = document.getElementById('cf_' + f.key); if (!el) return;
    if (f.required && !el.value.trim()) { el.classList.add('field-error'); const err = document.getElementById('err-cf-' + f.key); if (err) { err.textContent = 'هذا الحقل مطلوب'; err.classList.add('show'); } valid = false; }
    else { el.classList.remove('field-error'); const err = document.getElementById('err-cf-' + f.key); if (err) { err.textContent = ''; err.classList.remove('show'); } }
  });
  return valid;
}
window.openCustomFieldModal = function () {

async function resizeImage(file, maxWidth = 1400) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const ratio = Math.min(1, maxWidth / img.width);
        canvas.width = Math.round(img.width * ratio); canvas.height = Math.round(img.height * ratio);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = reject; img.src = e.target.result;
    };
    reader.onerror = reject; reader.readAsDataURL(file);
  });
}

function initCustomerSearch() {
  const input = document.getElementById('orderCustomer');
  const dropdown = document.getElementById('customerDropdown');
  if (!input || !dropdown) return;
  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    document.getElementById('orderCustomerId').value = '';
    document.getElementById('orderCustomerPhone').value = '';
    clearFieldError('orderCustomer');
    if (!q) { dropdown.classList.remove('show'); return; }
    const matches = cache.customers.filter(c => smartSearch(`${c.code} ${c.name} ${c.phone} ${c.location}`, q)).slice(0, 8);
    let html = matches.length ? matches.map(c => `<div class="customer-option" data-id="${c.id}" data-name="${esc(c.name)}" data-loc="${esc(c.location)}" data-phone="${esc(c.phone || '')}"><span class="loc">${esc(c.location)}</span><b>${esc(c.name)}</b> <span class="code">${esc(c.code || '')}</span></div>`).join('') : '';
    const exact = cache.customers.some(c => c.name.toLowerCase() === q);
    if (!exact && q.length >= 2) html += `<div class="customer-option create" data-create="1">إنشاء عميل جديد: "${esc(input.value)}"</div>`;
    if (!html) html = '<div class="customer-option empty">لا توجد نتائج</div>';
    dropdown.innerHTML = html; dropdown.classList.add('show');
    dropdown.querySelectorAll('.customer-option').forEach(opt => {
      opt.addEventListener('mousedown', e => {
        e.preventDefault();
        if (opt.dataset.create) {
          document.getElementById('custName').value = input.value.trim();
          document.getElementById('custId').value = '';
          document.getElementById('custModalTitle').innerHTML = ico('user', 20) + '<span>عميل جديد</span>';
          ['custCode','custLocation','custPhone'].forEach(id => document.getElementById(id).value = '');
          clearAllErrors('customerModal');
          openModal('customerModal');
          setTimeout(() => document.getElementById('custCode').focus(), 100);
          dropdown.classList.remove('show');
        } else {
          document.getElementById('orderCustomerId').value = opt.dataset.id;
          input.value = opt.dataset.name;
          document.getElementById('orderCustomerPhone').value = opt.dataset.phone || '';
          document.getElementById('orderLocation').value = opt.dataset.loc || '';
          dropdown.classList.remove('show');
          setTimeout(() => updateDriverSuggestion(), 300);
        }
      });
    });
  });
  input.addEventListener('focus', () => { if (input.value.trim()) input.dispatchEvent(new Event('input')); });
  input.addEventListener('blur', () => setTimeout(() => dropdown.classList.remove('show'), 150));
}
function initLocationSuggestion() {

function validateOrderForm() {
  clearAllErrors('orderModal');
  let valid = true;
  const invoice = document.getElementById('orderInvoice').value.trim();
  const customer = document.getElementById('orderCustomer').value.trim();
  const customerId = document.getElementById('orderCustomerId').value;
  const branch = document.getElementById('orderBranch').value;
  const id = document.getElementById('orderId').value;
  const isLogEdit = document.getElementById('orderLogMode').value === '1';
  if (!invoice) { setFieldError('orderInvoice', 'رقم الفاتورة مطلوب'); valid = false; }
  else {
    const excludeType = isLogEdit ? 'log' : (id ? 'orders' : null);
    if (isInvoiceDuplicate(invoice, id, excludeType)) { setFieldError('orderInvoice', MSG.invoiceDup); valid = false; }
  }
  if (!branch) { setFieldError('orderBranch', 'الفرع مطلوب'); valid = false; }
  if (!customer) { setFieldError('orderCustomer', 'العميل مطلوب'); valid = false; }
  else {
    let matched = customerId ? cache.customers.find(c => c.id === customerId) : null;
    if (!matched) matched = cache.customers.find(c => c.name.toLowerCase() === customer.toLowerCase());
    if (!matched) { setFieldError('orderCustomer', 'اختر عميلاً من القائمة'); valid = false; }
    else {
      document.getElementById('orderCustomerId').value = matched.id;
      document.getElementById('orderCustomer').value = matched.name;
      document.getElementById('orderCustomerPhone').value = matched.phone || '';
      if (!document.getElementById('orderLocation').value.trim() && matched.location) document.getElementById('orderLocation').value = matched.location;
    }
  }
  if (!validateCustomFields()) valid = false;
  if (!valid) { focusFirstError('orderModal'); toast('يرجى تعبئة الحقول المطلوبة', 'error'); }
  return valid;
}

  const isLogEdit = document.getElementById('orderLogMode').value === '1';

window.changeReceiptStatus = async function (id, newStatus) {
  const o = cache.log.find(x => x.id === id); if (!o) { renderLog(); return; }
  const current = o.receiptStatus || RECEIPT_NOT_RECEIVED;
  const isOwner = currentUser?.role === ROLE_OWNER;
  const canRevert = hasPerm('revertReceiptStatus');
  if (current === newStatus) { renderLog(); return; }
  if (current === RECEIPT_RECEIVED && !isOwner && !canRevert) { toast('لا يمكن التراجع', 'error'); renderLog(); return; }
  if (newStatus === RECEIPT_RECEIVED && !isOwner && !hasPerm('editReceiptStatus')) { toast(MSG.unauthorized, 'error'); renderLog(); return; }
  if (newStatus === RECEIPT_RECEIVED) { const ok = await dialog.confirm(`هل تم استلام الطلب "${o.invoice}"؟`, { title: 'تأكيد الاستلام', okText: 'نعم، تم الاستلام', type: 'success', okClass: 'btn-success' }); if (!ok) { renderLog(); return; } }
  if (newStatus === RECEIPT_NOT_RECEIVED && current === RECEIPT_RECEIVED) { const ok = await dialog.confirm(`إلغاء تأكيد استلام "${o.invoice}"؟`, { title: 'إلغاء الاستلام', okText: 'نعم', type: 'warning', okClass: 'btn-warning' }); if (!ok) { renderLog(); return; } }
  const previous = current; const previousAt = o.receiptUpdatedAt; const previousBy = o.receiptUpdatedBy;
  o.receiptStatus = newStatus; o.receiptUpdatedAt = fmtDate(); o.receiptUpdatedBy = currentUser.username;
  logActivity('receipt-status', newStatus === RECEIPT_RECEIVED ? `تأكيد استلام: ${o.invoice}` : `إلغاء استلام: ${o.invoice}`, `العميل: ${o.customer}`, newStatus === RECEIPT_RECEIVED ? 'success' : 'warning');
  try {
    await persistKeys(['log', 'activity']);
    renderLog();
    addNotification(newStatus === RECEIPT_RECEIVED ? 'تأكيد استلام' : 'إلغاء استلام', `${o.invoice} — ${o.customer}`, newStatus === RECEIPT_RECEIVED ? 'success' : 'warning', true);
    toast(newStatus === RECEIPT_RECEIVED ? '✅ تم تأكيد الاستلام' : 'تم إلغاء الاستلام', newStatus === RECEIPT_RECEIVED ? 'success' : 'warning');
    if (newStatus === RECEIPT_RECEIVED) setTimeout(() => triggerWhatsAppNotification(o), 400);
  } catch (e) { o.receiptStatus = previous; o.receiptUpdatedAt = previousAt; o.receiptUpdatedBy = previousBy; toast(e.message, 'error'); renderLog(); }
};

   ══════════════════════════════════════════════════════════════ */
function buildWhatsAppMessage(order) {
  const tpl = (templates.whatsapp?.message) || DEFAULT_TEMPLATES.whatsapp.message;
  return tpl.replace(/{customer}/g, order.customer || '').replace(/{invoice}/g, order.invoice || '').replace(/{driver}/g, order.driver || '—').replace(/{driverPhone}/g, order.driverPhone || '—').replace(/{customerPhone}/g, order.customerPhone || '—').replace(/{date}/g, fmtDate());
}
function normalizePhoneForWhatsApp(phone) {
  if (!phone) return '';
  let p = String(phone).trim(); p = p.replace(/[^0-9]/g, '');
  if (/^7\d{8}$/.test(p)) p = '967' + p; else if (/^0\d{9}$/.test(p)) p = '967' + p.substring(1);
  return p;
}
function openBackgroundTab(url, closeAfterMs = 5000) {
  let win = null;
  try { win = window.open(url, '_blank'); } catch (_) { win = null; }
  if (!win) return null;
  try { win.blur(); } catch (_) {}
  try { window.focus(); } catch (_) {}
  if (closeAfterMs > 0) setTimeout(() => { try { win.close(); } catch (_) {} }, closeAfterMs);
  return win;
}
function openWhatsApp(phone, message) {
  phone = String(phone).replace(/[^\d]/g, '');
  const text = encodeURIComponent(message);
  const ua = navigator.userAgent;
  const isAndroid = /Android/i.test(ua);
  const isIOS = /iPhone|iPad|iPod/i.test(ua);
  const isWindows = /Windows/i.test(ua);
  if (isAndroid) { window.location.href = `intent://send?phone=${phone}&text=${text}#Intent;scheme=whatsapp;package=com.whatsapp;end`; setTimeout(() => { openBackgroundTab(`https://web.whatsapp.com/send?phone=${phone}&text=${text}`); }, 1800); return; }
  if (isIOS) { window.location.href = `whatsapp://send?phone=${phone}&text=${text}`; setTimeout(() => { openBackgroundTab(`https://web.whatsapp.com/send?phone=${phone}&text=${text}`); }, 1800); return; }
  if (isWindows) { window.location.href = `whatsapp://send?phone=${phone}&text=${text}`; setTimeout(() => { openBackgroundTab(`https://web.whatsapp.com/send?phone=${phone}&text=${text}`); }, 2000); return; }
  openBackgroundTab(`https://web.whatsapp.com/send?phone=${phone}&text=${text}`);
}
function triggerWhatsAppNotification(order) {
  if (templates.whatsapp?.enabled === false) return;
  if (!hasPerm('sendWhatsApp')) return;
  const phone = normalizePhoneForWhatsApp(order.customerPhone);
  if (!phone) { toast('لا يوجد رقم هاتف للعميل', 'warning'); return; }
  const message = buildWhatsAppMessage(order);
  logActivity('whatsapp-sent', `إرسال واتساب: ${order.invoice}`, `إلى: ${order.customer} (${order.customerPhone})`, 'success');
  openWhatsApp(phone, message);
}
window.sendWhatsAppManually = function(orderId) {
  if (!hasPerm('sendWhatsApp')) { toast(MSG.unauthorized, 'error'); return; }

window.togglePerm = function (key, checked) {

  if (key === 'manageUsers') { const tabChip = document.querySelector(`.perm-item[data-perm="tabUsers"]`); if (tabChip) { tempPerms.tabUsers = checked; const inp = tabChip.querySelector('input'); if (inp) inp.checked = checked; tabChip.classList.toggle('checked', checked); } }
  const featureMap = { undoActions: 'featureUndoRedo', useCustomFields: 'featureCustomFields', accessGroups: 'featureWorkGroups', accessTasks: 'featureTasks' };
  if (featureMap[key] && checked) { const fk = featureMap[key]; tempPerms[fk] = true; const fEl = document.querySelector(`.perm-item[data-perm="${fk}"]`); if (fEl) { const inp = fEl.querySelector('input'); if (inp) inp.checked = true; fEl.classList.add('checked'); } }

function validateUserForm() {
  clearAllErrors('userModal');

    else if (!/[a-zA-Z]/.test(password) || !/[0-9]/.test(password)) { setFieldError('userPass', 'يجب أن تحتوي على أحرف وأرقام'); valid = false; }
  } else if (password) {
    if (password.length < 6) { setFieldError('userPass', '6 أحرف على الأقل'); valid = false; }
    else if (!/[a-zA-Z]/.test(password) || !/[0-9]/.test(password)) { setFieldError('userPass', 'يجب أن تحتوي على أحرف وأرقام'); valid = false; }

window.saveUser = async function () {
  if (!hasPerm('manageUsers')) { toast(MSG.unauthorized, 'error'); return; }
  if (!validateUserForm()) return;
  const id = document.getElementById('userId').value;
  const username = document.getElementById('userName').value.trim();
  const password = document.getElementById('userPass').value;
  const role = document.getElementById('userRole').value;
  if (id) {
    const existing = cache.users.find(u => u.id === id);
    if (!existing) { toast('المستخدم غير موجود', 'error'); return; }
    if (!canManageUser(existing)) { toast('لا يمكنك تعديل هذا المستخدم', 'error'); return; }
    if (existing.role === ROLE_OWNER && role !== ROLE_OWNER) { const ownersCount = cache.users.filter(u => u.role === ROLE_OWNER).length; if (ownersCount <= 1) { toast('لا يمكن تغيير دور المالك الوحيد', 'error'); return; } }
  } else {
    const allowedRoles = getAllowedRolesToCreate();
    if (!allowedRoles.includes(role)) { toast('لا يمكنك إنشاء هذا الدور', 'error'); return; }
  }
  let permissions = {};
  if (role === ROLE_OWNER) { permissions = {}; }
  else {
    const grantable = getGrantablePerms(role);
    grantable.forEach(k => { permissions[k] = tempPerms[k] === true; });
    if (currentUser.role === ROLE_MANAGER) { const ownPerms = ALL_PERM_KEYS.filter(k => currentUser.permissions?.[k] === true); Object.keys(permissions).forEach(k => { if (!ownPerms.includes(k)) permissions[k] = false; }); }
    if (permissions.manageUsers) permissions.tabUsers = true;
  }
  const existingUser = id ? cache.users.find(u => u.id === id) : null;
  let passwordFields = {};
  try {
    if (!id) { const h = await Crypto.hashPassword(password); passwordFields = h; }
    else if (existingUser) {
      if (!password) {
        if (existingUser.passwordHash) passwordFields = { passwordHash: existingUser.passwordHash, passwordSalt: existingUser.passwordSalt, passwordAlgo: existingUser.passwordAlgo };
        else passwordFields = { password: existingUser.password };
      } else { const h = await Crypto.hashPassword(password); passwordFields = h; }
    }
  } catch (e) { toast('تعذر تشفير كلمة المرور', 'error'); return; }
  const userData = { id: id || uid(), username, role, permissions, ...passwordFields };
  if (id) { const idx = cache.users.findIndex(u => u.id === id); if (idx > -1) cache.users[idx] = userData; logActivity('edit-user', `تعديل: ${username}`, `الدور: ${role}`, 'warning'); }
  else { cache.users.push(userData); logActivity('add-user', `إضافة: ${username}`, `الدور: ${role}`, 'success'); }
  try {
    await persistKeys(['users', 'activity']);
    if (currentUser.username === username) { currentUser = normalizeUser(userData); applyPermissionsUI(); }
    closeModal('userModal'); renderUsers();
    toast(id ? 'تم التعديل بنجاح' : 'تم الإضافة بنجاح', 'success');
  } catch (e) { toast(e.message, 'error'); }
};

async function ensureJSZip() {
  if (typeof JSZip !== 'undefined') return true;
  return new Promise((resolve) => {
    const existing = document.querySelector('script[data-jszip-loader]');
    if (existing) { existing.addEventListener('load', () => resolve(typeof JSZip !== 'undefined')); existing.addEventListener('error', () => resolve(false)); return; }
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    script.setAttribute('data-jszip-loader', '1');
    script.onload = () => resolve(typeof JSZip !== 'undefined');
    script.onerror = () => resolve(false);
    document.head.appendChild(script);
  });
}

  else if (!e.shiftKey) { const mid = modal.parentElement.id; if (mid === 'orderModal') saveOrder(); else if (mid === 'customerModal') saveCustomer(); else if (mid === 'userModal') saveUser(); else if (mid === 'keyModal') saveNewKey(); else if (mid === 'customFieldModal') saveCustomField(); else if (mid === 'taskModal') saveTask(); else if (mid === 'groupModal') saveGroup(); }
