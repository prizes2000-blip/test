<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
*:not(input):not(textarea):not(select){-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
img{-webkit-user-drag:none;pointer-events:none}
html,body{height:100%}
:root{
  --brand-50:#eef4ff;--brand-100:#dce7ff;--brand-200:#bfd4ff;--brand-300:#93b4fe;--brand-400:#6890fa;
  --brand-500:#4266e8;--brand-600:#2d4cd9;--brand-700:#233cb8;--brand-800:#1d3193;--brand-900:#1a2870;--brand-950:#0f1747;
  --success-50:#e7fdf3;--success-100:#c5f8e0;--success-500:#0cb97b;--success-600:#069463;--success-700:#047850;
  --warning-50:#fff7e0;--warning-100:#ffecb8;--warning-500:#f5a318;--warning-600:#d97d07;--warning-700:#b15906;
  --danger-50:#ffeff1;--danger-100:#ffd9dd;--danger-500:#ef3d52;--danger-600:#d7263d;--danger-700:#b8182d;
  --violet-50:#f2edfe;--violet-100:#e4d9fd;--violet-500:#8b5cf6;--violet-600:#7c3aed;--violet-700:#6d28d9;
  --teal-50:#e8fdfa;--teal-100:#c4faf2;--teal-500:#14b8a6;--teal-600:#0d9488;--teal-700:#0f766e;
  --orange-50:#fff2e6;--orange-100:#ffddb8;--orange-500:#f97316;--orange-600:#ea580c;
  --pink-50:#fdeef6;--pink-100:#fbd5e7;--pink-500:#ec4899;--pink-600:#db2777;
  --whatsapp-500:#25d366;--whatsapp-600:#128c7e;--whatsapp-700:#075e54;
  --gold-1:#ffd66b;--gold-2:#f0a824;--gold-3:#b8760b;
  --silver-1:#eef2f7;--silver-2:#b9c3d1;--silver-3:#7a8899;
  --bronze-1:#e8a06a;--bronze-2:#b76b32;--bronze-3:#7a3f16;
  --slate-50:#f8fafc;--slate-100:#f1f5f9;--slate-200:#e5e9f0;--slate-300:#cbd5e1;--slate-400:#94a3b8;
  --slate-500:#64748b;--slate-600:#475569;--slate-700:#334155;--slate-800:#1e293b;--slate-900:#0f172a;--slate-950:#020617;
  --bg:#eef3fd;--bg-elevated:#ffffff;--card-bg:#ffffff;--card-border:#e3eaf8;
  --text:#0c1526;--text-secondary:#2e3d57;--text-muted:#66748f;--text-inverse:#ffffff;
  --border:#e3eaf8;--border-strong:#c3d0e8;--divider:#eef2fb;
  --hover-bg:rgba(66,102,232,.07);--active-bg:rgba(66,102,232,.12);--focus-ring:rgba(66,102,232,.22);
  --primary:var(--brand-600);--primary-hover:var(--brand-700);--primary-dark:var(--brand-800);
  --shadow-xs:0 1px 2px rgba(31,58,123,.05);
  --shadow-sm:0 2px 5px rgba(31,58,123,.07),0 1px 2px rgba(31,58,123,.04);
  --shadow-md:0 6px 18px rgba(31,58,123,.09),0 2px 6px rgba(31,58,123,.05);
  --shadow-lg:0 16px 40px rgba(31,58,123,.13),0 4px 14px rgba(31,58,123,.07);
  --shadow-xl:0 28px 60px rgba(31,58,123,.17),0 10px 22px rgba(31,58,123,.09);
  --shadow-inset:inset 0 1px 0 rgba(255,255,255,.22);
  --btn-h:38px;--radius-xs:6px;--radius-sm:8px;--radius-md:10px;--radius-lg:14px;--radius-xl:18px;
  --transition:.18s cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"]{
  --bg:#070b15;--bg-elevated:#0d1422;--card-bg:#111a2c;--card-border:#1c2840;
  --text:#eaf0fb;--text-secondary:#b6c3da;--text-muted:#7c8ba6;--text-inverse:#070b15;
  --border:#1c2840;--border-strong:#2b3a55;--divider:#16202f;
  --hover-bg:rgba(104,144,250,.08);--active-bg:rgba(104,144,250,.14);--focus-ring:rgba(104,144,250,.28);
  --primary:var(--brand-500);--primary-hover:var(--brand-400);--primary-dark:var(--brand-600);
  --success-50:rgba(12,185,123,.14);--warning-50:rgba(245,163,24,.14);--danger-50:rgba(239,61,82,.14);
  --violet-50:rgba(124,58,237,.15);--teal-50:rgba(20,184,166,.14);--orange-50:rgba(234,88,12,.14);
  --pink-50:rgba(236,72,153,.14);--brand-50:rgba(104,144,250,.12);--brand-100:rgba(104,144,250,.2);
  --shadow-xs:0 1px 2px rgba(0,0,0,.5);
  --shadow-sm:0 2px 5px rgba(0,0,0,.55),0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 6px 18px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.35);
  --shadow-lg:0 16px 40px rgba(0,0,0,.6),0 4px 14px rgba(0,0,0,.4);
  --shadow-xl:0 28px 60px rgba(0,0,0,.7),0 10px 22px rgba(0,0,0,.45);
  --shadow-inset:inset 0 1px 0 rgba(255,255,255,.08);
}
body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Tahoma,Arial,sans-serif;font-size:14px;line-height:1.5;transition:background .3s ease,color .3s ease;-webkit-font-smoothing:antialiased}
[data-theme="light"] body{background:radial-gradient(circle at 0% 0%,rgba(66,102,232,.06),transparent 45%),radial-gradient(circle at 100% 100%,rgba(139,92,246,.05),transparent 45%),var(--bg);background-attachment:fixed}
.ico{display:inline-block;flex-shrink:0;vertical-align:middle;pointer-events:none;outline:none}
.btn{height:var(--btn-h);padding:0 16px;border:none;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-weight:600;transition:var(--transition);display:inline-flex;align-items:center;justify-content:center;gap:7px;letter-spacing:.2px;white-space:nowrap;flex-wrap:nowrap;font-family:inherit;line-height:1;text-decoration:none;position:relative;overflow:hidden}
.btn>*{display:inline-flex;align-items:center;line-height:1}
.btn .ico{width:15px;height:15px}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(0)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--brand-500);outline-offset:2px}
.btn-primary{background:linear-gradient(180deg,#6890fa 0%,#4266e8 55%,#2d4cd9 100%);color:#fff;box-shadow:0 1px 3px rgba(29,49,147,.35),var(--shadow-inset)}
.btn-primary:hover:not(:disabled){background:linear-gradient(180deg,#93b4fe 0%,#6890fa 55%,#4266e8 100%);box-shadow:0 8px 22px rgba(66,102,232,.45),var(--shadow-inset)}
[data-theme="dark"] .btn-primary{background:linear-gradient(180deg,#4266e8 0%,#2d4cd9 100%)}
[data-theme="dark"] .btn-primary:hover:not(:disabled){background:linear-gradient(180deg,#6890fa 0%,#4266e8 100%);box-shadow:0 8px 22px rgba(104,144,250,.5)}
.btn-success{background:linear-gradient(180deg,#22d693 0%,#0cb97b 50%,#069463 100%);color:#fff;box-shadow:0 1px 3px rgba(4,120,80,.35),var(--shadow-inset)}
.btn-success:hover:not(:disabled){background:linear-gradient(180deg,#4be0a8 0%,#22d693 50%,#0cb97b 100%);box-shadow:0 8px 22px rgba(12,185,123,.45),var(--shadow-inset)}
.btn-warning{background:linear-gradient(180deg,#fbc23c 0%,#f5a318 55%,#d97d07 100%);color:#4a2b00;box-shadow:0 1px 3px rgba(180,89,6,.3),inset 0 1px 0 rgba(255,255,255,.4);font-weight:700}
.btn-warning:hover:not(:disabled){background:linear-gradient(180deg,#ffd66b 0%,#fbc23c 55%,#f5a318 100%);box-shadow:0 8px 22px rgba(217,125,7,.45),inset 0 1px 0 rgba(255,255,255,.5)}
.btn-danger{background:linear-gradient(180deg,#f9717f 0%,#ef3d52 50%,#d7263d 100%);color:#fff;box-shadow:0 1px 3px rgba(184,24,45,.35),var(--shadow-inset)}
.btn-danger:hover:not(:disabled){background:linear-gradient(180deg,#ffa4ad 0%,#f9717f 50%,#ef3d52 100%);box-shadow:0 8px 22px rgba(215,38,61,.45),var(--shadow-inset)}
.btn-purple{background:linear-gradient(180deg,#a78bfa 0%,#8b5cf6 50%,#7c3aed 100%);color:#fff;box-shadow:0 1px 3px rgba(109,40,217,.35),var(--shadow-inset)}
.btn-purple:hover:not(:disabled){background:linear-gradient(180deg,#c4b5fd 0%,#a78bfa 50%,#8b5cf6 100%);box-shadow:0 8px 22px rgba(124,58,237,.45),var(--shadow-inset)}
.btn-gray{background:linear-gradient(180deg,#94a3b8 0%,#64748b 55%,#475569 100%);color:#fff;box-shadow:0 1px 3px rgba(51,65,85,.3),var(--shadow-inset)}
.btn-gray:hover:not(:disabled){background:linear-gradient(180deg,#cbd5e1 0%,#94a3b8 55%,#64748b 100%);box-shadow:0 8px 22px rgba(71,85,105,.35),var(--shadow-inset)}
.btn-ghost{background:var(--card-bg);color:var(--text-secondary);border:1.5px solid var(--border);box-shadow:var(--shadow-xs)}
.btn-ghost:hover:not(:disabled){background:var(--card-bg);border-color:var(--brand-500);color:var(--brand-600);box-shadow:0 3px 12px rgba(66,102,232,.18)}
[data-theme="dark"] .btn-ghost:hover:not(:disabled){border-color:var(--brand-400);color:var(--brand-400);box-shadow:0 3px 12px rgba(104,144,250,.22)}
.btn-sm{height:30px;padding:0 10px;font-size:12px;border-radius:var(--radius-xs);min-width:30px;gap:5px}
.btn-sm .ico{width:13px;height:13px}
.btn-icon{width:var(--btn-h);height:var(--btn-h);padding:0;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.1);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:var(--transition);position:relative;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.btn-icon:hover{background:rgba(255,255,255,.26);transform:scale(1.06);border-color:rgba(255,255,255,.2)}
.btn-icon:active{transform:scale(1)}
.btn-icon:focus-visible{outline:2px solid rgba(255,255,255,.6);outline-offset:2px}
.btn-icon .ico{width:17px;height:17px}
.btn-icon .badge-num{position:absolute;top:-4px;left:-4px;background:linear-gradient(180deg,#f9717f,var(--danger-500));color:#fff;font-size:9px;font-weight:700;padding:2px 5px;border-radius:8px;min-width:16px;text-align:center;border:1.5px solid rgba(255,255,255,.9);box-shadow:0 2px 6px rgba(239,61,82,.55)}
kbd{background:rgba(15,23,42,.08);color:var(--text-secondary);padding:2px 6px;border-radius:4px;font-size:10px;font-family:'SF Mono','Consolas',monospace;font-weight:600;display:inline-block;line-height:1.3;pointer-events:none;border:1px solid rgba(15,23,42,.06)}
[data-theme="dark"] kbd{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.06);color:var(--text)}
.btn-warning kbd,.btn-primary kbd,.btn-success kbd,.btn-danger kbd,.btn-purple kbd,.btn-gray kbd{background:rgba(255,255,255,.22);color:#fff;border-color:rgba(255,255,255,.18)}
.rate-widget{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.12);padding:5px 10px;border-radius:14px;font-size:10.5px;font-weight:600;cursor:help;position:relative;min-width:135px;transition:var(--transition);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.rate-widget:hover{background:rgba(255,255,255,.2)}
.rate-widget .rate-ico{display:inline-flex;align-items:center;justify-content:center;opacity:.9}
.rate-widget .rate-bar{width:64px;height:5px;background:rgba(255,255,255,.22);border-radius:3px;overflow:hidden;flex-shrink:0;position:relative}
.rate-widget .rate-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#4be0a8,#0cb97b);transition:width .5s ease,background .5s ease;width:0%}
.rate-widget.warn .rate-fill{background:linear-gradient(90deg,#ffd66b,#f5a318)}
.rate-widget.danger .rate-fill{background:linear-gradient(90deg,#f9717f,#ef3d52);animation:pulseRed 1.5s infinite}
.rate-widget .rate-text{font-family:'SF Mono','Consolas',monospace;letter-spacing:.3px;white-space:nowrap;font-size:10px;opacity:.95;direction:ltr}
#saveQueueIndicator{display:none;align-items:center;gap:4px;padding:4px 10px;border-radius:12px;background:rgba(255,193,7,.25);border:1px solid rgba(255,193,7,.4);font-size:10.5px;font-weight:700;color:#fff;animation:pulseBlue 1s infinite}
.col-toggles{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.col-chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:20px;background:var(--bg);border:1.5px solid var(--border);cursor:pointer;font-size:11.5px;font-weight:600;transition:var(--transition);color:var(--text-muted);font-family:inherit;user-select:none;line-height:1}
.col-chip:hover{border-color:var(--brand-500);background:var(--hover-bg);color:var(--text);transform:translateY(-1px)}
.col-chip.active{background:linear-gradient(135deg,var(--success-50),rgba(12,185,123,.18));border-color:var(--success-500);color:var(--success-700);box-shadow:0 2px 8px rgba(12,185,123,.2)}
[data-theme="dark"] .col-chip{background:rgba(255,255,255,.04)}
[data-theme="dark"] .col-chip.active{background:linear-gradient(135deg,rgba(12,185,123,.18),rgba(12,185,123,.08));border-color:var(--success-500);color:#6ee7b7}
.col-chip .ico{width:12px;height:12px;opacity:.75}
.col-chip.active .ico{opacity:1}
.col-chip .col-chip-status{font-size:9px;font-weight:700;opacity:.75;padding:1.5px 6px;border-radius:6px;background:rgba(15,23,42,.06)}
[data-theme="dark"] .col-chip .col-chip-status{background:rgba(255,255,255,.08)}
.col-chip.active .col-chip-status{background:rgba(4,120,80,.2);color:var(--success-700)}
[data-theme="dark"] .col-chip.active .col-chip-status{background:rgba(110,231,183,.2);color:#6ee7b7}
.col-toggles-actions{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.col-toggles-actions button{padding:5px 11px;font-size:11px;border-radius:14px;border:1px solid var(--border);background:var(--card-bg);color:var(--text-muted);cursor:pointer;font-family:inherit;font-weight:600;transition:var(--transition);display:inline-flex;align-items:center;gap:5px}
.col-toggles-actions button:hover{border-color:var(--brand-500);color:var(--brand-600);background:var(--hover-bg)}
.logo-size-row{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:6px}
.stats-filter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px;background:var(--card-bg);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);border:1px solid var(--card-border);margin-bottom:16px;border-right:3px solid var(--brand-500)}
.stats-filter-bar .stats-filter-label{font-size:12px;font-weight:700;color:var(--text-muted);display:inline-flex;align-items:center;gap:5px;margin-left:4px}
.stats-filter-btn{padding:8px 16px;border:1.5px solid var(--border);background:var(--bg);color:var(--text-secondary);border-radius:20px;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:600;transition:var(--transition);display:inline-flex;align-items:center;gap:5px}
.stats-filter-btn:hover{border-color:var(--brand-400);color:var(--brand-600);transform:translateY(-1px)}
.stats-filter-btn.active{background:linear-gradient(180deg,var(--brand-500),var(--brand-700));color:#fff;border-color:var(--brand-700);box-shadow:0 4px 10px rgba(66,102,232,.3)}
.stats-custom-range{display:none;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:var(--bg);border-radius:var(--radius-md);border:1px solid var(--border)}
.stats-custom-range.show{display:inline-flex}
.stats-custom-range label{font-size:12px;color:var(--text-muted);font-weight:600}
.stats-custom-range input[type="date"]{width:auto;padding:6px 10px;font-size:12.5px;height:auto}
.row-checkbox{width:18px;height:18px;cursor:pointer;accent-color:var(--brand-500);vertical-align:middle;margin:0}
.row-checkbox:disabled{opacity:.4;cursor:not-allowed}
.selection-info{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:var(--brand-50);border:1px solid rgba(66,102,232,.28);border-radius:20px;font-size:12px;font-weight:700;color:var(--brand-700)}
[data-theme="dark"] .selection-info{color:var(--brand-300);border-color:rgba(104,144,250,.35)}
.selection-info.has-selection{background:linear-gradient(135deg,var(--success-50),rgba(12,185,123,.1));border-color:rgba(12,185,123,.35);color:var(--success-700)}
[data-theme="dark"] .selection-info.has-selection{color:#6ee7b7;border-color:rgba(12,185,123,.4)}
#loadingOverlay{display:none;position:fixed;inset:0;background:rgba(7,11,21,.85);z-index:9999;align-items:center;justify-content:center;flex-direction:column;gap:22px;color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#loadingOverlay.show{display:flex}
.spinner{width:62px;height:62px;border:4px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:15px;font-weight:500;letter-spacing:.3px;text-align:center;max-width:80vw}
.login-loading-progress{width:220px;height:4px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden}
.login-loading-progress .bar{height:100%;background:linear-gradient(90deg,var(--brand-300),var(--brand-500));width:0%;transition:width .3s ease;border-radius:2px}
#loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;position:relative;overflow:hidden}
[data-theme="light"] #loginScreen{background:radial-gradient(circle at 15% 15%,rgba(104,144,250,.35),transparent 45%),radial-gradient(circle at 85% 85%,rgba(167,139,250,.3),transparent 45%),radial-gradient(circle at 50% 50%,rgba(20,184,166,.12),transparent 60%),linear-gradient(135deg,#dbe7ff 0%,#eef4ff 45%,#f2edfe 100%)}
[data-theme="dark"] #loginScreen{background:radial-gradient(circle at 15% 15%,rgba(66,102,232,.4),transparent 45%),radial-gradient(circle at 85% 85%,rgba(124,58,237,.35),transparent 45%),radial-gradient(circle at 50% 50%,rgba(20,184,166,.12),transparent 60%),linear-gradient(135deg,#060810 0%,#0d1422 45%,#1a2870 100%)}
#loginScreen::before{content:'';position:absolute;top:-50%;right:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(66,102,232,.1) 0%,transparent 60%);animation:scRotate 30s linear infinite;pointer-events:none}
.login-box{position:relative;background:var(--card-bg);padding:44px 40px;border-radius:var(--radius-xl);width:480px;max-width:92vw;animation:slideUp .4s ease;max-height:92vh;overflow-y:auto;border:1px solid var(--card-border)}
[data-theme="light"] .login-box{box-shadow:0 30px 80px rgba(31,58,123,.18),0 0 0 1px rgba(255,255,255,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
[data-theme="dark"] .login-box{box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.05)}
.login-logo{text-align:center;margin-bottom:8px;display:flex;justify-content:center;color:var(--brand-600)}
[data-theme="dark"] .login-logo{color:var(--brand-400)}
.login-logo svg{width:54px;height:54px;display:block}
.login-box h1{color:var(--text);margin-bottom:6px;font-size:24px;text-align:center;font-weight:700;letter-spacing:-.3px}
.login-box .subtitle{color:var(--text-muted);margin-bottom:28px;font-size:13px;text-align:center}
.login-box label{display:block;font-size:13px;color:var(--text-secondary);margin-bottom:6px;margin-top:14px;font-weight:600}
.login-box input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius-md);font-size:14px;font-family:inherit;transition:var(--transition);background:var(--card-bg);color:var(--text)}
.login-box input:hover{border-color:var(--border-strong)}
.login-box input:focus{outline:none;border-color:var(--brand-500);box-shadow:0 0 0 4px var(--focus-ring);background:var(--card-bg)}
.login-box button.primary{width:100%;height:48px;margin-top:22px;background:linear-gradient(180deg,#6890fa 0%,#4266e8 55%,#2d4cd9 100%);color:#fff;border:none;border-radius:var(--radius-md);font-size:15px;font-weight:600;cursor:pointer;transition:var(--transition);letter-spacing:.3px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;box-shadow:0 1px 3px rgba(29,49,147,.35),var(--shadow-inset)}
[data-theme="dark"] .login-box button.primary{background:linear-gradient(180deg,var(--brand-500),var(--brand-600))}
.login-box button.primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 28px rgba(66,102,232,.5),var(--shadow-inset)}
.login-box button.primary:disabled{opacity:.6;cursor:not-allowed}
.admin-toggle-link{text-align:center;margin-top:18px;font-size:12px}
.admin-toggle-link a{color:var(--text-muted);text-decoration:none;border-bottom:1px dashed var(--border);padding-bottom:2px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:var(--transition)}
.admin-toggle-link a:hover{color:var(--brand-600);border-bottom-color:var(--brand-500)}
[data-theme="dark"] .admin-toggle-link a:hover{color:var(--brand-400)}
.admin-token-section{display:none;margin-top:16px;padding-top:16px;border-top:2px dashed var(--border)}
.admin-token-section.show{display:block;animation:fadeSlide .3s ease}
.admin-token-section .admin-header{display:flex;align-items:center;gap:8px;color:var(--brand-700);font-weight:700;font-size:14px;margin-bottom:12px;padding:10px 14px;background:var(--brand-50);border-radius:var(--radius-md);border-right:3px solid var(--brand-500)}
[data-theme="dark"] .admin-token-section .admin-header{color:var(--brand-400)}
.key-status{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:var(--radius-md);font-size:13px;margin-top:10px}
.key-status.saved{background:linear-gradient(135deg,var(--success-50),rgba(12,185,123,.08));color:var(--success-700);border:1px solid rgba(6,148,99,.28)}
[data-theme="dark"] .key-status.saved{color:#6ee7b7;border-color:rgba(12,185,123,.3)}
.key-status.missing{background:linear-gradient(135deg,var(--warning-50),rgba(245,163,24,.08));color:var(--warning-700);border:1px solid rgba(217,125,7,.28)}
[data-theme="dark"] .key-status.missing{color:#fcd34d;border-color:rgba(245,163,24,.3)}
.key-status button{margin-right:auto;padding:5px 12px;font-size:11px;border-radius:6px;background:rgba(0,0,0,.08);border:none;cursor:pointer;color:inherit;font-weight:600;font-family:inherit}
.login-error{color:var(--danger-600);font-size:13px;margin-top:12px;text-align:center;white-space:pre-line;line-height:1.6;background:var(--danger-50);padding:12px 16px;border-radius:var(--radius-md);display:none;border:1px solid rgba(215,38,61,.22)}
[data-theme="dark"] .login-error{color:#fca5a5;border-color:rgba(239,61,82,.3)}
.login-error.show{display:block;animation:shake .3s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.login-loading{color:var(--brand-600);font-size:12px;margin-top:8px;text-align:center}
[data-theme="dark"] .login-loading{color:var(--brand-400)}
#app{display:none}
header{color:#fff;padding:0 22px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;height:60px}
[data-theme="light"] header{background:linear-gradient(135deg,#4266e8 0%,#6890fa 55%,#93b4fe 100%);box-shadow:0 3px 20px rgba(66,102,232,.3),inset 0 1px 0 rgba(255,255,255,.25);border-bottom:1px solid rgba(255,255,255,.15)}
[data-theme="dark"] header{background:linear-gradient(135deg,#060810 0%,#0d1422 55%,#1a2870 100%);box-shadow:0 2px 14px rgba(0,0,0,.6);border-bottom:1px solid rgba(104,144,250,.18)}
header .brand{display:flex;align-items:center;gap:11px}
header .brand-logo{display:inline-flex!important;align-items:center;justify-content:center;width:34px;height:34px;background:rgba(255,255,255,.2);border-radius:var(--radius-md);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
header .brand-logo svg{width:20px;height:20px;display:block}
header h1{font-size:16px;font-weight:600;letter-spacing:.2px}
.user-info{display:flex;align-items:center;gap:8px;font-size:13px}
.user-chip{display:inline-flex!important;align-items:center;gap:8px;background:rgba(255,255,255,.16);padding:6px 13px;border-radius:20px;font-size:12.5px;border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.user-chip .ico{width:14px;height:14px;opacity:.9}
.session-timer{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.12);padding:5px 10px;border-radius:14px;font-size:11px;font-weight:600;border:1px solid rgba(255,255,255,.1)}
.session-timer.warning{background:rgba(245,163,24,.35);color:#fff7e0;border-color:rgba(245,163,24,.5)}
.session-timer.danger{background:rgba(239,61,82,.45);animation:pulseRed 1s infinite;border-color:rgba(239,61,82,.6)}
@keyframes pulseRed{0%,100%{opacity:1}50%{opacity:.7}}
.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--slate-400);transition:var(--transition)}
.status-dot.online{background:#4be0a8;box-shadow:0 0 8px #4be0a8;animation:pulseGreen 2s infinite}
.status-dot.sync{background:#93b4fe;animation:pulseBlue 1s infinite}
@keyframes pulseGreen{0%,100%{box-shadow:0 0 8px #4be0a8}50%{box-shadow:0 0 16px #4be0a8}}
@keyframes pulseBlue{0%,100%{opacity:1}50%{opacity:.3}}
nav{background:var(--card-bg);padding:0 22px;display:flex;gap:2px;overflow-x:auto;position:sticky;top:60px;z-index:99;border-bottom:1px solid var(--border);scroll-behavior:smooth}
[data-theme="light"] nav{box-shadow:0 2px 12px rgba(31,58,123,.06)}
[data-theme="dark"] nav{box-shadow:0 1px 3px rgba(0,0,0,.5)}
nav button{background:transparent;color:var(--text-muted);border:none;padding:15px 20px;cursor:pointer;font-size:13.5px;font-weight:500;border-bottom:2.5px solid transparent;white-space:nowrap;transition:var(--transition);display:inline-flex!important;align-items:center;gap:8px;font-family:inherit;flex-wrap:nowrap;position:relative;flex-shrink:0}
nav button>*{display:inline-flex;align-items:center;line-height:1}
nav button .ico{width:16px;height:16px}
nav button:hover{color:var(--brand-600);background:var(--hover-bg)}
[data-theme="dark"] nav button:hover{color:var(--brand-400)}
nav button.active{color:var(--brand-700);border-bottom-color:var(--brand-600);font-weight:700;background:var(--brand-50)}
[data-theme="dark"] nav button.active{color:var(--brand-400);border-bottom-color:var(--brand-400)}
main{padding:22px;max-width:1700px;margin:0 auto}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px}
.dash-card{background:var(--card-bg);padding:22px;border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);cursor:pointer;transition:var(--transition);border:1px solid var(--card-border);position:relative;overflow:hidden}
.dash-card::before{content:'';position:absolute;top:0;right:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--brand-400),var(--brand-600));transition:width .25s}
.dash-card:hover::before{width:6px}
.dash-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--brand-300)}
[data-theme="light"] .dash-card:hover{border-color:var(--brand-400)}
[data-theme="dark"] .dash-card:hover{border-color:var(--brand-500)}
.dash-card .icon{margin-bottom:10px;display:inline-flex!important;align-items:center;justify-content:center;width:56px;height:56px;border-radius:var(--radius-md);background:linear-gradient(135deg,var(--brand-50),rgba(104,144,250,.18));color:var(--brand-600);border:1px solid rgba(66,102,232,.16)}
[data-theme="dark"] .dash-card .icon{color:var(--brand-400);border-color:rgba(104,144,250,.24)}
.dash-card .icon svg{width:26px;height:26px}
.dash-card h3{color:var(--text);font-size:15px;margin-bottom:3px;font-weight:700}
.dash-card p{color:var(--text-muted);font-size:12px}
.dash-card.green::before{background:linear-gradient(180deg,var(--success-500),var(--success-600))}
.dash-card.green .icon{background:linear-gradient(135deg,var(--success-50),rgba(12,185,123,.2));color:var(--success-600);border-color:rgba(6,148,99,.2)}
[data-theme="dark"] .dash-card.green .icon{color:#34d399;border-color:rgba(12,185,123,.28)}
.dash-card.purple::before{background:linear-gradient(180deg,var(--violet-500),var(--violet-600))}
.dash-card.purple .icon{background:linear-gradient(135deg,var(--violet-50),rgba(124,58,237,.2));color:var(--violet-600);border-color:rgba(124,58,237,.2)}
[data-theme="dark"] .dash-card.purple .icon{color:#a78bfa;border-color:rgba(124,58,237,.28)}
.dash-card.orange::before{background:linear-gradient(180deg,var(--orange-500),var(--orange-600))}
.dash-card.orange .icon{background:linear-gradient(135deg,var(--orange-50),rgba(234,88,12,.2));color:var(--orange-600);border-color:rgba(234,88,12,.2)}
[data-theme="dark"] .dash-card.orange .icon{color:#fb923c;border-color:rgba(234,88,12,.28)}
.section-title-dash{color:var(--text);font-size:15px;font-weight:700;margin:22px 0 12px;display:flex;align-items:center;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.section-title-dash .ico{width:17px;height:17px;color:var(--brand-600)}
[data-theme="dark"] .section-title-dash .ico{color:var(--brand-400)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:22px}
.stat{background:var(--card-bg);padding:18px 16px;border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);transition:var(--transition);position:relative;overflow:hidden;border:1px solid var(--card-border);border-right:3px solid var(--brand-500)}
[data-theme="light"] .stat{background:linear-gradient(180deg,#ffffff 0%,#fafbff 100%)}
.stat:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.stat .stat-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.stat .stat-icon{width:36px;height:36px;border-radius:var(--radius-sm);display:inline-flex!important;align-items:center;justify-content:center;background:rgba(66,102,232,.12);color:var(--brand-600);flex-shrink:0}
[data-theme="dark"] .stat .stat-icon{background:rgba(104,144,250,.18);color:var(--brand-400)}
.stat .stat-icon svg{width:17px;height:17px}
.stat .trend{font-size:10px;font-weight:700;display:inline-flex;align-items:center;gap:2px;padding:3px 7px;border-radius:10px;white-space:nowrap}
.stat .trend.up{color:var(--success-700);background:var(--success-100)}
.stat .trend.down{color:var(--danger-700);background:var(--danger-100)}
.stat .trend.flat{color:var(--slate-500);background:var(--slate-100)}
[data-theme="dark"] .stat .trend.up{background:rgba(12,185,123,.18);color:#6ee7b7}
[data-theme="dark"] .stat .trend.down{background:rgba(239,61,82,.18);color:#fca5a5}
[data-theme="dark"] .stat .trend.flat{background:rgba(148,163,184,.18);color:#cbd5e1}
.stat .num{font-size:28px;font-weight:800;color:var(--text);line-height:1.1;letter-spacing:-.5px}
.stat .num.small{font-size:22px}
.stat .lbl{color:var(--text-muted);font-size:11.5px;margin-top:4px;font-weight:500}
.stat .sub{font-size:10.5px;color:var(--text-muted);margin-top:6px;opacity:.85}
.stat.red{border-right-color:var(--danger-500)}
.stat.red .stat-icon{background:rgba(239,61,82,.12);color:var(--danger-600)}
[data-theme="dark"] .stat.red .stat-icon{background:rgba(239,61,82,.18);color:#f87171}
.stat.green{border-right-color:var(--success-500)}
.stat.green .stat-icon{background:rgba(12,185,123,.12);color:var(--success-600)}
[data-theme="dark"] .stat.green .stat-icon{background:rgba(12,185,123,.18);color:#34d399}
.stat.purple{border-right-color:var(--violet-500)}
.stat.purple .stat-icon{background:rgba(124,58,237,.12);color:var(--violet-600)}
[data-theme="dark"] .stat.purple .stat-icon{background:rgba(124,58,237,.18);color:#a78bfa}
.stat.orange{border-right-color:var(--orange-500)}
.stat.orange .stat-icon{background:rgba(234,88,12,.12);color:var(--orange-600)}
[data-theme="dark"] .stat.orange .stat-icon{background:rgba(234,88,12,.18);color:#fb923c}
.stat.teal{border-right-color:var(--teal-500)}
.stat.teal .stat-icon{background:rgba(20,184,166,.12);color:var(--teal-600)}
[data-theme="dark"] .stat.teal .stat-icon{background:rgba(20,184,166,.18);color:#5eead4}
.stat.pink{border-right-color:var(--pink-500)}
.stat.pink .stat-icon{background:rgba(236,72,153,.12);color:var(--pink-600)}
[data-theme="dark"] .stat.pink .stat-icon{background:rgba(236,72,153,.18);color:#f472b6}
.stat .progress-bar{width:100%;height:5px;background:var(--slate-100);border-radius:3px;overflow:hidden;margin-top:8px}
[data-theme="dark"] .stat .progress-bar{background:rgba(255,255,255,.06)}
.stat .progress-bar .fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--brand-500),var(--brand-400));transition:width .6s ease}
.stat .progress-bar .fill.green{background:linear-gradient(90deg,var(--success-500),#4be0a8)}
.stat .progress-bar .fill.red{background:linear-gradient(90deg,var(--danger-500),#f9717f)}
.stat .progress-bar .fill.purple{background:linear-gradient(90deg,var(--violet-500),#a78bfa)}
.analytics-row{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:16px;margin-bottom:22px}
.analytics-row.cols-2{grid-template-columns:1fr 1fr}
@media(max-width:1200px){.analytics-row{grid-template-columns:1fr 1fr}}
@media(max-width:750px){.analytics-row,.analytics-row.cols-2{grid-template-columns:1fr}}
.analytics-card{background:var(--card-bg);padding:18px 20px;border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);border:1px solid var(--card-border)}
[data-theme="light"] .analytics-card{background:linear-gradient(180deg,#ffffff 0%,#fafbff 100%)}
.analytics-card h4{color:var(--text);font-size:13.5px;margin-bottom:14px;font-weight:700;display:flex!important;align-items:center;gap:8px}
.analytics-card h4 .ico{width:15px;height:15px;color:var(--brand-600)}
[data-theme="dark"] .analytics-card h4 .ico{color:var(--brand-400)}
.donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.donut{position:relative;width:130px;height:130px;flex-shrink:0}
.donut svg{transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:15;transition:stroke-dashoffset .8s ease}
.donut .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut .center .big{font-size:22px;font-weight:800;color:var(--text);line-height:1;letter-spacing:-.5px}
.donut .center .small{font-size:10px;color:var(--text-muted);margin-top:3px}
.donut-legend{flex:1;display:flex;flex-direction:column;gap:7px;min-width:130px}
.legend-item{display:flex;align-items:center;gap:8px;font-size:12px;padding:4px 0}
.legend-item .dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.legend-item .name{flex:1;color:var(--text-secondary)}
.legend-item .val{font-weight:700;color:var(--text)}
.legend-item .pct{font-size:10.5px;color:var(--text-muted);font-weight:500;margin-right:6px}
.top-list{display:flex;flex-direction:column;gap:7px}
.top-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);background:var(--bg);font-size:12px;transition:var(--transition);border:1px solid transparent}
.top-item:hover{background:var(--hover-bg);border-color:var(--border)}
.top-item .rank{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(180deg,var(--slate-400),var(--slate-500));color:#fff;font-size:11px;font-weight:800;flex-shrink:0;box-shadow:0 1px 3px rgba(15,23,42,.2),inset 0 1px 0 rgba(255,255,255,.2)}
.top-item .rank.gold{background:linear-gradient(145deg,var(--gold-1) 0%,var(--gold-2) 55%,var(--gold-3) 100%);color:#4a2c00;box-shadow:0 3px 10px rgba(240,168,36,.55),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(120,70,0,.25);text-shadow:0 1px 0 rgba(255,255,255,.3)}
.top-item .rank.silver{background:linear-gradient(145deg,var(--silver-1) 0%,var(--silver-2) 55%,var(--silver-3) 100%);color:#2b3342;box-shadow:0 3px 10px rgba(148,163,184,.45),inset 0 1px 0 rgba(255,255,255,.75),inset 0 -1px 0 rgba(90,100,115,.2);text-shadow:0 1px 0 rgba(255,255,255,.5)}
.top-item .rank.bronze{background:linear-gradient(145deg,var(--bronze-1) 0%,var(--bronze-2) 55%,var(--bronze-3) 100%);color:#fff;box-shadow:0 3px 10px rgba(183,107,50,.5),inset 0 1px 0 rgba(255,255,255,.3),inset 0 -1px 0 rgba(80,40,10,.3);text-shadow:0 1px 1px rgba(80,40,10,.35)}
.top-item .name{flex:1;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-item .count{font-weight:700;color:var(--brand-700)}
[data-theme="dark"] .top-item .count{color:var(--brand-400)}
.top-item .bar-mini{width:50px;height:5px;background:var(--slate-200);border-radius:3px;overflow:hidden;flex-shrink:0}
[data-theme="dark"] .top-item .bar-mini{background:rgba(255,255,255,.08)}
.top-item .bar-mini .fill{height:100%;background:linear-gradient(90deg,var(--brand-500),var(--brand-400));border-radius:3px;transition:width .5s ease}
.empty-top{color:var(--text-muted);text-align:center;padding:18px 0;font-size:12px}
.sparkline{background:var(--card-bg);padding:18px 20px;border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);margin-bottom:22px;border:1px solid var(--card-border)}
[data-theme="light"] .sparkline{background:linear-gradient(180deg,#ffffff 0%,#fafbff 100%)}
.sparkline h4{color:var(--text);font-size:13.5px;margin-bottom:14px;font-weight:700;display:flex!important;align-items:center;gap:8px}
.sparkline h4 .ico{width:15px;height:15px;color:var(--brand-600)}
.sparkline svg{width:100%;height:100px}
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:6px}
.metric-box{background:var(--bg);border-radius:var(--radius-md);padding:14px 12px;text-align:center;border:1px solid var(--border);transition:var(--transition)}
.metric-box:hover{border-color:var(--brand-300);box-shadow:var(--shadow-sm);transform:translateY(-2px)}
[data-theme="dark"] .metric-box{background:rgba(255,255,255,.03)}
[data-theme="dark"] .metric-box:hover{border-color:var(--brand-500)}
.metric-box .mv{font-size:22px;font-weight:800;color:var(--text);line-height:1;letter-spacing:-.5px}
.metric-box .mv.green{color:var(--success-600)}
.metric-box .mv.red{color:var(--danger-600)}
.metric-box .mv.purple{color:var(--violet-600)}
[data-theme="dark"] .metric-box .mv.green{color:#34d399}
[data-theme="dark"] .metric-box .mv.red{color:#f87171}
[data-theme="dark"] .metric-box .mv.purple{color:#a78bfa}
.metric-box .ml{font-size:11px;color:var(--text-muted);margin-top:5px;font-weight:500}
.time-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.time-stat{background:linear-gradient(135deg,var(--brand-50),rgba(104,144,250,.05));border-radius:var(--radius-md);padding:14px;text-align:center;border:1px solid rgba(66,102,232,.2);transition:var(--transition)}
.time-stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm);border-color:var(--brand-400)}
[data-theme="dark"] .time-stat{background:linear-gradient(135deg,rgba(104,144,250,.14),rgba(104,144,250,.03));border-color:rgba(104,144,250,.25)}
.time-stat .tv{font-size:26px;font-weight:800;color:var(--brand-700);line-height:1;letter-spacing:-.5px}
[data-theme="dark"] .time-stat .tv{color:var(--brand-400)}
.time-stat .tl{font-size:11px;color:var(--text-muted);margin-top:5px;font-weight:600}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filter-bar{display:flex!important;gap:11px;flex-wrap:wrap;align-items:center;padding:13px 16px;background:var(--card-bg);border-radius:var(--radius-lg);margin-bottom:14px;box-shadow:var(--shadow-sm);border:1px solid var(--card-border);border-right:3px solid var(--brand-500)}
.filter-bar>span{display:inline-flex;align-items:center;gap:5px}
.filter-bar label{font-size:12px;color:var(--text-secondary);font-weight:600}
.filter-bar input,.filter-bar select{width:auto;padding:7px 11px;font-size:12.5px;height:34px}
.filter-bar .btn{height:34px;padding:0 13px;font-size:12.5px}
input,select,textarea{padding:10px 13px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:13.5px;font-family:inherit;width:100%;transition:var(--transition);background:var(--card-bg);color:var(--text)}
input:hover,select:hover,textarea:hover{border-color:var(--border-strong)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand-500);box-shadow:0 0 0 4px var(--focus-ring)}

.activity-list{background:var(--card-bg);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:8px;border:1px solid var(--card-border)}

.activity-item .activity-icon.warning{background:var(--warning-50);color:var(--warning-600)}
[data-theme="dark"] .activity-item .activity-icon{color:var(--brand-400)}

[data-theme="dark"] .activity-item .activity-icon.warning{color:#fcd34d}
.activity-item .activity-body{flex:1;min-width:0}

.activity-filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;padding:12px 14px;background:var(--card-bg);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);border:1px solid var(--card-border);border-right:3px solid var(--brand-500)}
.activity-search-box{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:0 12px;transition:var(--transition)}

.activity-stats{display:flex;gap:18px;flex-wrap:wrap;padding:10px 14px;margin-bottom:12px;background:linear-gradient(135deg,var(--brand-50),rgba(104,144,250,.03));border-radius:var(--radius-md);font-size:12.5px;color:var(--text-muted);border:1px solid rgba(66,102,232,.2)}

[data-theme="dark"] .activity-stats b{color:var(--brand-400)}
.activity-pagination{margin-top:14px;padding:14px;background:var(--card-bg);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);border:1px solid var(--card-border)}

.pg-btn{width:36px;height:36px;border:1.5px solid var(--border);background:var(--card-bg);color:var(--text-secondary);border-radius:var(--radius-sm);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:var(--transition);font-family:inherit}
.pg-btn:hover:not(:disabled){background:var(--hover-bg);border-color:var(--brand-500);color:var(--brand-600);transform:translateY(-1px)}

.pg-btn .ico{width:14px;height:14px}
.pg-num{min-width:36px;height:36px;padding:0 10px;border:1.5px solid var(--border);background:var(--card-bg);color:var(--text-secondary);border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-weight:600;transition:var(--transition);font-family:inherit}

.pg-num.active{background:linear-gradient(180deg,var(--brand-500),var(--brand-700));color:#fff;border-color:var(--brand-700);font-weight:700;box-shadow:0 4px 10px rgba(66,102,232,.35),inset 0 1px 0 rgba(255,255,255,.2)}

.custom-field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px;background:var(--bg);border-radius:var(--radius-md);border:1px solid var(--border);margin-bottom:8px;transition:var(--transition);position:relative}

.task-card{padding:14px;border-radius:var(--radius-md);background:var(--bg);border:1px solid var(--border);margin-bottom:8px;transition:var(--transition);position:relative;border-right:3px solid var(--brand-500)}

.group-card{padding:14px 16px;border-radius:var(--radius-lg);background:var(--bg);border:1px solid var(--border);margin-bottom:12px;transition:var(--transition);border-right:3px solid var(--brand-500)}
.group-card:hover{border-color:var(--brand-300);box-shadow:var(--shadow-md)}

/* ══════════════════════════════════════════════════════════════
   FUZZY SEARCH
   ══════════════════════════════════════════════════════════════ */
function normalizeArabic(str) {
  return String(str || '')
    .replace(/[أإآٱا]/g, 'ا').replace(/[ىي]/g, 'ي').replace(/[ةه]/g, 'ه')
    .replace(/[ؤو]/g, 'و').replace(/[ئ]/g, 'ي')
    .replace(/[\u064B-\u065F\u0670]/g, '')
    .replace(/\s+/g, ' ').trim().toLowerCase();
}
function fuzzyMatch(text, query) {
  if (!query) return true;
  const t = normalizeArabic(text);
  const q = normalizeArabic(query);
  if (!q) return true;
  if (t.includes(q)) return true;
  const tNoSpace = t.replace(/\s+/g, '');
  const qNoSpace = q.replace(/\s+/g, '');
  if (tNoSpace.includes(qNoSpace)) return true;
  const qWords = q.split(/\s+/).filter(w => w.length > 0);
  if (qWords.length > 1 && qWords.every(w => t.includes(w))) return true;
  if (q.length >= 3) {
    let qi = 0;
    for (let i = 0; i < t.length && qi < q.length; i++) { if (t[i] === q[qi]) qi++; }
    if (qi === q.length) return true;
  }
  return false;
}
function smartSearch(text, query) {
  if (isFeatureEnabled('featureFuzzySearch')) return fuzzyMatch(text, query);
  return String(text || '').toLowerCase().includes(String(query || '').toLowerCase());
}
function searchOrders(list, query) {
  if (!query || !query.trim()) return list;
  const q = query.trim();
  return list.filter(o => smartSearch(`${o.invoice||''} ${o.customer||''} ${o.customerPhone||''} ${o.location||''} ${o.driver||''} ${o.driverPhone||''} ${o.notes||''} ${o.branch||''}`, q));
}

  const q = query.trim();
  return list.filter(c => smartSearch(`${c.code||''} ${c.name||''} ${c.location||''} ${c.phone||''}`, q));
}

/* ══════════════════════════════════════════════════════════════
   ENCRYPTION
   ══════════════════════════════════════════════════════════════ */
function deriveFixedKey() {
  const s = APP_ID + '|secure|fixed|v3|schema';
  const bytes = new TextEncoder().encode(s);
  const out = new Uint8Array(bytes.length);
  for (let i = 0; i < bytes.length; i++) out[i] = (bytes[i] ^ ((i * 37 + 13) & 0xFF)) & 0xFF;
  return out;
}
function encryptText(text) {
  const keyBytes = deriveFixedKey();
  const dataBytes = new TextEncoder().encode(text);
  const result = new Uint8Array(dataBytes.length);
  for (let i = 0; i < dataBytes.length; i++) result[i] = dataBytes[i] ^ keyBytes[i % keyBytes.length];
  let binary = ''; const chunk = 8192;
  for (let i = 0; i < result.length; i += chunk) binary += String.fromCharCode.apply(null, result.subarray(i, i + chunk));
  return 'DAT:v3:' + btoa(binary);
}
function decryptText(encoded) {
  if (!encoded || !encoded.startsWith('DAT:v3:')) return null;
  try {
    const binary = atob(encoded.substring(7));
    const dataBytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) dataBytes[i] = binary.charCodeAt(i);
    const keyBytes = deriveFixedKey();
    const result = new Uint8Array(dataBytes.length);
    for (let i = 0; i < dataBytes.length; i++) result[i] = dataBytes[i] ^ keyBytes[i % keyBytes.length];
    return new TextDecoder().decode(result);
  } catch { return null; }
}
function isEncrypted(text) { return typeof text === 'string' && text.startsWith('DAT:v3:'); }

/* ══════════════════════════════════════════════════════════════
   CRYPTO
   ══════════════════════════════════════════════════════════════ */
const Crypto = (() => {
  const ITERATIONS = 100000;
  const KEY_LEN = 32;
  const DIGEST = 'SHA-256';
  async function pbkdf2(password, salt, iterations = ITERATIONS) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations, hash: DIGEST }, keyMaterial, KEY_LEN * 8);
    return new Uint8Array(bits);
  }
  function toHex(bytes) { return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join(''); }
  function fromHex(hex) {
    const out = new Uint8Array(hex.length / 2);
    for (let i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i*2, 2), 16);
    return out;
  }
  async function hashPassword(password) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const hash = await pbkdf2(password, salt);
    return { passwordHash: toHex(hash), passwordSalt: toHex(salt), passwordAlgo: `PBKDF2-${DIGEST}-${ITERATIONS}` };
  }
  async function verifyPassword(password, user) {
    if (user.password && !user.passwordHash) {
      const a = String(password), b = String(user.password);
      if (a.length !== b.length) return false;
      let diff = 0;
      for (let i = 0; i < a.length; i++) diff |= a.charCodeAt(i) ^ b.charCodeAt(i);
      return diff === 0;
    }
    if (!user.passwordHash || !user.passwordSalt) return false;
    const algo = user.passwordAlgo || `PBKDF2-${DIGEST}-${ITERATIONS}`;
    const m = algo.match(/PBKDF2-SHA-256-(\d+)/);
    const iterations = m ? parseInt(m[1]) : ITERATIONS;
    const salt = fromHex(user.passwordSalt);
    const hash = await pbkdf2(password, salt, iterations);
    const computed = toHex(hash);
    if (computed.length !== user.passwordHash.length) return false;
    let diff = 0;
    for (let i = 0; i < computed.length; i++) diff |= computed.charCodeAt(i) ^ user.passwordHash.charCodeAt(i);
    return diff === 0;
  }
  function isHashed(user) { return !!(user && user.passwordHash && user.passwordSalt); }
  function needsMigration(user) { return !!(user && user.password && !user.passwordHash); }
  return { hashPassword, verifyPassword, isHashed, needsMigration };
})();

/* ══════════════════════════════════════════════════════════════
   SAVE QUEUE
   ══════════════════════════════════════════════════════════════ */
const SaveQueue = (() => {
  const queues = new Map();
  const stats = { total: 0, succeeded: 0, failed: 0 };
  function enqueue(key, task) {
    stats.total++;
    const prev = queues.get(key) || Promise.resolve();
    const next = prev.catch(() => {}).then(async () => {
      try { const r = await task(); stats.succeeded++; return r; }
      catch (e) { stats.failed++; throw e; }
    });
    queues.set(key, next);
    next.finally(() => { if (queues.get(key) === next) queues.delete(key); });
    return next;
  }
  function drain() { return Promise.all(Array.from(queues.values()).map(p => p.catch(() => {}))); }
  function getStats() { return { ...stats, pending: queues.size }; }
  return { enqueue, drain, getStats };
})();

/* ══════════════════════════════════════════════════════════════
   RETRY
   ══════════════════════════════════════════════════════════════ */
async function withRetry(fn, opts = {}) {
  const maxAttempts = opts.maxAttempts || 3;
  const baseDelay = opts.baseDelay || 400;
  const maxDelay = opts.maxDelay || 5000;
  const retryOn = opts.retryOn || ((e) => {
    const msg = e?.message || '';
    return !msg.includes('authFail') && !msg.includes('rateExceeded') && !msg.includes('CONFLICT');
  });
  let lastErr;
  for (let attempt = 1; attempt <= maxAttempts; attempt++) {
    try { return await fn(); }
    catch (e) {
      lastErr = e;
      if (attempt >= maxAttempts || !retryOn(e)) throw e;
      const delay = Math.min(maxDelay, baseDelay * Math.pow(2, attempt - 1));
      await new Promise(r => setTimeout(r, delay));
    }
  }
  throw lastErr;
}

/* ══════════════════════════════════════════════════════════════
   IN-FLIGHT DEDUP
   ══════════════════════════════════════════════════════════════ */
const InFlight = (() => {
  const map = new Map();
  return {
    async run(key, fn) {
      if (map.has(key)) return map.get(key);
      const p = fn().finally(() => map.delete(key));
      map.set(key, p);
      return p;
    }
  };
})();

/* ══════════════════════════════════════════════════════════════
   STORAGE LAYER
   ══════════════════════════════════════════════════════════════ */
const Storage = (() => {
  const API_BASE = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents`;
  const TREE_API = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/git/trees/${APP_BRANCH}?recursive=1`;
  const SHAs = {};
  const ETags = {};
  let treeDisabled = false;
  function headers(json = false, key = null) {
    const h = { 'Authorization': `Bearer ${getStoredKey()}`, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
    if (json) h['Content-Type'] = 'application/json';
    if (key && ETags[key]) h['If-None-Match'] = ETags[key];
    return h;
  }
  function isMetaPath(path) { return path === 'data/meta.json'; }
  async function _loadData(path, cacheKey) {
    const url = `${API_BASE}/${path}?ref=${APP_BRANCH}&_=${Date.now()}`;
    let res;
    try { res = await fetch(url, { headers: headers(false, cacheKey) }); }
    catch { setOnline(false); throw new Error(MSG.connFail); }
    updateRateLimit(res.headers);
    apiCallCount++;
    if (res.status === 304) { apiCachedCount++; return { notModified: true, data: null }; }
    if (!res.ok) {
      if (res.status === 401) throw new Error(MSG.authFail);
      if (res.status === 403) throw new Error(MSG.rateExceeded);
      if (res.status === 404) return { notModified: false, data: null, notFound: true };
      throw new Error(MSG.loadFail);
    }
    const json = await res.json();
    if (cacheKey) SHAs[cacheKey] = json.sha;
    const etag = res.headers.get('ETag');
    if (etag && cacheKey) ETags[cacheKey] = etag;
    const raw = decodeBase64(json.content);
    if (isMetaPath(path)) { try { return { notModified: false, data: JSON.parse(raw) }; } catch { return { notModified: false, data: null }; } }
    if (isEncrypted(raw)) {
      const dec = decryptText(raw);
      if (dec === null) throw new Error(MSG.readFail);
      try { return { notModified: false, data: JSON.parse(dec) }; } catch { throw new Error(MSG.parseFail); }
    }
    try { return { notModified: false, data: JSON.parse(raw), wasPlain: true }; } catch { return { notModified: false, data: null }; }
  }
  async function loadData(path, cacheKey = null) {
    const dedupKey = `load:${path}:${cacheKey || ''}`;
    return InFlight.run(dedupKey, () => _loadData(path, cacheKey));
  }
  async function _writeFile(path, data, cacheKey, isCreate) {
    const jsonStr = JSON.stringify(data, null, 2);
    const content = isMetaPath(path) ? jsonStr : encryptText(jsonStr);
    const body = { message: isCreate ? 'تهيئة البيانات' : 'تحديث البيانات', content: encodeBase64(content), branch: APP_BRANCH };
    if (!isCreate && cacheKey && SHAs[cacheKey]) body.sha = SHAs[cacheKey];
    let res;
    try { res = await fetch(`${API_BASE}/${path}`, { method: 'PUT', headers: headers(true), body: JSON.stringify(body) }); }
    catch { setOnline(false); throw new Error(MSG.connFail); }
    updateRateLimit(res.headers);
    apiCallCount++;
    if (!res.ok) {
      if (res.status === 409) throw new Error('CONFLICT');
      if (res.status === 404 && !isCreate) throw new Error('NOT_FOUND');
      throw new Error(isCreate ? MSG.createFail : MSG.saveFail);
    }
    const json = await res.json();
    if (cacheKey) { SHAs[cacheKey] = json.content.sha; delete ETags[cacheKey]; }
    return json;
  }
  async function _saveData(path, data, cacheKey) {
    if (cacheKey && SHAs[cacheKey]) {
      try { return await _writeFile(path, data, cacheKey, false); }
      catch (e) {
        if (e.message === 'NOT_FOUND') return _writeFile(path, data, cacheKey, true);
        if (e.message === 'CONFLICT') { try { await _loadData(path, cacheKey); } catch {} return _writeFile(path, data, cacheKey, false); }
        throw e;
      }
    }
    try { return await _writeFile(path, data, cacheKey, true); }
    catch (e) {
      if (e.message === 'CONFLICT') { try { await _loadData(path, cacheKey); } catch {} return _writeFile(path, data, cacheKey, false); }
      throw e;
    }
  }
  async function saveData(path, data, cacheKey = null) {
    const queueKey = cacheKey || path;
    return SaveQueue.enqueue(queueKey, () => withRetry(() => _saveData(path, data, cacheKey), { maxAttempts: 3, baseDelay: 500 }));
  }
  async function deleteFile(path, cacheKey = null) {
    if (!cacheKey || !SHAs[cacheKey]) return false;
    const queueKey = 'del:' + (cacheKey || path);
    return SaveQueue.enqueue(queueKey, async () => {
      const body = { message: 'حذف البيانات', sha: SHAs[cacheKey], branch: APP_BRANCH };
      let res;
      try { res = await fetch(`${API_BASE}/${path}`, { method: 'DELETE', headers: headers(true), body: JSON.stringify(body) }); }
      catch { setOnline(false); throw new Error(MSG.connFail); }
      updateRateLimit(res.headers);
      apiCallCount++;
      if (!res.ok && res.status !== 404) throw new Error(MSG.saveFail);
      delete SHAs[cacheKey]; delete ETags[cacheKey];
      return true;
    });
  }
  async function getTreeShas() {
    if (treeDisabled) return null;
    try {
      const res = await fetch(`${TREE_API}&_=${Date.now()}`, { headers: headers(false) });
      updateRateLimit(res.headers);
      apiCallCount++;
      if (!res.ok) { if (res.status >= 400 && res.status < 500 && res.status !== 403) treeDisabled = true; return null; }
      const json = await res.json();
      const shas = {};
      (json.tree || []).forEach(e => {
        if (!e.path || e.type !== 'blob') return;
        const m1 = e.path.match(/^data\/([^\/]+)\.json$/);
        if (m1) { shas[m1[1]] = e.sha; return; }
        const m2 = e.path.match(/^data\/activity\/(\d{4}-\d{2})\.json$/);
        if (m2) { shas['activity/' + m2[1]] = e.sha; }
      });
      return shas;
    } catch { return null; }
  }
  function resetCache() {
    Object.keys(SHAs).forEach(k => delete SHAs[k]);
    Object.keys(ETags).forEach(k => delete ETags[k]);
    treeDisabled = false;
  }
  return { loadData, saveData, createFile: (p,d,k)=>_writeFile(p,d,k,true), updateFile: (p,d,k)=>_writeFile(p,d,k,false), deleteFile, getTreeShas, resetCache, SHAs };
})();

/* ══════════════════════════════════════════════════════════════
   UNDO / REDO
   ══════════════════════════════════════════════════════════════ */
const UndoRedo = (() => {
  const MAX_HISTORY = 20;
  const undoStack = [];
  const redoStack = [];
  let pending = null;
  function _snapshot() {
    return {
      orders: JSON.parse(JSON.stringify(cache.orders || [])),
      ready: JSON.parse(JSON.stringify(cache.ready || [])),
      log: JSON.parse(JSON.stringify(cache.log || [])),
      customers: JSON.parse(JSON.stringify(cache.customers || [])),
      groups: JSON.parse(JSON.stringify(cache.groups || [])),
      tasks: JSON.parse(JSON.stringify(cache.tasks || []))
    };
  }
  function canUse() { return currentUser && isFeatureEnabled('featureUndoRedo') && hasPerm('undoActions'); }
  function beginBatch(label) {
    if (!canUse()) return false;
    if (pending) return false;
    pending = { id: uid(), label: label || 'عملية', timestamp: Date.now(), user: currentUser?.username || 'system', state: _snapshot() };
    return true;
  }
  function commitBatch() {
    if (!pending) return;
    undoStack.push(pending);
    if (undoStack.length > MAX_HISTORY) undoStack.shift();
    redoStack.length = 0;
    pending = null;
  }
  function cancelBatch() { pending = null; }
  async function undo() {
    if (!canUse()) { toast('لا تملك صلاحية التراجع', 'error'); return false; }
    if (!undoStack.length) { toast('لا يوجد ما يمكن التراجع عنه', 'info'); return false; }
    const snap = undoStack.pop();
    redoStack.push({ id: uid(), label: snap.label, timestamp: snap.timestamp, user: snap.user, state: _snapshot() });
    cache.orders = snap.state.orders; cache.ready = snap.state.ready; cache.log = snap.state.log;
    cache.customers = snap.state.customers; cache.groups = snap.state.groups; cache.tasks = snap.state.tasks;
    postProcessData();
    logActivity('undo', `تراجع: ${snap.label}`, '', 'warning');
    renderActive();
    toast(`✅ تم التراجع: ${snap.label}`, 'success');
    persistKeys(['orders', 'ready', 'log', 'customers', 'groups', 'tasks', 'activity']).catch(() => {});
    return true;
  }
  async function redo() {
    if (!canUse()) { toast('لا تملك صلاحية الإعادة', 'error'); return false; }
    if (!redoStack.length) { toast('لا يوجد ما يمكن إعادته', 'info'); return false; }
    const snap = redoStack.pop();
    undoStack.push({ id: uid(), label: snap.label, timestamp: snap.timestamp, user: snap.user, state: _snapshot() });
    cache.orders = snap.state.orders; cache.ready = snap.state.ready; cache.log = snap.state.log;
    cache.customers = snap.state.customers; cache.groups = snap.state.groups; cache.tasks = snap.state.tasks;
    postProcessData();
    logActivity('redo', `إعادة: ${snap.label}`, '', 'success');
    renderActive();
    toast(`✅ تم الإعادة: ${snap.label}`, 'success');
    persistKeys(['orders', 'ready', 'log', 'customers', 'groups', 'tasks', 'activity']).catch(() => {});
    return true;
  }
  function canUndo() { return canUse() && undoStack.length > 0; }
  function canRedo() { return canUse() && redoStack.length > 0; }
  function getUndoLabel() { return undoStack[undoStack.length - 1]?.label || ''; }
  function getRedoLabel() { return redoStack[redoStack.length - 1]?.label || ''; }
  function clear() { undoStack.length = 0; redoStack.length = 0; pending = null; }
  return { beginBatch, commitBatch, cancelBatch, undo, redo, canUndo, canRedo, getUndoLabel, getRedoLabel, clear };
})();
window.UndoRedo = UndoRedo;
function updateUndoUI() { /* no-op */ }

/* ══════════════════════════════════════════════════════════════
   ✅ SYSTEM NOTIFICATIONS — إشعارات النظام
   (تظهر كإشعارات نظام على جهاز المستخدم من كل المستخدمين)
   ══════════════════════════════════════════════════════════════ */

/* ✅ تتبع الإشعارات التي عُرضت على هذا الجهاز */
const SeenNotifs = {
  KEY: 'oms_seen_notifs',
  get() {
    try { return new Set(JSON.parse(localStorage.getItem(this.KEY) || '[]')); }
    catch { return new Set(); }
  },
  save(set) {
    try { localStorage.setItem(this.KEY, JSON.stringify(Array.from(set).slice(-500))); }
    catch {}
  },
  add(id) { const s = this.get(); s.add(id); this.save(s); },
  has(id) { return this.get().has(id); }
};

/* ✅ عرض إشعار النظام على الجهاز */
function showSystemNotification(n) {
  try {
    if (typeof DeviceNotify === 'undefined') return;
    if (!DeviceNotify.isEnabled()) return;
    if (DeviceNotify.getPermission() !== 'granted') return;
    const iconMap = { success: '✅', error: '❌', warning: '⚠️', info: '🔔' };
    const emoji = iconMap[n.type] || '🔔';
    const author = n.createdBy && n.createdBy !== currentUser?.username ? ` — ${n.createdBy}` : '';
    DeviceNotify.show(`${emoji} ${n.title}${author}`, {
      body: n.message,
      tag: 'oms-notif-' + n.id,
      silent: false
    });
  } catch (_) {}
}

/* ✅ إضافة إشعار جديد → يُحفظ في قاعدة البيانات + يُنشر لكل المستخدمين */
function addNotification(title, message, type = 'info', silent = false) {
  const u = currentUser?.username;
  const n = {
    id: uid(),
    title,
    message,
    type,
    time: fmtDate(),
    ts: Date.now(),
    createdBy: u || 'system'
  };
  if (!Array.isArray(cache.notifications)) cache.notifications = [];
  cache.notifications.unshift(n);
  if (cache.notifications.length > 200) cache.notifications = cache.notifications.slice(0, 200);

  // لا نُظهر إشعاراً لصاحب العملية نفسه (هو يعرف ماذا فعل)
  SeenNotifs.add(n.id);

  // حفظ في قاعدة البيانات — ليراه الآخرون على أجهزتهم
  saveNotificationsExternal().catch(() => {});

  if (!silent) toast(`${title}: ${message}`, type || 'info');
}

/* ✅ حفظ الإشعارات في قاعدة البيانات مباشرة */
async function saveNotificationsExternal() {
  if (!currentUser) return;
  try {
    let remoteData = [];
    try {
      const r = await Storage.loadData(DATA_FILES.notifications, 'notifications');
      if (r && r.data && Array.isArray(r.data)) remoteData = r.data;
    } catch (_) {}

    const byId = new Map();
    remoteData.forEach(n => { if (n && n.id) byId.set(n.id, n); });
    (cache.notifications || []).forEach(n => { if (n && n.id) byId.set(n.id, n); });
    const merged = Array.from(byId.values())
      .sort((a, b) => (b.ts || 0) - (a.ts || 0))
      .slice(0, 200);

    cache.notifications = merged;
    await Storage.saveData(DATA_FILES.notifications, merged, 'notifications');
  } catch (e) {
    console.warn('[Notifications] Save failed:', e);
  }
}

/* ✅ مزامنة الإشعارات من قاعدة البيانات + عرض إشعارات النظام */
async function pullNotificationsExternal() {
  if (!currentUser || syncing) return;
  try {
    const r = await Storage.loadData(DATA_FILES.notifications, 'notifications');
    if (r.notModified) return;
    const remote = Array.isArray(r.data) ? r.data : [];

    const byId = new Map();
    remote.forEach(n => { if (n && n.id) byId.set(n.id, n); });
    (cache.notifications || []).forEach(n => { if (n && n.id) byId.set(n.id, n); });
    cache.notifications = Array.from(byId.values())
      .sort((a, b) => (b.ts || 0) - (a.ts || 0))
      .slice(0, 200);

    const myName = currentUser.username;
    for (const n of cache.notifications) {
      if (SeenNotifs.has(n.id)) continue;
      SeenNotifs.add(n.id);
      if (n.createdBy === myName) continue;
      showSystemNotification(n);
    }
  } catch (e) { /* صامت */ }
}

/* ✅ مزامنة الإشعارات دورياً */

  stopNotifPoll();

}

}

}

/* ══════════════════════════════════════════════════════════════
   RATE LIMIT
   ══════════════════════════════════════════════════════════════ */
function updateRateLimit(headers) {
  const remaining = headers.get('X-RateLimit-Remaining');
  const limit = headers.get('X-RateLimit-Limit');
  const reset = headers.get('X-RateLimit-Reset');
  if (remaining !== null && limit !== null) {
    rateLimitInfo = { remaining: parseInt(remaining), limit: parseInt(limit), reset: reset ? new Date(parseInt(reset) * 1000) : null };
    renderRateLimitWidget(); adjustSyncInterval(); maybeNotifyLowRate();
  }
}
function renderRateLimitWidget() {
  const widget = document.getElementById('rateWidget'); const fill = document.getElementById('rateFill');
  const text = document.getElementById('rateText'); const icon = document.getElementById('rateIcon');
  if (!widget || !fill || !text) return;
  if (icon && !icon.innerHTML) icon.innerHTML = ico('zap', 12);
  if (!rateLimitInfo) { text.textContent = '— / —'; fill.style.width = '0%'; return; }
  const { remaining, limit, reset } = rateLimitInfo;
  const pct = limit > 0 ? Math.max(0, Math.min(100, (remaining / limit) * 100)) : 0;
  fill.style.width = pct + '%';
  text.textContent = `${remaining.toLocaleString('en-US')} / ${limit.toLocaleString('en-US')}`;
  widget.classList.remove('warn','danger');
  if (pct < 10) widget.classList.add('danger'); else if (pct < 30) widget.classList.add('warn');
  const resetStr = reset ? reset.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }) : '—';
  const level = getRateLevel(remaining);
  widget.title = `📊 استهلاك الحصة\nالمتبقي: ${remaining.toLocaleString('en-US')} من ${limit.toLocaleString('en-US')}\nالنسبة: ${pct.toFixed(1)}%\nالمستوى: ${level.label}\nيتجدد الساعة: ${resetStr}`;
}
function getRateLevel(remaining) { for (const lvl of RATE_LEVELS) { if (remaining >= lvl.min) return lvl; } return RATE_LEVELS[RATE_LEVELS.length - 1]; }
function adjustSyncInterval() {
  if (!rateLimitInfo) return;
  const level = getRateLevel(rateLimitInfo.remaining);
  if (level.interval === currentSyncInterval) return;
  currentSyncInterval = level.interval;
  if (!currentUser) return;
  if (currentSyncInterval > 0) startPolling(); else stopPolling();
}
function maybeNotifyLowRate() {
  if (!rateLimitInfo) return;
  const now = Date.now();
  if (now - lastRateNotificationAt < 30 * 60 * 1000) return;
  const pct = rateLimitInfo.limit > 0 ? (rateLimitInfo.remaining / rateLimitInfo.limit) * 100 : 100;
  if (pct < 10) { lastRateNotificationAt = now; addNotification('تنبيه', `استهلاك منخفض للحصة: ${rateLimitInfo.remaining} طلب متبقي`, 'warning', true); }
}

async function loadActivity() {

  } catch (_) {}
  const treeShas = await Storage.getTreeShas();
  if (treeShas) {
    const months = Object.keys(treeShas).filter(k => k.startsWith('activity/')).map(k => k.substring('activity/'.length));
    const results = await Promise.all(months.map(async m => {
      try { return await Storage.loadData(getActivityPath(m), 'activity/' + m); } catch { return null; }
    }));
    results.forEach(r => { if (r && r.data && Array.isArray(r.data)) all.push(...r.data); });
  }
  const seen = new Set();

/* ══════════════════════════════════════════════════════════════
   READ / WRITE
   ══════════════════════════════════════════════════════════════ */
async function readAll(keysToRead = null) {

  const keys = keysToRead || DATA_KEYS.filter(k => k !== 'activity');
  const filesToLoad = new Set();
  for (const k of keys) { if (k === 'activity') continue; const f = KEY_TO_FILE[k]; if (f) filesToLoad.add(f); }
  const errors = [];

    try { fileResults[f] = await Storage.loadData(DATA_FILES[f], f); }
    catch (e) { errors.push(e.message); fileResults[f] = { notModified: false, data: null, notFound: true }; }
  }));
  readAll.lastErrors = errors;
  const sr = fileResults.settings;
  let settingsLoaded = false;
  if (sr && !sr.notModified && sr.data) { applyFileData('settings', sr.data, sr.wasPlain); settingsLoaded = true; }
  if (!settingsLoaded && filesToLoad.has('settings')) {
    let anyLegacy = false;

      try { return { k, r: await Storage.loadData(LEGACY_FILES[k], 'legacy_' + k) }; } catch { return { k, r: null }; }
    }));
    for (const { k, r } of legacyResults) { if (r && r.data) { applyFileData(k, r.data, r.wasPlain); anyLegacy = true; } }
    if (anyLegacy) hasLegacyFiles = true;
  }
  ['orders','ready','log','customers','notifications','groups','tasks'].forEach(f => {

}

}

    if (filesToWrite.size > 0) {

/* ══════════════════════════════════════════════════════════════
   SYNC & POLLING
   ══════════════════════════════════════════════════════════════ */
async function syncPull(force = false) {
  if (syncing || !currentUser) return;
  const now = Date.now();
  if (!force && now - lastSyncTime < SYNC_THROTTLE_MS) return;
  if (currentSyncInterval <= 0 && !force) return;
  lastSyncTime = now; syncing = true;
  try {
    let didChange = false;
    const treeShas = await Storage.getTreeShas();
    if (treeShas) {
      const fileKeys = Object.keys(DATA_FILES);
      const changedFiles = fileKeys.filter(f => { const remoteSha = treeShas[f]; return remoteSha && remoteSha !== Storage.SHAs[f]; });
      const activityRemote = Object.keys(treeShas).filter(k => k.startsWith('activity/'));
      const changedActivity = activityRemote.filter(k => treeShas[k] !== Storage.SHAs[k]);
      if (changedFiles.length) {
        for (const f of changedFiles) {
          try {
            const r = await Storage.loadData(DATA_FILES[f], f);
            if (r.notModified) continue;
            if (f === 'settings') applyFileData('settings', r.data, r.wasPlain);
            else if (f === 'notifications') { continue; }
            else applyFileData(f, r.data, r.wasPlain);
            didChange = true;
          } catch (_) {}
        }
      }
      if (changedActivity.length) { await loadActivity(); didChange = true; }
      if (didChange) postProcessData();
    } else {
      const meta = await readMeta();
      if (!localMeta || meta.lastUpdate !== localMeta.lastUpdate) { localMeta = meta; await readAll(); await loadActivity(); didChange = true; }
    }
    if (didChange) {
      const me = cache.users.find(u => u.username === currentUser.username);
      if (me) currentUser = normalizeUser(me);
      applyPermissionsUI(); renderActive();
    }
    setOnline(true);
  } catch (e) { setOnline(false); }
  finally { syncing = false; }
}

  const a = document.querySelector('.page.active')?.id?.replace('page-', '');
  if (a === 'dashboard') renderDashboard();
  if (a === 'entry') renderEntry();
  if (a === 'ready') renderReady();
  if (a === 'log') renderLog();
  if (a === 'customers') renderCustomers();
  if (a === 'groups') renderGroups();
  if (a === 'tasks') renderTasks();
  if (a === 'settings') renderSettings();
}
function startPolling() { stopPolling(); const interval = currentSyncInterval || SYNC_INTERVAL; if (interval <= 0) return; pollTimer = setInterval(() => syncPull(false), interval); }
function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

/* ══════════════════════════════════════════════════════════════
   ANALYTICS ENGINE
   ══════════════════════════════════════════════════════════════ */
const Analytics = (() => {
  function getAllOrders() { return [...cache.orders, ...cache.ready, ...cache.log]; }
  function getOrderDate(o) { return parseDate(o.createdAt) || parseDate(o.transferredAt) || parseDate(o.archivedAt); }
  function inRange(date, from, to) { if (!date) return false; if (from && date < from) return false; if (to && date >= to) return false; return true; }
  function getPeriodOrders(period) {
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    let from = null, to = null;
    if (period === 'today') { from = today; to = new Date(today.getTime() + 86400000); }
    else if (period === 'week') { from = new Date(today.getTime() - 6 * 86400000); to = new Date(today.getTime() + 86400000); }
    else if (period === 'week-prev') { from = new Date(today.getTime() - 13 * 86400000); to = new Date(today.getTime() - 6 * 86400000); }
    else if (period === 'month') { from = new Date(today.getTime() - 29 * 86400000); to = new Date(today.getTime() + 86400000); }
    else if (period === 'month-prev') { from = new Date(today.getFullYear(), today.getMonth() - 1, 1); to = new Date(today.getFullYear(), today.getMonth(), 1); }
    else if (period === 'quarter') { from = new Date(today.getTime() - 89 * 86400000); to = new Date(today.getTime() + 86400000); }
    else if (period === 'year') { from = new Date(today.getTime() - 364 * 86400000); to = new Date(today.getTime() + 86400000); }
    const all = getAllOrders();
    if (!from && !to) return all;
    return all.filter(o => inRange(getOrderDate(o), from, to));
  }
  function analyzeCustomers(orders = null) {
    const list = orders || getAllOrders();
    const stats = {};
    list.forEach(o => {
      const key = o.customer || '';
      if (!key) return;
      if (!stats[key]) stats[key] = { name: key, count: 0, paid: 0, unpaid: 0, vip: 0, firstOrder: null, lastOrder: null, locations: new Set(), drivers: new Set() };
      const s = stats[key];
      s.count++;
      if (o.pay === 'مدفوع') s.paid++;
      else if (o.pay === 'غير مدفوع') s.unpaid++;
      else if (o.pay === 'VIP') s.vip++;
      const d = getOrderDate(o);
      if (d) { if (!s.firstOrder || d < s.firstOrder) s.firstOrder = d; if (!s.lastOrder || d > s.lastOrder) s.lastOrder = d; }
      if (o.location) s.locations.add(o.location);
      if (o.driver) s.drivers.add(o.driver);
    });

      ...s,
      locations: Array.from(s.locations), drivers: Array.from(s.drivers),
      daysSinceLastOrder: s.lastOrder ? Math.floor((Date.now() - s.lastOrder.getTime()) / 86400000) : null,
      loyaltyScore: s.count * 10 + s.paid * 5 + s.vip * 15,

  }
  function analyzeDrivers(orders = null) {

      const s = stats[o.driver];
      s.total++;
      if (o.receiptStatus === RECEIPT_RECEIVED || o.status === 'جاهز') s.delivered++;
      if (o.pay === 'مدفوع' || o.pay === 'VIP') s.paid++; else s.unpaid++;
      if (o.location) { const loc = o.location.split(/[-–—,]/)[0].trim(); s.locations[loc] = (s.locations[loc] || 0) + 1; }
      if (o.customer) s.customers[o.customer] = (s.customers[o.customer] || 0) + 1;
    });
    return Object.values(stats).map(s => {
      const topLocation = Object.entries(s.locations).sort((a,b) => b[1] - a[1])[0];
      const successRate = s.total > 0 ? Math.round((s.delivered / s.total) * 100) : 0;
      return {
        ...s,
        locations: Object.entries(s.locations).sort((a,b) => b[1] - a[1]).map(([k,v]) => ({ location: k, count: v })),
        topLocation: topLocation ? topLocation[0] : null,
        topLocationCount: topLocation ? topLocation[1] : 0,
        successRate, customersCount: Object.keys(s.customers).length
      };
    });
  }
  function analyzeHours(orders = null) {
    const list = orders || getAllOrders();
    const hours = new Array(24).fill(0);
    list.forEach(o => { const d = getOrderDate(o); if (d) hours[d.getHours()]++; });
    const dayNames = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
    const days = new Array(7).fill(0);
    list.forEach(o => { const d = getOrderDate(o); if (d) days[d.getDay()]++; });
    const maxHour = Math.max(...hours, 1);
    const maxDay = Math.max(...days, 1);

      hours: hours.map((v, i) => ({ hour: i, count: v, percent: Math.round((v / maxHour) * 100) })),
      days: days.map((v, i) => ({ day: i, name: dayNames[i], count: v, percent: Math.round((v / maxDay) * 100) })),
      peakHour: hours.indexOf(Math.max(...hours)),

  }
  function analyzeLocations(orders = null) {
    const list = orders || getAllOrders();
    const stats = {};
    list.forEach(o => {
      if (!o.location) return;
      const loc = o.location.split(/[-–—,]/)[0].trim();
      if (!loc) return;
      if (!stats[loc]) stats[loc] = { location: loc, count: 0, customers: new Set(), drivers: new Set() };
      stats[loc].count++;
      if (o.customer) stats[loc].customers.add(o.customer);

    });
    return Object.values(stats).map(s => ({
      ...s, customersCount: s.customers.size, driversCount: s.drivers.size,
      customers: Array.from(s.customers), drivers: Array.from(s.drivers)
    })).sort((a, b) => b.count - a.count);
  }
  function comparePeriods(period1, period2) {
    const d1 = getPeriodOrders(period1); const d2 = getPeriodOrders(period2);
    const calc = (list) => ({
      total: list.length,

      unpaid: list.filter(o => o.pay === 'غير مدفوع').length,

  }
  function getFullReport(period = 'month') {
    const orders = getPeriodOrders(period);
    return {
      period, generatedAt: fmtDate(),
      totals: {

        paid: orders.filter(o => o.pay === 'مدفوع').length,

        vip: orders.filter(o => o.pay === 'VIP').length,
        delivered: orders.filter(o => o.receiptStatus === RECEIPT_RECEIVED).length,

  }
