function saveDraft() {
  if (!document.getElementById('orderModal').classList.contains('active')) return;
  const draft = { invoice: document.getElementById('orderInvoice').value, branch: document.getElementById('orderBranch').value, customer: document.getElementById('orderCustomer').value, customerId: document.getElementById('orderCustomerId').value, customerPhone: document.getElementById('orderCustomerPhone').value, location: document.getElementById('orderLocation').value, status: document.getElementById('orderStatus').value, pay: document.getElementById('orderPay').value, driver: document.getElementById('orderDriver').value, driverPhone: document.getElementById('orderDriverPhone').value, notes: document.getElementById('orderNotes').value };
  if (draft.invoice || draft.customer) { localStorage.setItem(DRAFT_KEY, JSON.stringify(draft)); document.getElementById('draftBadge').classList.add('show'); }
}
function clearDraft() { localStorage.removeItem(DRAFT_KEY); document.getElementById('draftBadge').classList.remove('show'); }
window.discardDraft = function () { clearDraft(); toast('تم حذف المسودة', 'info'); };
window.restoreDraft = function () {
  const raw = localStorage.getItem(DRAFT_KEY); if (!raw) return;
  try {
    const d = JSON.parse(raw);
    addOrder();
    document.getElementById('orderInvoice').value = d.invoice || '';
    if (d.branch) document.getElementById('orderBranch').value = d.branch;
    document.getElementById('orderCustomer').value = d.customer || '';
    document.getElementById('orderCustomerId').value = d.customerId || '';
    document.getElementById('orderCustomerPhone').value = d.customerPhone || '';
    document.getElementById('orderLocation').value = d.location || '';
    document.getElementById('orderStatus').value = d.status || 'قيد التجهيز';
    document.getElementById('orderPay').value = d.pay || 'غير مدفوع';
    document.getElementById('orderDriver').value = d.driver || '';
    document.getElementById('orderDriverPhone').value = d.driverPhone || '';
    document.getElementById('orderNotes').value = d.notes || '';
    toast('تم الاسترجاع', 'success');
  } catch { clearDraft(); }
};

  document.getElementById('adminToggleIcon').innerHTML = ico('shield2', 13);

  document.getElementById('loginKey').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('loginUser').focus(); });
  document.getElementById('adminNewKey').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); adminChangeKey(); } });

  if (typeSel) typeSel.addEventListener('change', () => { const wrap = document.getElementById('customFieldOptionsWrap'); if (wrap) wrap.style.display = typeSel.value === 'select' ? 'block' : 'none'; });
  if ('serviceWorker' in navigator) {
    const swCode = `self.addEventListener('install', e => self.skipWaiting()); self.addEventListener('activate', e => e.waitUntil(self.clients.claim())); self.addEventListener('fetch', () => {}); self.addEventListener('notificationclick', event => { event.notification.close(); event.waitUntil(self.clients.matchAll({ type: 'window', includeUncontrolled: true }).then(clientList => { if (clientList.length > 0) return clientList[0].focus(); return self.clients.openWindow('/'); })); });`;
    const swBlob = new Blob([swCode], { type: 'text/javascript' });
    const swUrl = URL.createObjectURL(swBlob);
    navigator.serviceWorker.register(swUrl).catch(() => {});
  }
  setTimeout(() => { if (localStorage.getItem(DRAFT_KEY)) document.getElementById('draftBadge').classList.add('show'); }, 500);
  renderRateLimitWidget();
  setOnline(navigator.onLine);
});
window.addEventListener('beforeunload', (e) => {
  if (!currentUser) return;
  const stats = SaveQueue.getStats();
  if (stats.pending > 0) { e.preventDefault(); e.returnValue = 'لا يزال هناك حفظ جارٍ...'; }
  try { flushNotificationsSave(); } catch {}
  try { flushActivitySave(); } catch {}
});

<script>
(function () {
    function prepareTablesForPrint() {
        const tables = document.querySelectorAll('table');
        tables.forEach(function (table) {
            const headers = table.querySelectorAll('thead th');
            let notesIndex = -1;
            headers.forEach(function (th, index) {
                const text = (th.textContent || '').trim().replace(/\s+/g, ' ');
                if (text.includes('ملاحظات') || text.includes('ملاحظة') || text.includes('الملاحظات') || text.toLowerCase().includes('notes')) notesIndex = index;
            });
            const rows = table.querySelectorAll('tr');
            rows.forEach(function (row) {
                const cells = row.querySelectorAll('th, td');
                cells.forEach(function (cell, index) {
                    if (index === notesIndex) { cell.style.whiteSpace = 'normal'; cell.style.overflow = 'visible'; cell.style.textOverflow = 'initial'; cell.style.wordBreak = 'normal'; cell.style.overflowWrap = 'anywhere'; return; }
                    cell.style.whiteSpace = 'nowrap'; cell.style.overflow = 'hidden'; cell.style.textOverflow = 'clip';
                    if (cell.tagName.toLowerCase() === 'td') {
                        let fontSize = 9; cell.style.fontSize = fontSize + 'px';
                        while (cell.scrollWidth > cell.clientWidth && fontSize > 6) { fontSize -= 0.25; cell.style.fontSize = fontSize + 'px'; }
                    }
                });
            });
        });
    }
    window.addEventListener('beforeprint', function () { prepareTablesForPrint(); });
    if (window.matchMedia) {
        const mediaQuery = window.matchMedia('print');
        mediaQuery.addEventListener('change', function (event) { if (event.matches) prepareTablesForPrint(); });
    }
})();
</script>
